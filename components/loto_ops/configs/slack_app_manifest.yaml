_metadata:
  major_version: 1
  minor_version: 1

display_information:
  name: loto-ops-notify
  description: Loto Ops Pipeline result notification
  background_color: "#2c2d30"

features:
  bot_user:
    display_name: loto-ops-notify
    always_online: false

oauth_config:
