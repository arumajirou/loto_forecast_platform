[project]
name = "loto-ops-pipeline"
version = "0.1.11"
description = "Operational pipeline for loto-life scraping, dataset generation, PostgreSQL loading, Streamlit table browser, artifact packaging, and daily scheduling."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pyyaml>=6.0",
  "polars>=1.0",
  "pyarrow>=15.0",
  "joblib>=1.4",
  "requests>=2.31",
]

[project.optional-dependencies]
web = [
  "streamlit>=1.40",
  "plotly>=5.0",
]

[project.scripts]
loto-ops = "loto_ops.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.10",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loto_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
