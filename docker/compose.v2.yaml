services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loto}
      POSTGRES_USER: ${POSTGRES_USER:-loto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loto}"]
      interval: 10s
      timeout: 5s
      retries: 10
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    command: mlflow server --host 0.0.0.0 --port 5050 --backend-store-uri postgresql+psycopg://${POSTGRES_USER:-loto}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-loto} --default-artifact-root /artifacts
    depends_on: {postgres: {condition: service_healthy}}
    volumes: [mlflow_artifacts:/artifacts]
    ports: ["127.0.0.1:5050:5050"]
  ray-head:
    image: rayproject/ray:2.49.0-py312
    command: ray start --head --dashboard-host=0.0.0.0 --block
    shm_size: 4gb
    ports: ["127.0.0.1:8265:8265", "127.0.0.1:6379:6379"]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes: ["../deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", prometheus_data:/prometheus]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes: ["../deploy/grafana/provisioning:/etc/grafana/provisioning:ro", "../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro", grafana_data:/var/lib/grafana]
    ports: ["127.0.0.1:3000:3000"]
  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["127.0.0.1:3100:3100"]
  tempo:
    image: grafana/tempo:2.8.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["../deploy/tempo/tempo.yaml:/etc/tempo.yaml:ro"]
    ports: ["127.0.0.1:3200:3200", "127.0.0.1:4318:4318"]
volumes:
  postgres_data: {}
  mlflow_artifacts: {}
  prometheus_data: {}
  grafana_data: {}
