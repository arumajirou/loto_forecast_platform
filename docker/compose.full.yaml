services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: loto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: loto
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loto -d loto"]
      interval: 10s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.4
    command: >-
      mlflow server --host 0.0.0.0 --port 5050
      --backend-store-uri postgresql+psycopg2://loto:${POSTGRES_PASSWORD}@postgres/loto
      --default-artifact-root /mlartifacts
      --serve-artifacts
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - mlflow-artifacts:/mlartifacts
    ports: ["5050:5050"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ../deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ../deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["uvicorn", "loto.api.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      LOTO_OUTPUT_DIR: /data/latest
      LOTO_REGISTRY_URL: postgresql://loto:${POSTGRES_PASSWORD}@postgres/loto
      LOTO_SEAL_SECRET: ${LOTO_SEAL_SECRET:?set LOTO_SEAL_SECRET}
      LOTO_API_TOKENS: ${LOTO_API_TOKENS:?set LOTO_API_TOKENS}
      MLFLOW_TRACKING_URI: http://mlflow:5050
    volumes:
      - loto-data:/data
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
  loto-data:
