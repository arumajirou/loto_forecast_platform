[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loto-chronos2-runtime"
version = "0.1.0"
description = "Isolated Chronos-2 provider runtime for loto_forecast_platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "chronos-forecasting==2.3.1",
  "torch==2.9.1",
  "transformers==4.57.6",
  "huggingface-hub==0.36.2",
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "pyarrow>=24,<25",
  "safetensors>=0.5,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
