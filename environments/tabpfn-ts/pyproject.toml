[project]
name = "loto-tabpfn-ts-provider"
version = "0.1.0"
description = "Isolated TabPFN-TS provider runtime for loto forecast platform validation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "tabpfn-time-series==1.2.0",
  "tabpfn>=8.2.0,<9",
  "huggingface-hub>=0.23.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "torch>=2.5",
  "gluonts>=0.16.0",
  "datasets>=2.15",
  "fev>=0.6.1",
  "backoff>=2.2.1",
  "python-dotenv>=1.1.0",
  "pyyaml>=6.0.1",
  "statsmodels>=0.14.5",
  "tqdm",
]
