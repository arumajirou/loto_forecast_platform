[project]
name = "loto-sktime-classic-provider"
version = "0.1.0"
description = "Isolated sktime 1.0.1 classic forecasting runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<2.4",
  "pandas>=2.2,<2.4",
  "pydantic>=2.10,<3",
  "sktime==1.0.1",
  "statsmodels>=0.14,<0.15",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[tool.uv]
package = false
