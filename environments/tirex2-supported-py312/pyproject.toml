[project]
name = "loto-tirex2-supported"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tirex-2==0.1.1",
  "torch==2.9.1",
  "numpy>=1.26,<3",
  "huggingface-hub==0.36.2",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
