[project]
name = "loto-timer-base-84m-provider"
version = "0.1.0"
description = "Isolated fail-closed Timer Base 84M provider contract lane"
requires-python = ">=3.10,<3.11"
dependencies = [
  "torch==2.9.1",
  "transformers==4.40.1",
  "huggingface-hub>=0.24,<1",
  "safetensors>=0.4,<1",
  "numpy>=1.26,<3",
  "pydantic>=2.10,<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

