[project]
name = "loto-moirai-provider"
version = "0.1.0"
description = "Isolated Moirai provider runtime for loto forecast platform validation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "uni2ts>=1.2",
  "gluonts>=0.14.3,<0.15",
  "huggingface-hub>=0.24",
  "numpy>=1.26",
  "pandas>=2.2",
  "torch>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
