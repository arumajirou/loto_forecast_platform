[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loto-darts-notorch-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "darts[notorch]==0.46.1",
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.10",
  "PyYAML>=6.0",
]

[tool.uv]
package = false
