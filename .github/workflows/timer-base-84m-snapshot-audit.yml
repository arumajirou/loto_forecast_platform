name: timer-base-84m-snapshot-audit

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/timer-base-84m-snapshot-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Timer Base 84M pinned snapshot byte audit
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      EXPECTED_MAIN_SHA: "704845f26dc527d0c341c1bf0cf8b1b9a6355dd5"
      UV_VERSION: "0.11.21"
      PYTHON_VERSION: "3.13"
      HF_REPO_ID: "thuml/timer-base-84m"
      HF_REVISION: "70077a71acce1b4c00d98332fcaabc694255d8e5"
      EXPECTED_WEIGHT_SHA256: "9c3d18f12ffe1ea7d4fa70eb3304b26e3841164a6a265fbae4f7a05cd213aa3d"
      HF_HUB_DISABLE_TELEMETRY: "1"

    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Verify exact main and workflow-only scope
        run: |
          set -Eeuo pipefail
          case "$(uv --version)" in
            "uv $UV_VERSION"*) ;;
            *) echo "unexpected uv version" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA" HEAD)
          printf 'changed=%s\n' "${changed[@]:-}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = ".github/workflows/timer-base-84m-snapshot-audit.yml"

      - name: Prepare isolated downloader environment
        run: |
          set -Eeuo pipefail
          uv python install "$PYTHON_VERSION"
          venv="$RUNNER_TEMP/timer-base-snapshot-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          snapshot="$RUNNER_TEMP/timer-base-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence="$RUNNER_TEMP/timer-base-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for path in "$venv" "$snapshot" "$evidence"; do
            case "$path" in
              "$RUNNER_TEMP"/*) ;;
              *) echo "unsafe temp path: $path" >&2; exit 1 ;;
            esac
          done
          rm -rf -- "$venv" "$snapshot" "$evidence"
          mkdir -p -- "$evidence"
          uv venv "$venv" --python "$PYTHON_VERSION"
          hf_version="$(
            "$venv/bin/python" - <<'PY'
          import tomllib
          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)
          versions = sorted({p["version"] for p in lock["package"] if p.get("name") == "huggingface-hub"})
          if len(versions) != 1:
              raise SystemExit(f"expected one huggingface-hub version in root lock, got {versions!r}")
          print(versions[0])
          PY
          )"
          uv pip install --quiet --python "$venv/bin/python" "huggingface-hub==$hf_version"
          echo "AUDIT_VENV=$venv" >> "$GITHUB_ENV"
          echo "SNAPSHOT_DIR=$snapshot" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$evidence" >> "$GITHUB_ENV"
          echo "HF_HUB_VERSION=$hf_version" >> "$GITHUB_ENV"
          "$venv/bin/python" --version
          "$venv/bin/python" -c 'import huggingface_hub; print("huggingface_hub=" + huggingface_hub.__version__)'

      - name: Download exact pinned revision without importing remote code
        run: |
          set -Eeuo pipefail
          "$AUDIT_VENV/bin/python" - "$SNAPSHOT_DIR" "$EVIDENCE_DIR" <<'PY'
          import ast
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path, PurePosixPath

          from huggingface_hub import HfApi, hf_hub_download

          repo_id = os.environ["HF_REPO_ID"]
          revision = os.environ["HF_REVISION"]
          expected_weight = os.environ["EXPECTED_WEIGHT_SHA256"]
          snapshot = Path(sys.argv[1]).resolve()
          evidence = Path(sys.argv[2]).resolve()
          snapshot.mkdir(parents=True, exist_ok=False)

          api = HfApi()
          info = api.model_info(repo_id=repo_id, revision=revision, files_metadata=True)
          if info.sha != revision:
              raise SystemExit(f"resolved revision mismatch: expected {revision}, got {info.sha}")
          repo_files = sorted(api.list_repo_files(repo_id=repo_id, revision=revision))
          if not repo_files:
              raise SystemExit("pinned repository returned no files")

          core_required = {
              "README.md",
              "config.json",
              "configuration_timer.py",
              "generation_config.json",
              "model.safetensors",
              "modeling_timer.py",
              "ts_generation_mixin.py",
          }
          missing_core = sorted(core_required - set(repo_files))
          if missing_core:
              raise SystemExit(f"missing required pinned snapshot files: {missing_core}")

          for relative in repo_files:
              pure = PurePosixPath(relative)
              if pure.is_absolute() or ".." in pure.parts or "\\" in relative:
                  raise SystemExit(f"unsafe repository path: {relative!r}")
              local = hf_hub_download(
                  repo_id=repo_id,
                  filename=relative,
                  revision=revision,
                  local_dir=str(snapshot),
              )
              path = Path(local)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"downloaded path is not a regular non-symlink file: {path}")
              path.resolve().relative_to(snapshot)

          records = []
          for relative in repo_files:
              path = snapshot / relative
              data = path.read_bytes()
              records.append(
                  {
                      "path": relative,
                      "size_bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  }
              )
          by_path = {record["path"]: record for record in records}
          weight_actual = by_path["model.safetensors"]["sha256"]
          if weight_actual != expected_weight:
              raise SystemExit(
                  f"weight SHA-256 mismatch: expected {expected_weight}, got {weight_actual}"
              )

          canonical = json.dumps(
              records,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8")
          manifest_sha = hashlib.sha256(canonical).hexdigest()
          manifest = {
              "schema_version": 1,
              "repo_id": repo_id,
              "requested_revision": revision,
              "resolved_revision": info.sha,
              "file_count": len(records),
              "required_core_files": sorted(core_required),
              "files": records,
              "manifest_sha256": manifest_sha,
              "weight_sha256_expected": expected_weight,
              "weight_sha256_actual": weight_actual,
              "trust_remote_code_executed": False,
              "model_import_executed": False,
          }
          (evidence / "SNAPSHOT_MANIFEST.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          (evidence / "REPO_FILES.json").write_text(
              json.dumps(repo_files, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          risky_names = {
              "eval",
              "exec",
              "compile",
              "__import__",
          }
          scan = []
          for relative in (
              "configuration_timer.py",
              "modeling_timer.py",
              "ts_generation_mixin.py",
          ):
              path = snapshot / relative
              source = path.read_text(encoding="utf-8")
              tree = ast.parse(source, filename=relative)
              imports = []
              calls = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      imports.append(node.module or "")
                  elif isinstance(node, ast.Call):
                      if isinstance(node.func, ast.Name):
                          name = node.func.id
                      elif isinstance(node.func, ast.Attribute):
                          parts = []
                          current = node.func
                          while isinstance(current, ast.Attribute):
                              parts.append(current.attr)
                              current = current.value
                          if isinstance(current, ast.Name):
                              parts.append(current.id)
                          name = ".".join(reversed(parts))
                      else:
                          name = type(node.func).__name__
                      if name in risky_names or any(
                          marker in name.lower()
                          for marker in (
                              "subprocess",
                              "system",
                              "popen",
                              "socket",
                              "requests",
                              "http",
                              "urlopen",
                              "download",
                              "torch.load",
                              "pickle",
                          )
                      ):
                          calls.append({"line": getattr(node, "lineno", None), "call": name})
              scan.append(
                  {
                      "path": relative,
                      "sha256": by_path[relative]["sha256"],
                      "imports": sorted(set(imports)),
                      "flagged_calls": calls,
                  }
              )
          (evidence / "REMOTE_CODE_STATIC_SCAN.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "decision": "SUPPORTING_EVIDENCE_ONLY_NO_HUMAN_APPROVAL",
                      "reviewer": None,
                      "trust_remote_code_allowed": False,
                      "files": scan,
                  },
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          print(f"resolved_revision={info.sha}")
          print(f"repo_file_count={len(records)}")
          print(f"weight_sha256={weight_actual}")
          print(f"manifest_sha256={manifest_sha}")
          print("remote_code_executed=false")
          PY

      - name: Verify evidence integrity and non-execution boundary
        run: |
          set -Eeuo pipefail
          "$AUDIT_VENV/bin/python" - "$EVIDENCE_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence = Path(sys.argv[1])
          manifest = json.loads((evidence / "SNAPSHOT_MANIFEST.json").read_text(encoding="utf-8"))
          scan = json.loads((evidence / "REMOTE_CODE_STATIC_SCAN.json").read_text(encoding="utf-8"))
          assert manifest["requested_revision"] == manifest["resolved_revision"]
          assert manifest["weight_sha256_expected"] == manifest["weight_sha256_actual"]
          assert manifest["trust_remote_code_executed"] is False
          assert manifest["model_import_executed"] is False
          assert scan["decision"] == "SUPPORTING_EVIDENCE_ONLY_NO_HUMAN_APPROVAL"
          assert scan["reviewer"] is None
          assert scan["trust_remote_code_allowed"] is False
          print("snapshot_provenance=PASS")
          print("remote_code_human_approval=PENDING")
          PY
          (
            cd "$EVIDENCE_DIR"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Verify repository stayed clean and main race
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Upload provenance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timer-base-84m-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove audit-owned temporary files
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          for path in "${AUDIT_VENV:-}" "${SNAPSHOT_DIR:-}" "${EVIDENCE_DIR:-}"; do
            [[ -z "$path" ]] && continue
            case "$path" in
              "$RUNNER_TEMP"/*) rm -rf -- "$path" ;;
              *) echo "refusing unsafe cleanup path: $path" >&2; exit 1 ;;
            esac
          done
