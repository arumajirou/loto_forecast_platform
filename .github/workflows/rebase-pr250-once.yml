name: rebase-pr250-once

on:
  push:
    branches:
      - feat/unified-campaign-decoder-routing-v1
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', '[pr250-synced]') }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/unified-campaign-decoder-routing-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/main
          rm .github/workflows/rebase-pr250-once.yml
          git add .github/workflows/rebase-pr250-once.yml
          git commit -m 'chore: sync PR250 with current main [pr250-synced]'
          git push origin HEAD:feat/unified-campaign-decoder-routing-v1
