name: autogluon-shared-integration-lintfix

on:
  push:
    branches:
      - feat/autogluon-shared-integration-v1
    paths:
      - .github/workflows/autogluon-shared-integration-lintfix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/autogluon-shared-integration-v1
          persist-credentials: true
          fetch-depth: 0
          clean: true
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.21"
          enable-cache: false
      - name: Apply exact lint-only fixes
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/loto/models/autogluon_shared.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              '            f"game {profile.game_id!r} requires {profile.position_count} positions, got {len(columns)}",\n': (
                  '            f"game {profile.game_id!r} requires {profile.position_count} positions, "\n'
                  '            f"got {len(columns)}",\n'
              ),
              '                "GPU success requires gpu_used=true, CERTIFIED evidence, and positive VRAM evidence",\n': (
                  '                "GPU success requires gpu_used=true, CERTIFIED evidence, "\n'
                  '                "and positive VRAM evidence",\n'
              ),
              '            f"expected {len(expected_items)} horizon-1 predictions, got {len(response.predictions)}",\n': (
                  '            f"expected {len(expected_items)} horizon-1 predictions, "\n'
                  '            f"got {len(response.predictions)}",\n'
              ),
              '            f"expected AutoGluon {TARGET_AUTOGLUON_VERSION}, got {metadata.get(\'library_version\')!r}",\n': (
                  '            f"expected AutoGluon {TARGET_AUTOGLUON_VERSION}, "\n'
                  '            f"got {metadata.get(\'library_version\')!r}",\n'
              ),
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"unexpected E501 replacement count for {old!r}: {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          uvx --from ruff==0.16.0 ruff check --fix \
            src/loto/models/autogluon_shared.py \
            src/loto/models/catalog_full.py \
            src/loto/models/workers.py
          uvx --from ruff==0.16.0 ruff format \
            src/loto/models/autogluon_shared.py \
            src/loto/models/catalog_full.py \
            src/loto/models/workers.py
          uvx --from ruff==0.16.0 ruff format --check \
            src/loto/models/autogluon_shared.py \
            src/loto/models/catalog_full.py \
            src/loto/models/workers.py
          uvx --from ruff==0.16.0 ruff check \
            src/loto/models/autogluon_shared.py \
            src/loto/models/catalog_full.py \
            src/loto/models/workers.py
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -ge 1
          for file in "${changed[@]}"; do
            case "$file" in
              src/loto/models/autogluon_shared.py|src/loto/models/catalog_full.py|src/loto/models/workers.py) ;;
              *) echo "unexpected lint-fix file: $file" >&2; exit 1 ;;
            esac
          done
          git add "${changed[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(autogluon): satisfy shared integration lint"
          git push origin HEAD:feat/autogluon-shared-integration-v1
