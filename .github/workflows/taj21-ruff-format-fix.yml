name: TAJ-21 / one-shot Ruff format fix

on:
  push:
    branches:
      - codex/taj21-resumable-full-oof

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/taj21-resumable-full-oof
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.11.21
          enable-cache: false

      - name: Format only TAJ-21 resumable campaign and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          uvx --from ruff==0.16.4 ruff format src/loto/evaluation/resumable_campaign.py
          rm -- .github/workflows/taj21-ruff-format-fix.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/loto/evaluation/resumable_campaign.py .github/workflows/taj21-ruff-format-fix.yml
          if git diff --cached --quiet; then
            echo "No formatting change was required" >&2
            exit 1
          fi
          git commit -m "style: format TAJ-21 resumable campaign"
          git push origin HEAD:codex/taj21-resumable-full-oof
