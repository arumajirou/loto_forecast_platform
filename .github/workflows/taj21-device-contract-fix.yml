name: TAJ-21 / one-shot resolved-device contract fix

on:
  push:
    branches:
      - codex/taj21-resumable-full-oof

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/taj21-resumable-full-oof
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.11.21
          enable-cache: false

      - name: Bind resolved runtime device into TAJ-21 resume contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/loto/evaluation/resumable_campaign.py")
          source = source_path.read_text(encoding="utf-8")

          old_version = 'RESUME_CONTRACT_SCHEMA_VERSION = "taj21-resume-contract-v1"'
          new_version = 'RESUME_CONTRACT_SCHEMA_VERSION = "taj21-resume-contract-v2"'
          if source.count(old_version) != 1:
              raise SystemExit("resume contract schema marker not found exactly once")
          source = source.replace(old_version, new_version, 1)

          marker = "\n\ndef _contract_payload(\n"
          if source.count(marker) != 1:
              raise SystemExit("contract payload insertion marker not found exactly once")
          helper = '''

          def _runtime_device_contract(config: UnifiedCampaignConfig) -> dict[str, Any]:
              """Resolve and freeze the execution device that can affect scientific results."""

              import torch

              requested = str(config.device)
              cuda_available = bool(torch.cuda.is_available())
              if requested == "cuda" and not cuda_available:
                  raise RuntimeError("device=cuda requested but CUDA is unavailable")
              resolved = (
                  "cuda"
                  if requested == "cuda" or (requested == "auto" and cuda_available)
                  else "cpu"
              )
              contract: dict[str, Any] = {
                  "requested_device": requested,
                  "resolved_device": resolved,
                  "torch_version": str(torch.__version__),
              }
              if requested == "auto":
                  contract["cuda_available"] = cuda_available
              if resolved == "cuda":
                  count = int(torch.cuda.device_count())
                  if count < 1:
                      raise RuntimeError("resolved CUDA device has no visible CUDA devices")
                  contract["torch_cuda_runtime"] = str(torch.version.cuda)
                  contract["cuda_device_count"] = count
                  contract["cuda_devices"] = [
                      {
                          "index": index,
                          "name": str(torch.cuda.get_device_name(index)),
                          "capability": list(torch.cuda.get_device_capability(index)),
                          "total_memory_bytes": int(
                              torch.cuda.get_device_properties(index).total_memory
                          ),
                      }
                      for index in range(count)
                  ]
              return contract
          '''
          source = source.replace(marker, helper + marker, 1)

          contract_marker = (
              '        "schema_version": RESUME_CONTRACT_SCHEMA_VERSION,\n'
              '        "git_commit": config.git_commit,\n'
              '        "code_hash": _resolved_code_hash(config),\n'
          )
          if source.count(contract_marker) != 1:
              raise SystemExit(
                  f"resume contract context count={source.count(contract_marker)}"
              )
          source = source.replace(
              contract_marker,
              contract_marker
              + '        "runtime_device": _runtime_device_contract(config),\n',
              1,
          )
          source_path.write_text(source, encoding="utf-8")

          test_path = Path("tests/evaluation/test_taj21_resumable_campaign.py")
          tests = test_path.read_text(encoding="utf-8")
          test_name = "def test_resolved_runtime_device_mismatch_fails_closed"
          if test_name in tests:
              raise SystemExit("resolved-device regression test already exists")
          tests += '''


          def test_resolved_runtime_device_mismatch_fails_closed(tmp_path, monkeypatch) -> None:
              state: dict[str, Any] = {"interrupt_on": 2}
              _install_fake_campaign(monkeypatch, state)
              config = _config(tmp_path, "device-mismatch", device="auto")
              resume = _resume(tmp_path, "device-mismatch")
              frames = {"numbers3": pd.DataFrame()}

              monkeypatch.setattr(
                  resumable,
                  "_runtime_device_contract",
                  lambda config: {
                      "requested_device": "auto",
                      "resolved_device": "cpu",
                      "torch_version": "test",
                      "cuda_available": False,
                  },
              )
              with pytest.raises(InterruptedError):
                  resumable.run_resumable_unified_campaign(frames, config, resume=resume)

              state.clear()
              _install_fake_campaign(monkeypatch, state)
              monkeypatch.setattr(
                  resumable,
                  "_runtime_device_contract",
                  lambda config: {
                      "requested_device": "auto",
                      "resolved_device": "cuda",
                      "torch_version": "test",
                      "cuda_available": True,
                      "torch_cuda_runtime": "test",
                      "cuda_device_count": 1,
                      "cuda_devices": [
                          {
                              "index": 0,
                              "name": "test-gpu",
                              "capability": [12, 0],
                              "total_memory_bytes": 16 * 1024**3,
                          }
                      ],
                  },
              )
              with pytest.raises(RuntimeError, match="resume contract SHA mismatch"):
                  resumable.run_resumable_unified_campaign(frames, config, resume=resume)
          '''
          test_path.write_text(tests, encoding="utf-8")
          PY

          uvx --from ruff==0.16.4 ruff format \
            src/loto/evaluation/resumable_campaign.py \
            tests/evaluation/test_taj21_resumable_campaign.py
          uvx --from ruff==0.16.4 ruff check \
            src/loto/evaluation/resumable_campaign.py \
            tests/evaluation/test_taj21_resumable_campaign.py

          uv run --frozen --extra dev python -m pytest \
            tests/evaluation/test_taj21_resumable_campaign.py -q

          rm -- .github/workflows/taj21-device-contract-fix.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/loto/evaluation/resumable_campaign.py \
            tests/evaluation/test_taj21_resumable_campaign.py \
            .github/workflows/taj21-device-contract-fix.yml
          git commit -m "fix: bind TAJ-21 resume to resolved runtime device"
          git push origin HEAD:codex/taj21-resumable-full-oof
