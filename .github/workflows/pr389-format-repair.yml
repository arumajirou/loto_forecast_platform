name: PR389 format repair

on:
  push:
    branches:
      - fix/gpu-exclusive-http-method-v2-20260824

permissions:
  contents: write

concurrency:
  group: pr389-format-repair
  cancel-in-progress: true

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify expected runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/gpu-exclusive-http-method-v2-20260824
          fetch-depth: 1
          clean: true
          persist-credentials: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          enable-cache: false

      - name: Format only PR389 hardening files
        run: |
          set -Eeuo pipefail
          uvx --from ruff==0.16.3 ruff format \
            scripts/certify_moirai2_runtime.py \
            tests/moirai2_campaign/test_certify_runtime_lane.py
          git diff --check
          git diff -- \
            scripts/certify_moirai2_runtime.py \
            tests/moirai2_campaign/test_certify_runtime_lane.py

      - name: Commit formatting when needed
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- \
            scripts/certify_moirai2_runtime.py \
            tests/moirai2_campaign/test_certify_runtime_lane.py; then
            echo "FORMAT_REPAIR=NO_CHANGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/certify_moirai2_runtime.py \
            tests/moirai2_campaign/test_certify_runtime_lane.py
          git commit -m "style: format Moirai2 runtime hardening"
          git push origin HEAD:fix/gpu-exclusive-http-method-v2-20260824
