name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ruff-safe-fix-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ruff-lint-safe-autofix-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      TARGET_BRANCH: fix/ruff-lint-safe-autofix-v1
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_RUFF_VERSION: "0.16.0"
      SUMMARY_PATH: .github/ruff-safe-fix-recovery-summary.txt
      REMAINING_PATH: .github/ruff-safe-fix-recovery-remaining.txt
      PYTEST_PATH: .github/ruff-safe-fix-recovery-pytest.txt
      BASELINE_COLLECTION_ERRORS: "34"

    steps:
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-lint-safe-autofix-v1
          persist-credentials: true
          fetch-depth: 0
          clean: true

      - name: Gate recovery commit
        id: gate
        run: |
          set -Eeuo pipefail
          message="$(git log -1 --pretty=%s)"
          echo "head_message=$message"
          if [[ "$message" == "ci: recover Ruff safe-fix export regressions (#200)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore known public re-export contracts
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          before="$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = "cd4b77f1baf526a696c01122d9ce3b0ecd415141"
          git checkout origin/main -- \
            src/loto/moirai2_campaign/target_execution.py \
            src/loto/autogluon_campaign/holdout_prospective.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/loto/moirai2_campaign/target_execution.py \
            src/loto/autogluon_campaign/holdout_prospective.py
          git commit -m "fix: preserve intentional re-export contracts (#200)"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$before"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "RECOVERED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install exact uv and Python
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare verification environment
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          actual="$(uv --version)"
          case "$actual" in "uv $UV_VERSION"*) ;; *) exit 1 ;; esac
          uv python install "$UV_PYTHON"
          ci_venv="$RUNNER_TEMP/loto-ruff-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv_cache="$RUNNER_TEMP/loto-ruff-recovery-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$ci_venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$uv_cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$ci_venv" "$uv_cache"
          mkdir -p "$uv_cache"
          echo "CI_VENV=$ci_venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv venv "$ci_venv" --python "$UV_PYTHON"
          python="$ci_venv/bin/python"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          echo "RUFF_VERSION=$ruff_version" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv pip install --quiet --python "$python" "ruff==$ruff_version"
          UV_CACHE_DIR="$uv_cache" uv pip install --quiet --python "$python" --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          UV_CACHE_DIR="$uv_cache" uv pip install --quiet --python "$python" -e ".[api,dev,postgres]"
          uv pip check --python "$python"
          echo "DEPS_RC=0" >> "$GITHUB_ENV"

      - name: Verify format compile and residual lint
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          "$python" -m ruff format --check src scripts tests
          "$python" -m compileall -q src scripts tests
          echo "COMPILE_RC=0" >> "$GITHUB_ENV"
          set +e
          "$python" -m ruff check --output-format=json src scripts tests > "$RUNNER_TEMP/remaining.json"
          LINT_RC=$?
          set -e
          echo "LINT_RC=$LINT_RC" >> "$GITHUB_ENV"
          "$python" - "$RUNNER_TEMP/remaining.json" "$REMAINING_PATH" <<'PY'
          import collections, json, os, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          rules=collections.Counter(r.get('code','UNKNOWN') for r in rows)
          files=collections.Counter(r.get('filename','UNKNOWN') for r in rows)
          out=[
              'RUFF_SAFE_FIX_RECOVERY_REMAINING_VERSION=1',
              f"RUN_ID={os.environ['GITHUB_RUN_ID']}",
              f"RUFF_VERSION={os.environ.get('RUFF_VERSION')}",
              f"REMAINING_FINDINGS={len(rows)}",
              'RULE_COUNTS='+','.join(f'{k}:{v}' for k,v in sorted(rules.items())),
              'TOP_FILES='+','.join(f'{k}:{v}' for k,v in files.most_common(50)),
          ]
          Path(sys.argv[2]).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

      - name: Run focused regression tests
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          "$python" -m pytest -q \
            tests/autogluon_campaign/test_holdout_prospective.py \
            tests/moirai2_campaign/test_p8d_scripts.py \
            tests/moirai2_campaign/test_target_execution_artifacts.py \
            tests/moirai2_campaign/test_target_execution_integrity.py \
            tests/moirai2_campaign/test_target_execution_state.py
          echo "FOCUSED_RC=0" >> "$GITHUB_ENV"

      - name: Verify full pytest collection parity
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          set +e
          "$python" -m pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1
          PYTEST_RC=$?
          set -e
          echo "PYTEST_RC=$PYTEST_RC" >> "$GITHUB_ENV"
          if grep -Fq "Interrupted: $BASELINE_COLLECTION_ERRORS errors during collection" "$RUNNER_TEMP/pytest.log"; then
            COLLECTION_PARITY=1
          else
            COLLECTION_PARITY=0
          fi
          echo "COLLECTION_PARITY=$COLLECTION_PARITY" >> "$GITHUB_ENV"
          "$python" - "$RUNNER_TEMP/pytest.log" "$PYTEST_PATH" <<'PY'
          import os,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text(encoding='utf-8',errors='backslashreplace').splitlines()
          out=[
              'RUFF_SAFE_FIX_RECOVERY_PYTEST_VERSION=1',
              f"RUN_ID={os.environ['GITHUB_RUN_ID']}",
              f"PYTEST_RC={os.environ.get('PYTEST_RC')}",
              f"COLLECTION_PARITY={os.environ.get('COLLECTION_PARITY')}",
              '--- LAST_180_LINES ---',
              *lines[-180:],
          ]
          Path(sys.argv[2]).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

      - name: Persist recovery evidence
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          cat > "$SUMMARY_PATH" <<EOF
          RUFF_SAFE_FIX_RECOVERY_SUMMARY_VERSION=1
          RUN_ID=$GITHUB_RUN_ID
          RUFF_VERSION=${RUFF_VERSION:-UNKNOWN}
          RECOVERED_HEAD=${RECOVERED_HEAD:-UNKNOWN}
          LINT_RC=${LINT_RC:-UNKNOWN}
          COMPILE_RC=${COMPILE_RC:-UNKNOWN}
          DEPS_RC=${DEPS_RC:-UNKNOWN}
          FOCUSED_RC=${FOCUSED_RC:-UNKNOWN}
          PYTEST_RC=${PYTEST_RC:-UNKNOWN}
          COLLECTION_PARITY=${COLLECTION_PARITY:-UNKNOWN}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SUMMARY_PATH" "$REMAINING_PATH" "$PYTEST_PATH"
          git diff --cached --check
          git commit -m "chore: capture Ruff safe-fix recovery evidence (#200)"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$(git rev-parse HEAD^)"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Enforce recovery gates
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          test "${COMPILE_RC:-99}" -eq 0
          test "${DEPS_RC:-99}" -eq 0
          test "${FOCUSED_RC:-99}" -eq 0
          test "${COLLECTION_PARITY:-0}" -eq 1

      - name: Cleanup
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          [[ -z "${CI_VENV:-}" ]] || { case "$CI_VENV" in "$RUNNER_TEMP"/*) rm -rf "$CI_VENV" ;; *) exit 1 ;; esac; }
          [[ -z "${UV_CACHE_DIR:-}" ]] || { case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf "$UV_CACHE_DIR" ;; *) exit 1 ;; esac; }
