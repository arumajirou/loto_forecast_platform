name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Show disk usage before install
        run: df -h

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true
          df -h

      - name: Install matching CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --no-cache-dir \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.9.1"

      - name: Install project and test dependencies
        run: |
          python -m pip install \
            --no-cache-dir \
            -e ".[api,dev,postgres]"

      - name: Verify CPU-only PyTorch remains selected
        run: |
          python - <<'PY'
          import torch

          assert torch.__version__.startswith("2.9.1"), torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          print(f"torch_version={torch.__version__}")
          print("torch_cuda_runtime=NONE")
          PY
          python -m pip check

      - name: Show disk usage after install
        run: df -h

      - name: Run Ruff format check
        run: python -m ruff format --check src scripts tests

      - name: Run Ruff lint
        run: python -m ruff check src scripts tests

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run tests
        run: python -m pytest -q
