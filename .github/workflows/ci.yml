name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ruff-safe-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ruff-lint-safe-autofix-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      TARGET_BRANCH: fix/ruff-lint-safe-autofix-v1
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_RUFF_VERSION: "0.16.0"
      SUMMARY_PATH: .github/ruff-safe-fix-summary.txt
      REMAINING_PATH: .github/ruff-safe-fix-remaining.txt
      PYTEST_PATH: .github/ruff-safe-fix-pytest.txt

    steps:
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-lint-safe-autofix-v1
          persist-credentials: true
          fetch-depth: 1
          clean: true

      - name: Gate remediation commit
        id: gate
        run: |
          set -Eeuo pipefail
          message="$(git log -1 --pretty=%s)"
          echo "head_message=$message"
          case "$message" in
            "style: apply locked Ruff safe fixes (#200)"*|"chore: capture Ruff safe-fix evidence (#200)"*)
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Install exact uv
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare exact locked Ruff
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          actual="$(uv --version)"
          case "$actual" in "uv $UV_VERSION"*) ;; *) exit 1 ;; esac
          uv python install "$UV_PYTHON"
          ci_venv="$RUNNER_TEMP/loto-ruff-safe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv_cache="$RUNNER_TEMP/loto-ruff-safe-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$ci_venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$uv_cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$ci_venv" "$uv_cache"
          mkdir -p "$uv_cache"
          echo "CI_VENV=$ci_venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv venv "$ci_venv" --python "$UV_PYTHON"
          python="$ci_venv/bin/python"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          echo "RUFF_VERSION=$ruff_version" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv pip install --quiet --python "$python" "ruff==$ruff_version"

      - name: Apply only Ruff safe fixes
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          before="$(git rev-parse HEAD)"
          "$python" -m ruff check --fix --exit-zero src scripts tests
          "$python" -m ruff format src scripts tests
          git diff --name-only | sort > "$RUNNER_TEMP/changed.txt"
          changed_count="$(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ')"
          echo "SAFE_CHANGED_COUNT=$changed_count" >> "$GITHUB_ENV"
          unexpected="$(awk '!($0 ~ /^src\// || $0 ~ /^scripts\// || $0 ~ /^tests\//) {print}' "$RUNNER_TEMP/changed.txt")"
          test -z "$unexpected"
          git diff --check
          if [[ "$changed_count" -gt 0 ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src scripts tests
            git diff --cached --check
            git commit -m "style: apply locked Ruff safe fixes (#200)"
            remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            test "$remote_before" = "$before"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          echo "FIXED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Capture remaining lint and compile
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          "$python" -m ruff format --check src scripts tests
          set +e
          "$python" -m ruff check --output-format=json src scripts tests > "$RUNNER_TEMP/remaining.json"
          LINT_RC=$?
          "$python" -m compileall -q src scripts tests > "$RUNNER_TEMP/compile.log" 2>&1
          COMPILE_RC=$?
          set -e
          echo "LINT_RC=$LINT_RC" >> "$GITHUB_ENV"
          echo "COMPILE_RC=$COMPILE_RC" >> "$GITHUB_ENV"
          "$python" - "$RUNNER_TEMP/remaining.json" "$REMAINING_PATH" <<'PY'
          import collections, json, os, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          rules=collections.Counter(r.get('code','UNKNOWN') for r in rows)
          files=collections.Counter(r.get('filename','UNKNOWN') for r in rows)
          out=[
              'RUFF_SAFE_FIX_REMAINING_VERSION=1',
              f"RUN_ID={os.environ['GITHUB_RUN_ID']}",
              f"RUFF_VERSION={os.environ.get('RUFF_VERSION')}",
              f"LINT_RC={os.environ.get('LINT_RC')}",
              f"REMAINING_FINDINGS={len(rows)}",
              'RULE_COUNTS='+','.join(f'{k}:{v}' for k,v in sorted(rules.items())),
              'TOP_FILES='+','.join(f'{k}:{v}' for k,v in files.most_common(50)),
          ]
          Path(sys.argv[2]).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

      - name: Install dependencies and run full pytest
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          set +e
          UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1" > "$RUNNER_TEMP/deps.log" 2>&1
          D1=$?
          D2=99
          D3=99
          if [[ $D1 -eq 0 ]]; then
            UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" -e ".[api,dev,postgres]" >> "$RUNNER_TEMP/deps.log" 2>&1
            D2=$?
          fi
          if [[ $D1 -eq 0 && $D2 -eq 0 ]]; then
            uv pip check --python "$python" >> "$RUNNER_TEMP/deps.log" 2>&1
            D3=$?
          fi
          DEPS_RC=0
          for rc in "$D1" "$D2" "$D3"; do
            [[ "$rc" -eq 0 ]] || DEPS_RC=1
          done
          if [[ "$DEPS_RC" -eq 0 ]]; then
            "$python" -m pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1
            PYTEST_RC=$?
          else
            echo 'dependency gate failed' > "$RUNNER_TEMP/pytest.log"
            PYTEST_RC=99
          fi
          set -e
          echo "DEPS_RC=$DEPS_RC" >> "$GITHUB_ENV"
          echo "PYTEST_RC=$PYTEST_RC" >> "$GITHUB_ENV"
          "$python" - "$RUNNER_TEMP/pytest.log" "$PYTEST_PATH" <<'PY'
          import os,sys
          from pathlib import Path
          lines=Path(sys.argv[1]).read_text(encoding='utf-8',errors='backslashreplace').splitlines()
          out=[
              'RUFF_SAFE_FIX_PYTEST_VERSION=1',
              f"RUN_ID={os.environ['GITHUB_RUN_ID']}",
              f"PYTEST_RC={os.environ.get('PYTEST_RC')}",
              '--- LAST_220_LINES ---',
              *lines[-220:],
          ]
          Path(sys.argv[2]).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY

      - name: Persist safe-fix evidence
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          cat > "$SUMMARY_PATH" <<EOF
          RUFF_SAFE_FIX_SUMMARY_VERSION=1
          RUN_ID=$GITHUB_RUN_ID
          RUFF_VERSION=${RUFF_VERSION:-UNKNOWN}
          SAFE_CHANGED_COUNT=${SAFE_CHANGED_COUNT:-UNKNOWN}
          FIXED_HEAD=${FIXED_HEAD:-UNKNOWN}
          LINT_RC=${LINT_RC:-UNKNOWN}
          COMPILE_RC=${COMPILE_RC:-UNKNOWN}
          DEPS_RC=${DEPS_RC:-UNKNOWN}
          PYTEST_RC=${PYTEST_RC:-UNKNOWN}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SUMMARY_PATH" "$REMAINING_PATH" "$PYTEST_PATH"
          git diff --cached --check
          git commit -m "chore: capture Ruff safe-fix evidence (#200)"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$(git rev-parse HEAD^)"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Enforce non-lint safety gates
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          test "${COMPILE_RC:-99}" -eq 0
          test "${DEPS_RC:-99}" -eq 0

      - name: Cleanup
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          [[ -z "${CI_VENV:-}" ]] || { case "$CI_VENV" in "$RUNNER_TEMP"/*) rm -rf "$CI_VENV" ;; *) exit 1 ;; esac; }
          [[ -z "${UV_CACHE_DIR:-}" ]] || { case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf "$UV_CACHE_DIR" ;; *) exit 1 ;; esac; }
