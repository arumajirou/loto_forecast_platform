name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ppl02-batch7-gaussian-copula
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.1
      - name: Format and commit Batch 7 files
        run: |
          python -m ruff format \
            src/loto/probabilistic/backends/pymc_adapter.py \
            src/loto/probabilistic/catalog.py \
            src/loto/probabilistic/models/copula_native.py \
            src/loto/probabilistic/models/copula_pymc.py \
            src/loto/probabilistic/native_registry.py
          python -m ruff format --check \
            src/loto/probabilistic/backends/pymc_adapter.py \
            src/loto/probabilistic/catalog.py \
            src/loto/probabilistic/models/copula_native.py \
            src/loto/probabilistic/models/copula_pymc.py \
            src/loto/probabilistic/native_registry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/loto/probabilistic/backends/pymc_adapter.py \
            src/loto/probabilistic/catalog.py \
            src/loto/probabilistic/models/copula_native.py \
            src/loto/probabilistic/models/copula_pymc.py \
            src/loto/probabilistic/native_registry.py
          if git diff --cached --quiet; then
            echo "No formatting changes required"
          else
            git commit -m "style(probabilistic): apply exact Ruff formatting"
            git push origin HEAD:agent/ppl02-batch7-gaussian-copula
          fi
