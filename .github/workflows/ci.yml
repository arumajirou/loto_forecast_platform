name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ruff-small-semantics-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ruff-lint-small-semantics-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_RUFF_VERSION: "0.16.0"
      EXPECTED_TOTAL_LINT: "194"
      EXPECTED_SELECTED_LINT: "20"
      SELECTED_RULES: "B007,B017,B904,E501,E731,I001,UP022,UP035,UP037"

    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-lint-small-semantics-v1
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Install exact uv and locked Ruff
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare isolated Ruff environment
        run: |
          set -Eeuo pipefail
          case "$(uv --version)" in "uv $UV_VERSION"*) ;; *) exit 1 ;; esac
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/loto-ruff-small-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-ruff-small-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python "$UV_PYTHON"
          echo "CI_VENV=$venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          python="$venv/bin/python"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" "ruff==$ruff_version"
          "$python" -m ruff --version

      - name: Inventory exact residual and selected findings
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          set +e
          "$python" -m ruff check --output-format=json src scripts tests > "$RUNNER_TEMP/all.json"
          all_rc=$?
          "$python" -m ruff check --select "$SELECTED_RULES" --output-format=json src scripts tests > "$RUNNER_TEMP/selected.json"
          selected_rc=$?
          set -e
          test "$all_rc" -eq 1
          test "$selected_rc" -eq 1
          "$python" - "$RUNNER_TEMP/all.json" "$RUNNER_TEMP/selected.json" <<'PY'
          import collections, json, sys
          from pathlib import Path
          all_rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          rows=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8') or '[]')
          counts=collections.Counter(row.get('code','UNKNOWN') for row in all_rows)
          selected_counts=collections.Counter(row.get('code','UNKNOWN') for row in rows)
          print(f"TOTAL_LINT_COUNT={len(all_rows)}")
          print("TOTAL_RULE_COUNTS=" + ",".join(f"{k}:{v}" for k,v in sorted(counts.items())))
          print(f"SELECTED_LINT_COUNT={len(rows)}")
          print("SELECTED_RULE_COUNTS=" + ",".join(f"{k}:{v}" for k,v in sorted(selected_counts.items())))
          for row in rows:
              loc=row.get('location') or {}
              fix=row.get('fix')
              applicability=None if fix is None else fix.get('applicability')
              print("FINDING|{code}|{file}:{line}:{col}|fix={fix}|{msg}".format(
                  code=row.get('code'), file=row.get('filename'), line=loc.get('row'), col=loc.get('column'),
                  fix=applicability or ('available' if fix else 'none'), msg=row.get('message','').replace('\n',' ')))
          if len(all_rows) != 194:
              raise SystemExit(f"expected 194 total findings, got {len(all_rows)}")
          if len(rows) != 20:
              raise SystemExit(f"expected 20 selected findings, got {len(rows)}")
          PY

      - name: Verify repository unchanged
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git status --porcelain=v1

      - name: Cleanup
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          [[ -z "${CI_VENV:-}" ]] || { case "$CI_VENV" in "$RUNNER_TEMP"/*) rm -rf "$CI_VENV" ;; *) exit 1 ;; esac; }
          [[ -z "${UV_CACHE_DIR:-}" ]] || { case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf "$UV_CACHE_DIR" ;; *) exit 1 ;; esac; }
