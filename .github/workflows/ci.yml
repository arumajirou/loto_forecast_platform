name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ppl02-batch7-gaussian-copula
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.1
      - name: Apply exact Ruff lint fix
        run: |
          python -m ruff check --fix src/loto/probabilistic/backends/builtin.py
          python -m ruff format src/loto/probabilistic/backends/builtin.py
          python -m ruff check src/loto/probabilistic/backends/builtin.py
          python -m ruff format --check src/loto/probabilistic/backends/builtin.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/loto/probabilistic/backends/builtin.py
          if git diff --cached --quiet; then
            echo "No lint changes required"
          else
            git commit -m "style(probabilistic): organize builtin imports"
            git push origin HEAD:agent/ppl02-batch7-gaussian-copula
          fi
