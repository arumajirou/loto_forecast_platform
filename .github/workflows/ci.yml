name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Show disk usage before install
        run: df -h

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force || true
          df -h

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install             --no-cache-dir             --index-url https://download.pytorch.org/whl/cpu             torch

      - name: Install project and test dependencies
        run: |
          python -m pip install             --no-cache-dir             -e ".[api,dev,postgres]"

      - name: Show disk usage after install
        run: df -h

      - name: Run Ruff format check
        run: python -m ruff format --check src scripts tests

      - name: Run Ruff lint
        run: python -m ruff check src scripts tests

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Run tests
        run: python -m pytest -q
