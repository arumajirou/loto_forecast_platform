name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-batch8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ppl02-batch8-bocpd
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.1
      - name: Apply, format, lint, and commit Batch 8
        run: |
          cp docs/.ppl02-batch8-existing.patch /tmp/ppl02-batch8-existing.patch
          git apply --check --exclude=src/loto/probabilistic/backends/builtin.py \
            /tmp/ppl02-batch8-existing.patch
          git apply --exclude=src/loto/probabilistic/backends/builtin.py \
            /tmp/ppl02-batch8-existing.patch
          python - <<'PY'
          from pathlib import Path

          path = Path("src/loto/probabilistic/backends/builtin.py")
          text = path.read_text(encoding="utf-8")
          import_anchor = (
              "from loto.probabilistic.backends.base import ProbabilisticBackend\n"
          )
          imports = (
              "from loto.probabilistic.models.bocpd_native import (\n"
              "    MODEL_ID as BOCPD_MODEL_ID,\n"
              ")\n"
              "from loto.probabilistic.models.bocpd_native import (\n"
              "    fit_bocpd_dirichlet_categorical,\n"
              ")\n"
          )
          if imports not in text:
              if import_anchor not in text:
                  raise SystemExit("builtin import anchor not found")
              text = text.replace(import_anchor, import_anchor + imports, 1)

          method_anchor = (
              "    ) -> NativePosterior:\n"
              "        if spec.model_id == COPULA_MODEL_ID:\n"
          )
          method_block = '''    ) -> NativePosterior:
              if spec.model_id == BOCPD_MODEL_ID:
                  state = fit_bocpd_dirichlet_categorical(
                      y,
                      game=geometry.key,
                      classes=classes,
                      config=config,
                      seed=seed,
                  )
                  draw_count = (
                      config.native_draws
                      if config.backend_policy == "primary_native"
                      else config.posterior_draws
                  )
                  draws = state.probability_draws(draw_count, seed=seed)
                  return NativePosterior(
                      model_id=spec.model_id,
                      backend=self.backend_id,
                      family=spec.family,
                      target_mode=target_mode,
                      game=geometry.key,
                      probability_draws=draws,
                      metadata={
                          **state.to_metadata_dict(),
                          "native_graph_id": spec.native_graph_id,
                          "implementation_kind": "exact_online_message_passing",
                          "native_analytic": True,
                          "inference_profile_id": inference_profile_id,
                          "alert_events": list(state.alert_events),
                          "automatic_retraining": False,
                      },
                      diagnostics={
                          "posterior_finite": bool(np.isfinite(draws).all()),
                          "probability_simplex_valid": bool(
                              np.allclose(draws.sum(axis=-1), 1.0, atol=1e-7)
                          ),
                          "run_length_posterior_valid": bool(
                              np.isfinite(state.run_length_posterior).all()
                              and np.isclose(state.run_length_posterior.sum(), 1.0)
                          ),
                          "current_changepoint_probability": (
                              state.current_changepoint_probability
                          ),
                          "map_run_length": state.map_run_length,
                          "active_run_lengths": int(len(state.run_lengths)),
                          "cumulative_pruned_mass": state.cumulative_pruned_mass,
                          "alert_count": len(state.alert_events),
                          "data_quality_pass_rate": float(state.data_quality_pass.mean()),
                          "rhat_max": None,
                          "ess_bulk_min": None,
                          "ess_tail_min": None,
                          "divergences": None,
                          "elbo_finite": None,
                          "elbo_stable": None,
                      },
                      native_payload=state,
                  )

              if spec.model_id == COPULA_MODEL_ID:
          '''
          if "if spec.model_id == BOCPD_MODEL_ID:" not in text:
              if method_anchor not in text:
                  raise SystemExit("builtin method anchor not found")
              text = text.replace(method_anchor, method_block, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm docs/.ppl02-batch8-existing.patch
          python -m ruff check --fix \
            src/loto/probabilistic/models/bocpd_native.py \
            src/loto/probabilistic/contracts.py \
            src/loto/probabilistic/config.py \
            src/loto/probabilistic/catalog.py \
            src/loto/probabilistic/native_registry.py \
            src/loto/probabilistic/backends/builtin.py \
            src/loto/probabilistic/models/__init__.py \
            tests/probabilistic/test_ppl02_bocpd.py \
            tests/probabilistic/test_native_full_coverage.py \
            tests/probabilistic/test_reference_models.py \
            tests/probabilistic/test_catalog.py \
            tests/probabilistic/test_cli.py \
            tests/probabilistic/test_config_and_plan.py
          python -m ruff format \
            src/loto/probabilistic/models/bocpd_native.py \
            src/loto/probabilistic/contracts.py \
            src/loto/probabilistic/config.py \
            src/loto/probabilistic/catalog.py \
            src/loto/probabilistic/native_registry.py \
            src/loto/probabilistic/backends/builtin.py \
            src/loto/probabilistic/models/__init__.py \
            tests/probabilistic/test_ppl02_bocpd.py \
            tests/probabilistic/test_native_full_coverage.py \
            tests/probabilistic/test_reference_models.py \
            tests/probabilistic/test_catalog.py \
            tests/probabilistic/test_cli.py \
            tests/probabilistic/test_config_and_plan.py
          python -m ruff check \
            src/loto/probabilistic/models/bocpd_native.py \
            src/loto/probabilistic/contracts.py \
            src/loto/probabilistic/config.py \
            src/loto/probabilistic/catalog.py \
            src/loto/probabilistic/native_registry.py \
            src/loto/probabilistic/backends/builtin.py \
            src/loto/probabilistic/models/__init__.py \
            tests/probabilistic/test_ppl02_bocpd.py \
            tests/probabilistic/test_native_full_coverage.py \
            tests/probabilistic/test_reference_models.py \
            tests/probabilistic/test_catalog.py \
            tests/probabilistic/test_cli.py \
            tests/probabilistic/test_config_and_plan.py
          python -m ruff format --check \
            src/loto/probabilistic/models/bocpd_native.py \
            src/loto/probabilistic/contracts.py \
            src/loto/probabilistic/config.py \
            src/loto/probabilistic/catalog.py \
            src/loto/probabilistic/native_registry.py \
            src/loto/probabilistic/backends/builtin.py \
            src/loto/probabilistic/models/__init__.py \
            tests/probabilistic/test_ppl02_bocpd.py \
            tests/probabilistic/test_native_full_coverage.py \
            tests/probabilistic/test_reference_models.py \
            tests/probabilistic/test_catalog.py \
            tests/probabilistic/test_cli.py \
            tests/probabilistic/test_config_and_plan.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/loto/probabilistic/models/bocpd_native.py \
            src/loto/probabilistic/contracts.py \
            src/loto/probabilistic/config.py \
            src/loto/probabilistic/catalog.py \
            src/loto/probabilistic/native_registry.py \
            src/loto/probabilistic/backends/builtin.py \
            src/loto/probabilistic/models/__init__.py \
            tests/probabilistic/test_ppl02_bocpd.py \
            tests/probabilistic/test_native_full_coverage.py \
            tests/probabilistic/test_reference_models.py \
            tests/probabilistic/test_catalog.py \
            tests/probabilistic/test_cli.py \
            tests/probabilistic/test_config_and_plan.py \
            docs/.ppl02-batch8-existing.patch
          git commit -m "feat(probabilistic): integrate BOCPD changepoint model"
          git push origin HEAD:agent/ppl02-batch8-bocpd
