name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ruff-state-default-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ruff-lint-state-default-safety-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      TARGET_BRANCH: fix/ruff-lint-state-default-safety-v1
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_RUFF_VERSION: "0.16.0"
      RESULT_PATH: .github/ruff-state-default-safety-inventory.txt

    steps:
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-lint-state-default-safety-v1
          persist-credentials: true
          fetch-depth: 1
          clean: true

      - name: Gate inventory commit
        id: gate
        run: |
          set -Eeuo pipefail
          message="$(git log -1 --pretty=%s)"
          if [[ "$message" == "ci: inventory Ruff state/default safety findings (#200)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Inventory B008 B039 F841
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/loto-ruff-state-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$venv"
          uv venv "$venv" --python "$UV_PYTHON"
          echo "CI_VENV=$venv" >> "$GITHUB_ENV"
          python="$venv/bin/python"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          uv pip install --quiet --python "$python" "ruff==$ruff_version"
          set +e
          "$python" -m ruff check --select B008,B039,F841 --output-format=json src scripts tests > "$RUNNER_TEMP/findings.json"
          lint_rc=$?
          set -e
          LINT_RC="$lint_rc" "$python" - "$RUNNER_TEMP/findings.json" "$RESULT_PATH" <<'PY'
          import collections, json, os, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          counts=collections.Counter(row.get('code','UNKNOWN') for row in rows)
          out=[
              'RUFF_STATE_DEFAULT_SAFETY_INVENTORY_VERSION=1',
              f"RUN_ID={os.environ['GITHUB_RUN_ID']}",
              f"RUFF_VERSION={os.environ.get('EXPECTED_RUFF_VERSION')}",
              f"LINT_RC={os.environ.get('LINT_RC')}",
              f"FINDING_COUNT={len(rows)}",
              'RULE_COUNTS='+','.join(f'{k}:{v}' for k,v in sorted(counts.items())),
              '--- FINDINGS ---',
          ]
          for row in rows:
              loc=row.get('location') or {}
              out.append(f"{row.get('code')}\t{row.get('filename')}:{loc.get('row')}:{loc.get('column')}\t{row.get('message')}")
          Path(sys.argv[2]).write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          "$python" -m compileall -q src scripts tests

      - name: Persist inventory
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          test -f "$RESULT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_PATH"
          git diff --cached --check
          git commit -m "chore: capture Ruff state/default safety inventory (#200)"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$(git rev-parse HEAD^)"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          [[ -z "${CI_VENV:-}" ]] || { case "$CI_VENV" in "$RUNNER_TEMP"/*) rm -rf "$CI_VENV" ;; *) exit 1 ;; esac; }
