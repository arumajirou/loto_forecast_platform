name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ruff-lint-state-default-safety-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_RUFF_VERSION: "0.16.0"

    steps:
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-lint-state-default-safety-v1
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Gate audit commit
        id: gate
        run: |
          set -Eeuo pipefail
          message="$(git log -1 --pretty=%s)"
          if [[ "$message" == "ci: locate import-order findings after state/default repairs (#200)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Reproduce four repairs and report I001
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/loto-ruff-i001-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          uv venv "$venv" --python "$UV_PYTHON"
          python="$venv/bin/python"
          echo "CI_VENV=$venv" >> "$GITHUB_ENV"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          uv pip install --quiet --python "$python" "ruff==$ruff_version"
          "$python" - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: match count != 1')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('src/loto/autogluon_campaign/holdout_prospective_score.py','from loto.autogluon_campaign.holdout_prospective_lock import verify_prediction_lock\n\n\ndef _aggregate','from loto.autogluon_campaign.holdout_prospective_lock import verify_prediction_lock\n\n\n_DEFAULT_DRIFT_POLICY = DriftPolicy()\n\n\ndef _aggregate')
          replace_once('src/loto/autogluon_campaign/holdout_prospective_score.py','    drift_policy: DriftPolicy = DriftPolicy(),','    drift_policy: DriftPolicy = _DEFAULT_DRIFT_POLICY,')
          replace_once('src/loto/autogluon_campaign/promotion_eligibility.py','from loto.autogluon_campaign.promotion_eligibility_rules import (\n    evaluate_promotion_rules,\n)\n\n\n@dataclass','from loto.autogluon_campaign.promotion_eligibility_rules import (\n    evaluate_promotion_rules,\n)\n\n\n_DEFAULT_PROMOTION_POLICY = PromotionPolicy()\n\n\n@dataclass')
          replace_once('src/loto/autogluon_campaign/promotion_eligibility.py','    policy: PromotionPolicy = PromotionPolicy(),','    policy: PromotionPolicy = _DEFAULT_PROMOTION_POLICY,')
          replace_once('src/loto/telemetry/context.py','_CURRENT: ContextVar[TelemetryContext] = ContextVar(\n    "loto_telemetry_context", default=TelemetryContext()\n)','_EMPTY_TELEMETRY_CONTEXT = TelemetryContext()\n_CURRENT: ContextVar[TelemetryContext] = ContextVar(\n    "loto_telemetry_context", default=_EMPTY_TELEMETRY_CONTEXT\n)')
          replace_once('src/loto/statsforecast/runtime_lane_remediation.py','    remediation = _load_object(triage_dir / "REMEDIATION_PLAN.json")','    _load_object(triage_dir / "REMEDIATION_PLAN.json")')
          PY
          echo '=== I001 AFTER REPAIRS ==='
          set +e
          "$python" -m ruff check --select I001 src scripts tests
          rc=$?
          set -e
          echo "I001_RC=$rc"
          echo '=== TARGETED B008/B039/F841 ==='
          "$python" -m ruff check --select B008,B039,F841 src scripts tests

      - name: Cleanup
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          [[ -z "${CI_VENV:-}" ]] || { case "$CI_VENV" in "$RUNNER_TEMP"/*) rm -rf "$CI_VENV" ;; *) exit 1 ;; esac; }
