name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ppl02-batch7-gaussian-copula
          fetch-depth: 1
      - name: Create Batch 7 repository snapshot
        run: |
          tar \
            --exclude=.git \
            --exclude=.venv \
            --exclude='**/__pycache__' \
            --exclude='.pytest_cache' \
            -czf /tmp/loto-forecast-platform-batch7-source.tar.gz \
            .
          sha256sum /tmp/loto-forecast-platform-batch7-source.tar.gz \
            > /tmp/loto-forecast-platform-batch7-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ppl02-batch7-source
          path: |
            /tmp/loto-forecast-platform-batch7-source.tar.gz
            /tmp/loto-forecast-platform-batch7-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
