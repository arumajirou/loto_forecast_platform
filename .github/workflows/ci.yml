name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ruff-b905-inventory-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  test:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ruff-lint-b905-zip-semantics-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_RUFF_VERSION: "0.16.0"
      EXPECTED_TOTAL_LINT: "174"
      EXPECTED_B905: "31"

    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-lint-b905-zip-semantics-v1
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Install exact uv and Ruff
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Inventory B905 findings and source context
        run: |
          set -Eeuo pipefail
          case "$(uv --version)" in "uv $UV_VERSION"*) ;; *) exit 1 ;; esac
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/loto-b905-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-b905-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python "$UV_PYTHON"
          python="$venv/bin/python"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" "ruff==$ruff_version"

          set +e
          "$python" -m ruff check --output-format=json src scripts tests > "$RUNNER_TEMP/all.json"
          all_rc=$?
          "$python" -m ruff check --select B905 --output-format=json src scripts tests > "$RUNNER_TEMP/b905.json"
          b905_rc=$?
          set -e
          test "$all_rc" -eq 1
          test "$b905_rc" -eq 1

          "$python" - "$RUNNER_TEMP/all.json" "$RUNNER_TEMP/b905.json" <<'PY'
          import collections
          import json
          import sys
          from pathlib import Path

          all_rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          rows=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8') or '[]')
          counts=collections.Counter(row.get('code','UNKNOWN') for row in all_rows)
          print(f"TOTAL_LINT_COUNT={len(all_rows)}")
          print("TOTAL_RULE_COUNTS=" + ",".join(f"{k}:{v}" for k,v in sorted(counts.items())))
          print(f"B905_COUNT={len(rows)}")
          by_file=collections.Counter(row['filename'] for row in rows)
          print("B905_FILES=" + ",".join(f"{Path(k).as_posix()}:{v}" for k,v in sorted(by_file.items())))
          for index,row in enumerate(rows, start=1):
              loc=row.get('location') or {}
              fix=row.get('fix')
              applicability=None if fix is None else fix.get('applicability')
              filename=Path(row['filename'])
              line=int(loc.get('row') or 1)
              source=filename.read_text(encoding='utf-8').splitlines()
              lo=max(1,line-3); hi=min(len(source),line+3)
              context=' || '.join(f"{n}:{source[n-1].strip()}" for n in range(lo,hi+1))
              print(
                  f"B905|{index}|{filename.as_posix()}:{line}:{loc.get('column')}|"
                  f"fix={applicability or ('available' if fix else 'none')}|"
                  f"{row.get('message','').replace(chr(10),' ')}|CTX={context}"
              )
          expected_total=int(__import__('os').environ['EXPECTED_TOTAL_LINT'])
          expected_b905=int(__import__('os').environ['EXPECTED_B905'])
          if len(all_rows) != expected_total:
              raise SystemExit(f"expected total {expected_total}, got {len(all_rows)}")
          if len(rows) != expected_b905:
              raise SystemExit(f"expected B905 {expected_b905}, got {len(rows)}")
          PY

          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
          rm -rf -- "$venv" "$cache"
