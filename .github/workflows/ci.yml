name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-batch8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ppl02-batch8-bocpd
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.1
      - name: Apply, format, lint, and commit Batch 8
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            src/loto/probabilistic/models/bocpd_native.py
            src/loto/probabilistic/contracts.py
            src/loto/probabilistic/config.py
            src/loto/probabilistic/catalog.py
            src/loto/probabilistic/native_registry.py
            src/loto/probabilistic/backends/builtin.py
            src/loto/probabilistic/models/__init__.py
            tests/probabilistic/test_ppl02_bocpd.py
            tests/probabilistic/test_native_full_coverage.py
            tests/probabilistic/test_reference_models.py
            tests/probabilistic/test_catalog.py
            tests/probabilistic/test_cli.py
            tests/probabilistic/test_config_and_plan.py
          )
          cp docs/.ppl02-batch8-existing.patch /tmp/ppl02-batch8-existing.patch
          git apply --check --exclude=src/loto/probabilistic/backends/builtin.py \
            /tmp/ppl02-batch8-existing.patch
          git apply --exclude=src/loto/probabilistic/backends/builtin.py \
            /tmp/ppl02-batch8-existing.patch
          cp docs/.ppl02-batch8-builtin.py \
            src/loto/probabilistic/backends/builtin.py
          rm \
            docs/.ppl02-batch8-existing.patch \
            docs/.ppl02-batch8-builtin.py
          python -m ruff check --fix "${FILES[@]}"
          python -m ruff format "${FILES[@]}"
          python -m ruff check "${FILES[@]}"
          python -m ruff format --check "${FILES[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "${FILES[@]}" \
            docs/.ppl02-batch8-existing.patch \
            docs/.ppl02-batch8-builtin.py
          git commit -m "feat(probabilistic): integrate BOCPD changepoint model"
          git push origin HEAD:agent/ppl02-batch8-bocpd
