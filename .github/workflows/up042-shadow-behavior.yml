name: up042-shadow-behavior

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shadow-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ruff-up042-inventory-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout inventory branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/ruff-up042-inventory-v1
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Compare runtime behavior before and after shadow StrEnum migration
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-up042-shadow-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-up042-shadow-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          uv pip check --python "$python"
          test "$("$python" -m ruff --version)" = 'ruff 0.16.0'

          set +e
          "$python" -m ruff check --select UP042 --output-format=json src scripts tests > "$RUNNER_TEMP/up042-before.json"
          before_rc=$?
          set -e
          test "$before_rc" -eq 1

          "$python" - "$RUNNER_TEMP/up042-before.json" "$RUNNER_TEMP/up042-classes.json" <<'PY'
          import ast, json, sys
          from pathlib import Path

          root=Path.cwd().resolve()
          rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          assert len(rows)==66,len(rows)
          items=[]
          seen=set()
          for row in rows:
              path=Path(row['filename']).resolve().relative_to(root)
              lineno=int(row['location']['row'])
              tree=ast.parse(path.read_text(encoding='utf-8'),filename=str(path))
              nodes=[n for n in ast.walk(tree) if isinstance(n,ast.ClassDef) and n.lineno<=lineno<=getattr(n,'end_lineno',n.lineno)]
              nodes.sort(key=lambda n:n.lineno,reverse=True)
              assert nodes,(path,lineno)
              node=nodes[0]
              module='.'.join(path.with_suffix('').parts[1:])
              key=(module,node.name)
              if key not in seen:
                  seen.add(key)
                  items.append({'module':module,'class':node.name,'path':path.as_posix(),'line':node.lineno})
          assert len(items)==66,len(items)
          Path(sys.argv[2]).write_text(json.dumps(items,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(f'AFFECTED_CLASSES={len(items)}')
          PY

          cat > "$RUNNER_TEMP/up042-fingerprint.py" <<'PY'
          from __future__ import annotations
          import importlib, json, pickle, sys
          from pathlib import Path

          classes=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          out=[]
          failures=[]
          for item in classes:
              try:
                  module=importlib.import_module(item['module'])
                  cls=getattr(module,item['class'])
                  members=[]
                  for member in cls:
                      value=member.value
                      try:
                          json_member=json.dumps(member,sort_keys=True)
                          json_box=json.dumps({'value':member},sort_keys=True)
                      except Exception as exc:
                          json_member=f'ERROR:{type(exc).__name__}:{exc}'
                          json_box=json_member
                      try:
                          roundtrip=pickle.loads(pickle.dumps(member))
                          pickle_ok=(roundtrip is member) or (roundtrip==member and type(roundtrip) is type(member))
                      except Exception as exc:
                          pickle_ok=f'ERROR:{type(exc).__name__}:{exc}'
                      members.append({
                          'name':member.name,
                          'value_repr':repr(value),
                          'value_type':f'{type(value).__module__}.{type(value).__qualname__}',
                          'str':str(member),
                          'format':format(member),
                          'fstring':f'{member}',
                          'percent_s':'%s' % member,
                          'repr':repr(member),
                          'equals_value':member==value,
                          'hash_equals_value':hash(member)==hash(value),
                          'isinstance_str':isinstance(member,str),
                          'json_member':json_member,
                          'json_box':json_box,
                          'pickle_roundtrip':pickle_ok,
                      })
                  out.append({
                      **item,
                      'enum_module':cls.__module__,
                      'enum_qualname':cls.__qualname__,
                      'mro':[f'{c.__module__}.{c.__qualname__}' for c in cls.__mro__],
                      'members':members,
                  })
              except Exception as exc:
                  failures.append({**item,'error':f'{type(exc).__name__}:{exc}'})
          payload={'classes':out,'failures':failures}
          Path(sys.argv[2]).write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(f'FINGERPRINT_CLASSES={len(out)}')
          print(f'FINGERPRINT_IMPORT_FAILURES={len(failures)}')
          for failure in failures:
              print('IMPORT_FAILURE='+json.dumps(failure,sort_keys=True))
          PY

          "$python" "$RUNNER_TEMP/up042-fingerprint.py" "$RUNNER_TEMP/up042-classes.json" "$RUNNER_TEMP/up042-before-fingerprint.json"

          "$python" -m ruff check --select UP042 --fix --unsafe-fixes src scripts tests
          "$python" -m ruff check --select UP042 src scripts tests
          mapfile -t changed < <(git diff --name-only | sort)
          echo "SHADOW_CHANGED_FILES=${#changed[@]}"
          printf 'SHADOW_CHANGED\t%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 20
          git diff --check
          "$python" -m ruff format --check "${changed[@]}"
          "$python" -m compileall -q src scripts tests

          "$python" "$RUNNER_TEMP/up042-fingerprint.py" "$RUNNER_TEMP/up042-classes.json" "$RUNNER_TEMP/up042-after-fingerprint.json"

          "$python" - "$RUNNER_TEMP/up042-before-fingerprint.json" "$RUNNER_TEMP/up042-after-fingerprint.json" <<'PY'
          import collections,json,sys
          from pathlib import Path
          before=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          after=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert not before['failures'],before['failures']
          assert not after['failures'],after['failures']
          b={(x['module'],x['class']):x for x in before['classes']}
          a={(x['module'],x['class']):x for x in after['classes']}
          assert b.keys()==a.keys() and len(b)==66,(len(b),len(a))
          changed_fields=collections.Counter()
          changed_classes=collections.Counter()
          forbidden=[]
          allowed={'mro','str','format','fstring','percent_s','repr'}
          for key in sorted(b):
              left,right=b[key],a[key]
              if left['mro']!=right['mro']:
                  changed_fields['mro']+=1
              lm={m['name']:m for m in left['members']}
              rm={m['name']:m for m in right['members']}
              assert lm.keys()==rm.keys(),key
              class_changes=set()
              for name in lm:
                  for field in lm[name]:
                      if lm[name][field]!=rm[name][field]:
                          changed_fields[field]+=1
                          class_changes.add(field)
                          if field not in allowed:
                              forbidden.append((key,name,field,lm[name][field],rm[name][field]))
              for field in class_changes:
                  changed_classes[field]+=1
          print('BEHAVIOR_MEMBER_FIELD_CHANGES='+','.join(f'{k}:{v}' for k,v in sorted(changed_fields.items())))
          print('BEHAVIOR_CLASS_FIELD_CHANGES='+','.join(f'{k}:{v}' for k,v in sorted(changed_classes.items())))
          print(f'FORBIDDEN_BEHAVIOR_CHANGES={len(forbidden)}')
          for item in forbidden[:20]:
              print('FORBIDDEN_CHANGE='+repr(item))
          assert not forbidden,forbidden[:20]
          PY

          git reset --hard HEAD
          test -z "$(git status --porcelain)"
          rm -rf -- "$venv" "$cache" \
            "$RUNNER_TEMP/up042-before.json" "$RUNNER_TEMP/up042-classes.json" \
            "$RUNNER_TEMP/up042-fingerprint.py" "$RUNNER_TEMP/up042-before-fingerprint.json" \
            "$RUNNER_TEMP/up042-after-fingerprint.json"
