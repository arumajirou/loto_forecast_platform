name: pytest-opentelemetry-dev-deps-publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/pytest-opentelemetry-dev-deps-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 120
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout exact event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Gate one-shot publish
        id: gate
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          message="$(git log -1 --pretty=%s)"
          echo "event_head=$EVENT_HEAD"
          echo "head_message=$message"
          if [[ "$message" == "ci: publish OpenTelemetry dev-test dependency repair (#201)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Repair lock verify tests and publish
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: aab3d68f6b1557dce3d5b52dcac425f273efb82d
        run: |
          set -Eeuo pipefail

          git fetch origin main fix/pytest-opentelemetry-dev-deps-v1
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse origin/fix/pytest-opentelemetry-dev-deps-v1)" = "$EVENT_HEAD"

          cp uv.lock "$RUNNER_TEMP/otel-uv.lock.before"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('pyproject.toml')
          text = path.read_text(encoding='utf-8')
          needle = '  "optuna>=4.0",\n]\npostgres = '
          replacement = '''  "optuna>=4.0",
  # Telemetry tests import the SDK directly and exercise the OTLP exporters.
  # Keep the standard dev/test environment hermetic instead of relying on the `full` extra.
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp>=1.30",
]
postgres = '''
          assert text.count(needle) == 1, text.count(needle)
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY

          uv lock
          uv lock --check

          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "pyproject.toml"
          test "${changed[1]}" = "uv.lock"
          git diff --check

          python3 - "$RUNNER_TEMP/otel-uv.lock.before" uv.lock <<'PY'
          import sys, tomllib
          from pathlib import Path

          def inventory(path: str):
              data = tomllib.loads(Path(path).read_text(encoding='utf-8'))
              rows = []
              for pkg in data['package']:
                  rows.append((pkg['name'], pkg.get('version'), str(pkg.get('source'))))
              return rows

          before = inventory(sys.argv[1])
          after = inventory(sys.argv[2])
          assert before == after, 'uv lock package/version/source inventory drifted'
          print(f'LOCK_PACKAGE_INVENTORY_COUNT={len(after)}')
          print('LOCK_PACKAGE_INVENTORY_PARITY=PASS')
          PY

          uv python install 3.13
          venv="$RUNNER_TEMP/loto-otel-devdeps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-otel-devdeps-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"

          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          uv pip check --python "$python"

          "$python" - <<'PY'
          import opentelemetry.sdk
          from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter as GrpcExporter
          from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter as HttpExporter
          print('OTEL_SDK_IMPORT=PASS')
          print('OTEL_GRPC_EXPORTER_IMPORT=PASS', GrpcExporter.__name__)
          print('OTEL_HTTP_EXPORTER_IMPORT=PASS', HttpExporter.__name__)
          PY

          "$python" -m ruff check src scripts tests
          "$python" -m ruff format --check src scripts tests
          "$python" -m compileall -q src scripts tests
          echo 'STATIC_GATES=PASS'

          set +e
          "$python" -m pytest --collect-only -q --tb=short > "$RUNNER_TEMP/otel-collection.txt" 2>&1
          collect_rc=$?
          set -e
          cat "$RUNNER_TEMP/otel-collection.txt"
          test "$collect_rc" -eq 0
          ! grep -q 'ERROR collecting' "$RUNNER_TEMP/otel-collection.txt"
          ! grep -Eq '[0-9]+ errors? during collection' "$RUNNER_TEMP/otel-collection.txt"
          echo 'PYTEST_COLLECTION_ERRORS=0'

          "$python" -m pytest -q tests/telemetry
          echo 'TELEMETRY_SUITE=PASS'

          set +e
          "$python" -m pytest -q --tb=short > "$RUNNER_TEMP/otel-full-pytest.txt" 2>&1
          full_rc=$?
          set -e
          cat "$RUNNER_TEMP/otel-full-pytest.txt"
          test "$full_rc" -ne 2
          test "$full_rc" -ne 3
          test "$full_rc" -ne 4
          test "$full_rc" -ne 5
          if grep -q 'ERROR collecting' "$RUNNER_TEMP/otel-full-pytest.txt"; then
            echo 'unexpected collection error in full pytest'
            exit 1
          fi
          if grep -Eq '[0-9]+ errors? during collection' "$RUNNER_TEMP/otel-full-pytest.txt"; then
            echo 'unexpected collection summary in full pytest'
            exit 1
          fi
          echo "FULL_PYTEST_RC=$full_rc"
          echo 'FULL_PYTEST_REACHED_EXECUTION=PASS'

          git fetch origin main fix/pytest-opentelemetry-dev-deps-v1
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/fix/pytest-opentelemetry-dev-deps-v1)" = "$EVENT_HEAD"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml uv.lock
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 2
          test "${staged[0]}" = "pyproject.toml"
          test "${staged[1]}" = "uv.lock"
          git commit -m "test(deps): include OpenTelemetry in standard dev environment (#201)"
          repaired_head="$(git rev-parse HEAD)"
          echo "REPAIRED_HEAD=$repaired_head"
          git push origin HEAD:fix/pytest-opentelemetry-dev-deps-v1

          rm -rf -- "$venv" "$cache" \
            "$RUNNER_TEMP/otel-uv.lock.before" \
            "$RUNNER_TEMP/otel-collection.txt" \
            "$RUNNER_TEMP/otel-full-pytest.txt"
