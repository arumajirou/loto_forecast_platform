name: reconciliation-upstream-restore-verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/reconciliation-upstream-wrapper-restore-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/reconciliation-upstream-wrapper-restore-v1
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact recovered blob
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:src/loto/reconciliation/hierarchy.py)" = "883d7a0bb9a1c4447f63d9e1489f80e6dd4615e8"
          echo 'RECOVERED_HIERARCHY_BLOB=PASS'

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Verify standard dev environment and collection delta
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-reconciliation-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-reconciliation-restore-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          echo "venv=$venv" >> "$GITHUB_ENV"
          echo "cache=$cache" >> "$GITHUB_ENV"
          echo "python=$python" >> "$GITHUB_ENV"

          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          uv pip check --python "$python"
          test "$("$python" -m ruff --version)" = 'ruff 0.16.0'

          "$python" -m ruff check src scripts tests
          "$python" -m ruff format src/loto/reconciliation/hierarchy.py
          mapfile -t formatted < <(git diff --name-only | sort)
          test "${#formatted[@]}" -eq 1
          test "${formatted[0]}" = 'src/loto/reconciliation/hierarchy.py'
          git diff --check
          "$python" -m ruff check src scripts tests
          "$python" -m ruff format --check src/loto/reconciliation/hierarchy.py
          "$python" -m compileall -q src scripts tests
          echo 'SHADOW_FORMAT_ONLY=PASS'
          echo 'STATIC_GATES=PASS'

          set +e
          "$python" -m pytest --collect-only -q --tb=short > "$RUNNER_TEMP/collection.txt" 2>&1
          collect_rc=$?
          set -e
          echo "COLLECT_RC=$collect_rc"
          test "$collect_rc" -eq 2
          "$python" - "$RUNNER_TEMP/collection.txt" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          nums=[int(m.group(1)) for m in re.finditer(r'(\d+) errors? during collection',text)]
          count=nums[-1] if nums else sum('ERROR collecting ' in line for line in text.splitlines())
          print(f'POST_RECONCILIATION_COLLECTION_ERRORS={count}')
          headings=re.findall(r'^_+ ERROR collecting (.+?) _+$',text,re.MULTILINE)
          for path in headings:
              print(f'REMAINING_COLLECTION_ERROR\t{path}')
          assert count==5,(count,text[-8000:])
          expected={
              'tests/auto_campaign/test_model_factory.py',
              'tests/auto_campaign/test_search_space_profile.py',
              'tests/basicts_campaign/test_bridge.py',
              'tests/basicts_campaign/test_config_loader.py',
              'tests/telemetry/test_otel_backend.py',
          }
          assert set(headings)==expected,(set(headings),expected)
          PY

          "$python" -m pytest -q \
            tests/test_reconciliation.py \
            tests/test_reconciliation_upstream_matrix.py \
            tests/test_reconciliation_runtime_certification.py \
            tests/test_reconciliation_console_script.py \
            tests/test_reconciliation_package_certification.py
          echo 'FOCUSED_RECONCILIATION_TESTS=PASS'

      - name: Verify real HierarchicalForecast 1.5.1 smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'hierarchicalforecast==1.5.1'
          uv pip check --python "$python"
          "$python" - <<'PY'
          import hierarchicalforecast
          import numpy as np
          from loto.game.geometry import geometry_for
          from loto.reconciliation.hierarchy import (
              UPSTREAM_METHODS,
              build_number_hierarchy,
              reconcile_with_hierarchicalforecast,
          )

          print(f'HIERARCHICALFORECAST_VERSION={hierarchicalforecast.__version__}')
          assert hierarchicalforecast.__version__ == '1.5.1'
          assert len(UPSTREAM_METHODS)==10
          hierarchy=build_number_hierarchy(geometry_for('loto7'))
          base=np.arange(hierarchy.n_total,dtype=float).reshape(-1,1)
          for method in ('BottomUp','MinTrace','OptimalCombination'):
              result=reconcile_with_hierarchicalforecast(base,hierarchy,method=method)
              print(f'REAL_METHOD\t{method}\t{result.get("status")}\t{result.get("coherence_error")}')
              assert result['status']=='VERIFIED',result
              assert result['actual_execution'] is True
              assert result['finite'] is True
              assert result['shape']==[hierarchy.n_total,1]
              assert float(result['coherence_error']) <= float(result['coherence_tolerance'])
          print('REAL_HIERARCHICALFORECAST_SMOKE=PASS')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"
          rm -rf -- "${venv:-}" "${cache:-}" "$RUNNER_TEMP/collection.txt" || true
