name: autogluon-verifier-manifest-fix

on:
  push:
    branches:
      - feat/autogluon-shared-integration-v1
    paths:
      - .github/workflows/autogluon-verifier-manifest-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/autogluon-shared-integration-v1
          persist-credentials: true
          fetch-depth: 0
          clean: true
      - name: Patch verifier evidence manifest
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/autogluon-shared-integration-verifier.yml')
          text = path.read_text(encoding='utf-8')
          old = '            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS\n'
          new = '            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected manifest command count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/autogluon-shared-integration-verifier.yml"
      - name: Commit and push verifier fix
        run: |
          set -Eeuo pipefail
          git add .github/workflows/autogluon-shared-integration-verifier.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci(autogluon): fix verifier evidence checksums"
          git push origin HEAD:feat/autogluon-shared-integration-v1
