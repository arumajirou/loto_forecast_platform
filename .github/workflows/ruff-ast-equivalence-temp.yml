# isolated retrigger after retiring other temporary writers
name: ruff-ast-equivalence-temp

on:
  push:
    branches:
      - fix/ruff-format-normalization-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruff-ast-equivalence-temp
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.repository == 'arumajirou/loto_forecast_platform' && github.ref == 'refs/heads/fix/ruff-format-normalization-v1' && !contains(github.event.head_commit.message, 'capture Ruff AST equivalence') }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      TARGET_BRANCH: fix/ruff-format-normalization-v1
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      RESULT_PATH: .github/ruff-ast-equivalence-result.txt

    steps:
      - name: Verify runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout exact PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-format-normalization-v1
          persist-credentials: true
          fetch-depth: 0
          clean: true

      - name: Pin current main and branch
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$TARGET_BRANCH)"
          main_sha="$(git rev-parse origin/main)"
          head_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$main_sha" "$head_sha"
          echo "MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
          echo "SOURCE_HEAD=$head_sha" >> "$GITHUB_ENV"

      - name: Install exact uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Compare Python ASTs against current main
        run: |
          set -Eeuo pipefail
          actual="$(uv --version)"
          case "$actual" in "uv $UV_VERSION"*) ;; *) echo "unexpected uv: $actual" >&2; exit 1 ;; esac
          uv python install "$UV_PYTHON"
          python="$(uv python find "$UV_PYTHON")"
          "$python" - "$MAIN_SHA" "$SOURCE_HEAD" "$RESULT_PATH" <<'PY'
          from __future__ import annotations

          import ast
          import os
          import subprocess
          import sys
          from pathlib import Path

          main_sha, head_sha, result_path = sys.argv[1:]
          diff = subprocess.check_output(
              ["git", "diff", "--name-status", f"{main_sha}..{head_sha}", "--", "src", "scripts", "tests"],
              text=True,
          ).splitlines()

          changed: list[tuple[str, str]] = []
          unexpected_status: list[str] = []
          non_python: list[str] = []
          mismatches: list[str] = []
          parse_failures: list[str] = []

          for line in diff:
              if not line.strip():
                  continue
              parts = line.split("\t")
              status = parts[0]
              path = parts[-1]
              changed.append((status, path))
              if status != "M":
                  unexpected_status.append(line)
              if not path.endswith(".py"):
                  non_python.append(path)

          for status, path in changed:
              if status != "M" or not path.endswith(".py"):
                  continue
              try:
                  before = subprocess.check_output(["git", "show", f"{main_sha}:{path}"])
                  after = Path(path).read_bytes()
                  before_ast = ast.dump(ast.parse(before.decode("utf-8"), filename=path), include_attributes=False)
                  after_ast = ast.dump(ast.parse(after.decode("utf-8"), filename=path), include_attributes=False)
              except Exception as exc:
                  parse_failures.append(f"{path}: {type(exc).__name__}: {exc}")
                  continue
              if before_ast != after_ast:
                  mismatches.append(path)

          status = "PASS" if not unexpected_status and not non_python and not mismatches and not parse_failures else "FAIL"
          records = [
              "RUFF_AST_EQUIVALENCE_VERSION=1",
              f"RUN_ID={os.environ.get('GITHUB_RUN_ID', 'UNKNOWN')}",
              f"MAIN_SHA={main_sha}",
              f"SOURCE_HEAD={head_sha}",
              f"CHANGED_TARGET_FILES={len(changed)}",
              f"UNEXPECTED_STATUS_COUNT={len(unexpected_status)}",
              f"NON_PYTHON_COUNT={len(non_python)}",
              f"AST_MISMATCH_COUNT={len(mismatches)}",
              f"PARSE_FAILURE_COUNT={len(parse_failures)}",
              f"STATUS={status}",
          ]
          if unexpected_status:
              records += ["--- UNEXPECTED_STATUS ---", *unexpected_status]
          if non_python:
              records += ["--- NON_PYTHON ---", *non_python]
          if mismatches:
              records += ["--- AST_MISMATCHES ---", *mismatches]
          if parse_failures:
              records += ["--- PARSE_FAILURES ---", *parse_failures]
          Path(result_path).write_text("\n".join(records) + "\n", encoding="utf-8")
          print("\n".join(records[:10]))
          if status != "PASS":
              raise SystemExit(1)
          PY

      - name: Persist AST evidence to branch
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          test -f "$RESULT_PATH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_PATH"
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture Ruff AST equivalence (#196)"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$(git rev-parse HEAD^)"
          git push origin "HEAD:$TARGET_BRANCH"
