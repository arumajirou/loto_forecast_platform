name: statsforecast-phase-c-smoke

on:
  push:
    branches:
      - feat/statsforecast-real-game-evaluation-v1
    paths-ignore:
      - "audit/local-runs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: statsforecast-phase-c-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      BRANCH: feat/statsforecast-real-game-evaluation-v1

    steps:
      - name: Verify expected self-hosted runner
        run: |
          set -Eeuo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout Phase C branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare run paths
        run: |
          set -Eeuo pipefail
          uv python install "$UV_PYTHON"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          data_root="$RUNNER_TEMP/statsforecast-real-game-data-all-$run_id"
          root_venv="$RUNNER_TEMP/loto-root-$run_id"
          sf_venv="$RUNNER_TEMP/loto-statsforecast-$run_id"
          out="audit/local-runs/statsforecast-six-game-smoke-$run_id"
          printf 'DATA_ROOT=%s\n' "$data_root" >> "$GITHUB_ENV"
          printf 'ROOT_VENV=%s\n' "$root_venv" >> "$GITHUB_ENV"
          printf 'SF_VENV=%s\n' "$sf_venv" >> "$GITHUB_ENV"
          printf 'SF_PYTHON=%s/bin/python\n' "$sf_venv" >> "$GITHUB_ENV"
          printf 'OUT=%s\n' "$out" >> "$GITHUB_ENV"
          test ! -e "$out"

      - name: Acquire all six canonical games
        run: |
          set -Eeuo pipefail
          UV_PROJECT_ENVIRONMENT="$ROOT_VENV" \
          uv run --frozen python -m loto.cli \
            data acquire \
            --games all \
            --output "$DATA_ROOT" \
            --force \
            --fail-fast

      - name: Verify six-game acquisition contract
        run: |
          set -Eeuo pipefail
          UV_PROJECT_ENVIRONMENT="$ROOT_VENV" \
          uv run --frozen python - "$DATA_ROOT" <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected = {"bingo5", "loto6", "loto7", "mini", "numbers3", "numbers4"}
          summary = json.loads((root / "multi_game_summary.json").read_text(encoding="utf-8"))
          assert summary["status"] == "SUCCEEDED", summary
          assert set(summary["requested_games"]) == expected, summary
          assert set(summary["successful_games"]) == expected, summary
          assert summary["failed_games"] == [], summary
          for game in sorted(expected):
              csv_path = root / game / "normalized" / f"{game}.csv"
              quality_path = root / game / "normalized" / f"{game}.quality.json"
              assert csv_path.is_file(), csv_path
              assert quality_path.is_file(), quality_path
              quality = json.loads(quality_path.read_text(encoding="utf-8"))
              assert quality["status"] == "PASS", quality
              digest = hashlib.sha256(csv_path.read_bytes()).hexdigest()
              print(
                  f"DATA_OK game={game} rows={quality['rows']} "
                  f"frame_sha256={quality['frame_sha256']} file_sha256={digest}"
              )
          print("RESULT=SIX_GAME_DATA_ACQUISITION_PASS")
          PY

      - name: Prepare isolated StatsForecast 2.1.1 environment
        run: |
          set -Eeuo pipefail
          uv venv "$SF_VENV" --python "$UV_PYTHON"
          mapfile -t deps < <(
            uv run --no-project --python "$UV_PYTHON" python - <<'PY'
          import tomllib

          with open("environments/statsforecast-py313/pyproject.toml", "rb") as stream:
              project = tomllib.load(stream)["project"]
          for dependency in project["dependencies"]:
              print(dependency)
          PY
          )
          test "${#deps[@]}" -gt 0
          uv pip install --quiet --python "$SF_PYTHON" "${deps[@]}"
          PYTHONPATH="$GITHUB_WORKSPACE/src" "$SF_PYTHON" - <<'PY'
          import statsforecast

          assert statsforecast.__version__ == "2.1.1", statsforecast.__version__
          print(f"statsforecast_version={statsforecast.__version__}")
          PY

      - name: Run six-game StatsForecast smoke
        run: |
          set -Eeuo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" \
          "$SF_PYTHON" \
            -m loto.statsforecast.real_game_campaign \
            --data-root "$DATA_ROOT" \
            --output "$OUT" \
            --games bingo5,loto6,loto7,mini,numbers3,numbers4 \
            --seed 1 \
            --folds 1 \
            --test-size 1 \
            --min-train-size 100 \
            --holdout-size 50 \
            --device cpu \
            --precision 32

      - name: Verify 246-row semantic matrix and evidence
        run: |
          set -Eeuo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" "$SF_PYTHON" - "$OUT" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          summary = json.loads(
              (out / "STATSFORECAST_REAL_GAME_SUMMARY.json").read_text(encoding="utf-8")
          )
          expected_games = {"bingo5", "loto6", "loto7", "mini", "numbers3", "numbers4"}
          assert summary["statsforecast_models"] == 41, summary
          assert summary["primary_univariate_models"] == 39, summary
          assert summary["full_model_game_rows"] == 246, summary
          assert summary["primary_model_game_rows"] == 234, summary
          assert set(summary["games"]) == expected_games, summary
          assert summary["lane_counts_per_game"] == {
              "UNIVARIATE": 39,
              "EXOGENOUS": 1,
              "EXPECTED_NEGATIVE_CONTROL": 1,
          }, summary
          assert summary["primary_matrix_complete"] is True, summary
          assert summary["holdout_evaluated"] is False, summary
          assert summary["prospective_evaluated"] is False, summary
          assert summary["promotion"] is False, summary
          succeeded = int(summary["primary_status_counts"].get("SUCCEEDED", 0))
          failed = 234 - succeeded
          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          print(f"PRIMARY_SUCCEEDED={succeeded}")
          print(f"PRIMARY_NON_SUCCEEDED={failed}")
          (out / "SMOKE_GATE.json").write_text(
              json.dumps(
                  {
                      "schema_version": 1,
                      "primary_expected": 234,
                      "primary_succeeded": succeeded,
                      "primary_non_succeeded": failed,
                      "formal_smoke_pass": failed == 0,
                  },
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd "$OUT"
            sha256sum -c SHA256SUMS
          )

      - name: Verify all prediction locks were sealed before actuals
        run: |
          set -Eeuo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" "$SF_PYTHON" - "$OUT" <<'PY'
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          lock_root = out / "prediction_locks"
          locks = sorted(lock_root.rglob("seed-*.json"))
          if not locks:
              raise SystemExit("no prediction locks found")
          bad = []
          for path in locks:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if payload.get("actuals_known") is not False:
                  bad.append(str(path))
          if bad:
              raise SystemExit(f"prediction locks with invalid actuals_known: {bad[:20]}")
          print(f"PREDICTION_LOCK_COUNT={len(locks)}")
          print("RESULT=PREDICTION_LOCK_SENTINEL_PASS")
          PY

      - name: Refresh evidence manifest after smoke gate
        run: |
          set -Eeuo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/src" "$SF_PYTHON" - "$OUT" <<'PY'
          import sys
          from pathlib import Path

          from loto.statsforecast.certification_io import write_manifest_and_sums

          write_manifest_and_sums(Path(sys.argv[1]))
          PY
          (
            cd "$OUT"
            sha256sum -c SHA256SUMS
          )

      - name: Commit compact smoke evidence
        run: |
          set -Eeuo pipefail
          git status --short
          git add "$OUT"
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(statsforecast): record six-game real-game smoke evidence"
          git push origin "HEAD:$BRANCH"
          echo "EVIDENCE_COMMIT=$(git rev-parse HEAD)"
          echo "EVIDENCE=$OUT"

      - name: Enforce 234-of-234 primary smoke gate
        run: |
          set -Eeuo pipefail
          "$SF_PYTHON" - "$OUT/SMOKE_GATE.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          gate = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not gate["formal_smoke_pass"]:
              raise SystemExit(
                  f"primary smoke incomplete: {gate['primary_succeeded']}/"
                  f"{gate['primary_expected']} succeeded"
              )
          print("RESULT=STATSFORECAST_SIX_GAME_SMOKE_PASS")
          PY
