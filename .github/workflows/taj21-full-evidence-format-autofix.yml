name: temp / TAJ-21 full evidence formatter

on:
  push:
    branches:
      - feat/taj21-full-oof-evidence-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/taj21-full-oof-evidence-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.21
          enable-cache: false

      - name: Format exact files and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "feat/taj21-full-oof-evidence-v1"
          uv run --frozen ruff format \
            src/loto/evaluation/taj21_artifacts.py \
            tests/test_taj21_full_evidence.py
          git diff --check
          rm -- .github/workflows/taj21-full-evidence-format-autofix.yml
          git add -- \
            src/loto/evaluation/taj21_artifacts.py \
            tests/test_taj21_full_evidence.py \
            .github/workflows/taj21-full-evidence-format-autofix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Ruff to TAJ-21 full evidence"
          git push origin HEAD:feat/taj21-full-oof-evidence-v1
