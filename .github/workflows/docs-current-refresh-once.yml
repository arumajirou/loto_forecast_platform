name: docs-current-refresh-once

on:
  push:
    branches:
      - agent/documentation-current-state-20260810
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message || '', '[docs-current-refreshed]') }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/documentation-current-state-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Patch current documentation and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8")

          # Root README: preserve the package-version exact phrase and add the merged campaign/current docs.
          readme_links_old = '''- [`docs/MODEL_EXECUTION_MATRIX.md`](docs/MODEL_EXECUTION_MATRIX.md) — **コード・worker・provider・runtime evidenceから確認した実際のモデル/ライブラリ実行経路**
          - [`docs/STATUS.md`](docs/STATUS.md) — GitHub/Linear/科学進捗を突合した時点付き監査スナップショット
          - [`docs/README.md`](docs/README.md) — live code / generated inventory / runtime evidence / historical evidenceの読み分け
          - [`docs/DOCUMENTATION_POLICY.md`](docs/DOCUMENTATION_POLICY.md) — stale/current/historical資料の更新規約
          - [`docs/MODEL_INVENTORY.md`](docs/MODEL_INVENTORY.md) — 自動生成された**広い在庫**。`loto3 catalog --counts`が対応する
          - [`docs/evaluation_protocol/PROTOCOL_V2.md`](docs/evaluation_protocol/PROTOCOL_V2.md) — formal評価protocol
          '''
          readme_links_new = '''- [`docs/STATUS.md`](docs/STATUS.md) — GitHub/科学進捗を突合した時点付き監査スナップショット
          - [`docs/CURRENT_HANDOFF.md`](docs/CURRENT_HANDOFF.md) — 現在の引継ぎ資料と次の安全な作業順序
          - [`docs/CURRENT_VERIFICATION_REPORT.md`](docs/CURRENT_VERIFICATION_REPORT.md) — 現在のmerge/CI/科学境界の検証報告
          - [`docs/CURRENT_RUNBOOK.md`](docs/CURRENT_RUNBOOK.md) — repository運用とunified campaignの現行runbook
          - [`docs/UNIFIED_EVALUATION_CAMPAIGN.md`](docs/UNIFIED_EVALUATION_CAMPAIGN.md) — **全モデル×全6ゲームをfail-visibleに評価するdevelopment campaign**
          - [`docs/MODEL_EXECUTION_MATRIX.md`](docs/MODEL_EXECUTION_MATRIX.md) — **コード・worker・provider・runtime evidenceから確認した実際のモデル/ライブラリ実行経路**
          - [`docs/README.md`](docs/README.md) — live code / generated inventory / runtime evidence / historical evidenceの読み分け
          - [`docs/DOCUMENTATION_POLICY.md`](docs/DOCUMENTATION_POLICY.md) — stale/current/historical資料の更新規約
          - [`docs/MODEL_INVENTORY.md`](docs/MODEL_INVENTORY.md) — 自動生成された**広い在庫**。`loto3 catalog --counts`が対応する
          - [`docs/evaluation_protocol/PROTOCOL_V2.md`](docs/evaluation_protocol/PROTOCOL_V2.md) — formal評価protocol
          '''
          replace_once("README.md", readme_links_old, readme_links_new)

          audit_marker = '## Code-grounded capability audit — 2026-08-10 16:47 JST\n'
          current_section = '''## Current merged evaluation surface — 2026-08-10

          `uv run loto3 campaign` is now merged on `main` via PR #248. It is the canonical
          development-only surface for materializing every requested broad-catalog model × canonical
          game pair exactly once while retaining unsupported/unavailable/failed combinations as evidence.

          ```bash
          uv run loto3 campaign --output unused --plan-only
          ```

          Real development execution expects canonical CSV inputs for `mini`, `loto6`, `loto7`,
          `bingo5`, `numbers3`, and `numbers4`:

          ```bash
          uv run loto3 campaign \\
            --input-dir /path/to/canonical-csv-directory \\
            --output /path/to/new-run-directory
          ```

          The campaign fixes Hit@±1 as the primary tolerance, retains all configured seeds, compares
          the mandatory baselines, and seals prediction artifacts before scoring reads actuals. It keeps
          Holdout and Prospective closed and does not claim that all 174 registered entries successfully
          execute on all six games. See `docs/STATUS.md` for the latest committed audit snapshot.

          `uv run loto3 research` and `uv run loto experiment research` remain separate older/specialized
          orchestration surfaces; neither should be silently reinterpreted as the unified campaign.

          ## Code-grounded capability audit snapshot — 2026-08-10 16:47 JST
          '''
          replace_once("README.md", audit_marker, current_section)

          # Documentation map.
          docs_table_marker = '| What repository/project state was last audited? | [`STATUS.md`](STATUS.md) |\n'
          docs_table_new = docs_table_marker + '''| What is the current handoff for the next engineer/agent? | [`CURRENT_HANDOFF.md`](CURRENT_HANDOFF.md) |
          | What is the current merge/CI verification snapshot? | [`CURRENT_VERIFICATION_REPORT.md`](CURRENT_VERIFICATION_REPORT.md) |
          | What runbook should I follow now? | [`CURRENT_RUNBOOK.md`](CURRENT_RUNBOOK.md) |
          | How do I run the all-model × all-game development campaign? | [`UNIFIED_EVALUATION_CAMPAIGN.md`](UNIFIED_EVALUATION_CAMPAIGN.md) and `loto3 campaign` |
          '''
          replace_once("docs/README.md", docs_table_marker, docs_table_new)

          surface_marker = '''factory.py + workers.py
            normal shared in-process/worker execution

          models/providers/**
          '''
          surface_new = '''factory.py + workers.py
            normal shared in-process/worker execution

          evaluation/unified_campaign.py + evaluation/unified_campaign_cli.py
            broad inventory × six-game fail-visible development campaign

          models/providers/**
          '''
          replace_once("docs/README.md", surface_marker, surface_new)

          live_marker = '''- `README.md` at repository root;
          - this `docs/README.md`;
          - `docs/MODEL_EXECUTION_MATRIX.md`;
          - `docs/DOCUMENTATION_POLICY.md`;
          '''
          live_new = '''- `README.md` at repository root;
          - this `docs/README.md`;
          - `docs/MODEL_EXECUTION_MATRIX.md`;
          - `docs/UNIFIED_EVALUATION_CAMPAIGN.md`;
          - `docs/CURRENT_RUNBOOK.md`;
          - `docs/DOCUMENTATION_POLICY.md`;
          '''
          replace_once("docs/README.md", live_marker, live_new)

          # Execution matrix: preserve the original detailed audit while adding the current merged adapter.
          matrix_header_old = '''> **Audit basis:** code and executable evidence on `main@0f7585bca90fe9c1578909018a2dc24fcfdc12cb`  
          > **Audited:** 2026-08-10 16:47 JST  
          > **Purpose:** describe what the repository can actually route, load, execute, or certify. This is not a restatement of the generated 174-entry inventory.
          '''
          matrix_header_new = '''> **Current addendum basis:** merged unified campaign and dependency state audited at `main@cc7ec5473730cfb18100bdfbb5228cf65e571b32`  
          > **Detailed routing snapshot basis:** code and executable evidence on `main@0f7585bca90fe9c1578909018a2dc24fcfdc12cb`, audited 2026-08-10 16:47 JST  
          > **Purpose:** describe what the repository can actually route, load, execute, or certify. This is not a restatement of the generated 174-entry inventory.
          >
          > The detailed provider counts/evidence below remain the earlier code-grounded snapshot. The current addendum records PR #248's merged six-game adapter without rewriting historical runtime observations.
          '''
          replace_once("docs/MODEL_EXECUTION_MATRIX.md", matrix_header_old, matrix_header_new)

          cli_row = '| `uv run loto3 research ...` | `orchestration/research_v3.py` | separate v3 scientific loop; built-in mandatory predictors plus caller-injected predictors, not automatic execution of all catalog entries |\n'
          cli_row_new = cli_row + '| `uv run loto3 campaign ...` | `loto.cli_v3` -> `evaluation.unified_campaign_cli` -> `evaluation.unified_campaign` | merged development-only broad-catalog × six-game matrix; executable combinations run, unsupported/failed combinations remain explicit rows |\n'
          replace_once("docs/MODEL_EXECUTION_MATRIX.md", cli_row, cli_row_new)

          interchangeable_old = 'The two research commands are not interchangeable.\n\n## 3. Shared research execution path\n'
          interchangeable_new = '''The two research commands are not interchangeable. The merged `loto3 campaign` command is a third,
          explicit surface: it is game-geometry-aware and materializes the requested broad-catalog × game
          coverage matrix. It does **not** make the older `orchestration/research.py` path multi-game, and a
          complete campaign matrix does not mean every model/game row succeeded.

          ## 3. Shared research execution path
          '''
          replace_once("docs/MODEL_EXECUTION_MATRIX.md", interchangeable_old, interchangeable_new)

          # Unified campaign status/evidence.
          replace_once(
              "docs/UNIFIED_EVALUATION_CAMPAIGN.md",
              '`IMPLEMENTED_ON_PR_248 / DEVELOPMENT_ONLY / HOLDOUT_CLOSED / PROSPECTIVE_CLOSED`',
              '`MERGED_ON_MAIN / DEVELOPMENT_ONLY / HOLDOUT_CLOSED / PROSPECTIVE_CLOSED`',
          )
          unified_intro = '''This document describes the executable campaign introduced for GitHub #247 / Linear TAJ-15.
          It is a code contract, not evidence that every third-party model succeeds on every game.
          '''
          unified_new = unified_intro + '''
          Merged implementation evidence:

          ```text
          PR=248
          merge_sha=aae45ba9294499f51cc5f1564de1c6ccf5814230
          exact_premerge_head=c7c8a039e7aa1aef34fbfd0af8dc2c41f67945a2
          linux_ci_run=31371724178 SUCCESS
          windows_portability_run=31371724143 SUCCESS
          ```

          A later audited main may contain dependency/documentation changes; the campaign identity above is
          retained so the implementation evidence remains reproducible. No full real-data 174 × 6 success
          claim follows from the merge itself.
          '''
          replace_once("docs/UNIFIED_EVALUATION_CAMPAIGN.md", unified_intro, unified_new)

          # Documentation policy canonical list.
          policy_old = '''- [`../README.md`](../README.md) — stable project overview and usage;
          - [`STATUS.md`](STATUS.md) — latest audited point-in-time state committed by the documentation process;
          - [`README.md`](README.md) — documentation map;
          - [`MODEL_INVENTORY.md`](MODEL_INVENTORY.md) — generated model inventory;
          - [`evaluation_protocol/PROTOCOL_V2.md`](evaluation_protocol/PROTOCOL_V2.md) — scientific evaluation contract.
          '''
          policy_new = '''- [`../README.md`](../README.md) — stable project overview and usage;
          - [`STATUS.md`](STATUS.md) — latest audited point-in-time state committed by the documentation process;
          - [`README.md`](README.md) — documentation map;
          - [`CURRENT_HANDOFF.md`](CURRENT_HANDOFF.md) — current handoff snapshot;
          - [`CURRENT_VERIFICATION_REPORT.md`](CURRENT_VERIFICATION_REPORT.md) — current merge/CI verification snapshot;
          - [`CURRENT_RUNBOOK.md`](CURRENT_RUNBOOK.md) — current operational runbook;
          - [`UNIFIED_EVALUATION_CAMPAIGN.md`](UNIFIED_EVALUATION_CAMPAIGN.md) — merged all-model × all-game development campaign contract;
          - [`MODEL_EXECUTION_MATRIX.md`](MODEL_EXECUTION_MATRIX.md) — code-grounded routing/capability matrix;
          - [`MODEL_INVENTORY.md`](MODEL_INVENTORY.md) — generated model inventory;
          - [`evaluation_protocol/PROTOCOL_V2.md`](evaluation_protocol/PROTOCOL_V2.md) — scientific evaluation contract.
          '''
          replace_once("docs/DOCUMENTATION_POLICY.md", policy_old, policy_new)

          # Changelog: current merged repository changes only.
          changelog_marker = '## Unreleased\n\n'
          changelog_add = '''## Unreleased

          - Added the merged `loto3 campaign` all-model × all-six-game development evaluation surface (#248), including fail-visible coverage rows, Hit@±1-first metrics, mandatory baselines, multi-seed summaries and prediction sealing.
          - Updated GitHub Actions checkout pins to validated actions/checkout v7.0.1 (#244).
          - Updated the `full` extra to permit Ray Tune `>=2.56.1` and refreshed `uv.lock` (#242).
          - Refreshed current repository status, handoff, verification, runbook, documentation navigation and historical supersession links after the merge batch.

          '''
          replace_once("CHANGELOG.md", changelog_marker, changelog_add)

          # Preserve old root verification evidence verbatim after a supersession banner.
          vr = Path("VERIFICATION_REPORT.md")
          original = vr.read_text(encoding="utf-8")
          if not original.startswith('> **Historical evidence notice'):
              banner = '''> **Historical evidence notice — preserved point-in-time report.**  
          > This root report verifies the version-single-source change at its original SHA/time; it is not the current whole-repository status.  
          > Current repository verification: [`docs/CURRENT_VERIFICATION_REPORT.md`](docs/CURRENT_VERIFICATION_REPORT.md).  
          > Current audited status: [`docs/STATUS.md`](docs/STATUS.md).  
          > The original evidence below is intentionally retained unchanged.

          '''
              vr.write_text(banner + original, encoding="utf-8")

          # Ensure the exact package-version phrase remains intact.
          readme = Path("README.md").read_text(encoding="utf-8")
          required = '現在のpackage versionはREADMEへ手書きしません。'
          if required not in readme:
              raise SystemExit("required README package-version phrase was lost")
          PY

          rm .github/workflows/docs-current-refresh-once.yml
          git diff --check

          allowed='^(README.md|CHANGELOG.md|VERIFICATION_REPORT.md|docs/README.md|docs/DOCUMENTATION_POLICY.md|docs/MODEL_EXECUTION_MATRIX.md|docs/UNIFIED_EVALUATION_CAMPAIGN.md|.github/workflows/docs-current-refresh-once.yml)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "unexpected documentation scope:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            README.md CHANGELOG.md VERIFICATION_REPORT.md \
            docs/README.md docs/DOCUMENTATION_POLICY.md docs/MODEL_EXECUTION_MATRIX.md \
            docs/UNIFIED_EVALUATION_CAMPAIGN.md \
            .github/workflows/docs-current-refresh-once.yml
          git commit -m 'docs: align current repository documentation [docs-current-refreshed]'
          git push origin HEAD:agent/documentation-current-state-20260810
