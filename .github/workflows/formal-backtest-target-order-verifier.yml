name: formal-backtest-target-order-verifier

on:
  pull_request:
    branches: [main]
    paths:
      - tests/data_access_ledger/test_formal_backtest_entrypoint.py
      - .github/workflows/formal-backtest-target-order-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-backtest-target-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify formal backtest target-order test repair
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'fix/formal-backtest-target-order-ast-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_MAIN: "fd19f3fd3d000e2a534f60e71cc3b965dbd7575a"

    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact main and repair scope
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN"...HEAD | sort)
          expected=(
            .github/workflows/formal-backtest-target-order-verifier.yml
            tests/data_access_ledger/test_formal_backtest_entrypoint.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare isolated verifier environment
        run: |
          set -Eeuo pipefail
          case "$(uv --version)" in "uv $UV_VERSION"*) ;; *) exit 1 ;; esac
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/formal-target-order-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/formal-target-order-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$venv" "$cache"
          mkdir -p -- "$cache"
          echo "VERIFIER_VENV=$venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$cache" uv venv "$venv" --python "$UV_PYTHON"

      - name: Install project dependencies
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          uv lock --check
          uv pip install --quiet --python "$python" --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          uv pip install --quiet --python "$python" -e ".[api,dev,postgres]"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock', 'rb') as stream:
              lock = tomllib.load(stream)
          versions = [p['version'] for p in lock['package'] if p.get('name') == 'ruff']
          if len(versions) != 1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          uv pip install --quiet --python "$python" "ruff==$ruff_version"
          uv pip check --python "$python"

      - name: Run standard static gates
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          "$python" -m ruff format --check src scripts tests
          "$python" -m ruff check src scripts tests
          "$python" -m compileall -q src scripts tests

      - name: Run focused data-access-ledger entrypoint tests
        run: |
          set -Eeuo pipefail
          "$VERIFIER_VENV/bin/python" -m pytest -q tests/data_access_ledger/test_formal_backtest_entrypoint.py

      - name: Verify collection remains zero-error
        run: |
          set -Eeuo pipefail
          "$VERIFIER_VENV/bin/python" -m pytest --collect-only -q >/dev/null

      - name: Re-measure full pytest runtime debt
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/formal-target-order-full-pytest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          echo "FULL_PYTEST_OUTPUT=$out" >> "$GITHUB_ENV"
          set +e
          "$VERIFIER_VENV/bin/python" -m pytest -q --tb=short 2>&1 | tee "$out"
          rc="${PIPESTATUS[0]}"
          set -e
          echo "FULL_PYTEST_RC=$rc" >> "$GITHUB_ENV"
          if [[ "$rc" -ne 0 && "$rc" -ne 1 ]]; then exit "$rc"; fi

      - name: Recheck main and repository cleanliness
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload full pytest comparison artifact
        if: ${{ always() && env.FULL_PYTEST_OUTPUT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: formal-target-order-full-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_PYTEST_OUTPUT }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove verifier-owned environment
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${VERIFIER_VENV:-}" ]]; then case "$VERIFIER_VENV" in "$RUNNER_TEMP"/*) rm -rf -- "$VERIFIER_VENV" ;; *) exit 1 ;; esac; fi
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf -- "$UV_CACHE_DIR" ;; *) exit 1 ;; esac; fi
