name: f401-i001-diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ruff-lint-f401-export-contracts-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/ruff-lint-f401-export-contracts-v1
          persist-credentials: false
          fetch-depth: 1
      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false
      - name: Reproduce aliases and print I001
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-f401-i001-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          UV_CACHE_DIR="$RUNNER_TEMP/loto-f401-i001-cache-${GITHUB_RUN_ID}" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          "$python" - <<'PY'
          import json,re,subprocess,sys
          from pathlib import Path
          proc=subprocess.run([sys.executable,'-m','ruff','check','--select','F401','--output-format=json','src','scripts','tests'],text=True,capture_output=True,check=False)
          rows=json.loads(proc.stdout or '[]')
          assert len(rows)==40,len(rows)
          replacements={}
          for row in rows:
              path=Path(row['filename']).resolve().relative_to(Path.cwd().resolve())
              line_no=int(row['location']['row']); lines=path.read_text(encoding='utf-8').splitlines(); original=lines[line_no-1]
              match=re.fullmatch(r'(\s*)([A-Za-z_][A-Za-z0-9_]*),(\s*)',original); assert match,(path,line_no,original)
              name=match.group(2)
              replacements.setdefault(path,{})[line_no]=f'{match.group(1)}{name} as {name},{match.group(3)}'
          for path,items in replacements.items():
              lines=path.read_text(encoding='utf-8').splitlines()
              for line_no,replacement in items.items(): lines[line_no-1]=replacement
              path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          set +e
          "$python" -m ruff check --select I001 --output-format=concise src/loto/autogluon_campaign/holdout_prospective.py src/loto/moirai2_campaign/target_execution.py
          rc=$?
          set -e
          echo "I001_RC=$rc"
          test "$rc" -eq 1
          git diff --check
          rm -rf -- "$venv" "$RUNNER_TEMP/loto-f401-i001-cache-${GITHUB_RUN_ID}"
