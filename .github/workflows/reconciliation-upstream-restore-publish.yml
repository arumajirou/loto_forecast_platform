name: reconciliation-upstream-restore-publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/reconciliation-upstream-wrapper-restore-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout exact event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 2

      - name: Gate one-shot publish
        id: gate
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVENT_HEAD"
          message="$(git log -1 --pretty=%s)"
          echo "event_head=$EVENT_HEAD"
          echo "head_message=$message"
          if [[ "$message" == "ci: publish verified reconciliation formatting (#201)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Verify, format, and publish source
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:src/loto/reconciliation/hierarchy.py)" = "883d7a0bb9a1c4447f63d9e1489f80e6dd4615e8"
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-reconciliation-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-reconciliation-publish-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          uv pip check --python "$python"
          test "$("$python" -m ruff --version)" = 'ruff 0.16.0'

          "$python" -m ruff check src scripts tests
          "$python" -m ruff format src/loto/reconciliation/hierarchy.py
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'src/loto/reconciliation/hierarchy.py'
          git diff --check
          "$python" -m ruff check src scripts tests
          "$python" -m ruff format --check src/loto/reconciliation/hierarchy.py
          "$python" -m compileall -q src scripts tests
          echo 'PUBLISH_STATIC_GATES=PASS'

          set +e
          "$python" -m pytest --collect-only -q --tb=short > "$RUNNER_TEMP/collection.txt" 2>&1
          collect_rc=$?
          set -e
          test "$collect_rc" -eq 2
          "$python" - "$RUNNER_TEMP/collection.txt" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          nums=[int(m.group(1)) for m in re.finditer(r'(\d+) errors? during collection',text)]
          count=nums[-1] if nums else sum('ERROR collecting ' in line for line in text.splitlines())
          print(f'POST_RECONCILIATION_COLLECTION_ERRORS={count}')
          assert count==5,(count,text[-8000:])
          expected={
              'tests/auto_campaign/test_search_policy_integration.py',
              'tests/auto_campaign/test_search_space_artifact_persistence.py',
              'tests/basicts_campaign/test_dataset.py',
              'tests/basicts_campaign/test_security_metrics.py',
              'tests/telemetry/test_otel_instrumentation_v1.py',
          }
          headings=set(re.findall(r'^_+ ERROR collecting (.+?) _+$',text,re.MULTILINE))
          assert headings==expected,(headings,expected)
          for token in ('_search_materialization','_persist_search_space_profile','build_windows','ConfigImportRejected','opentelemetry'):
              assert token in text,token
          PY

          "$python" -m pytest -q \
            tests/test_reconciliation.py \
            tests/test_reconciliation_upstream_matrix.py \
            tests/test_reconciliation_runtime_certification.py \
            tests/test_reconciliation_console_script.py \
            tests/test_reconciliation_package_certification.py
          echo 'FOCUSED_RECONCILIATION_TESTS=PASS'

          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'hierarchicalforecast==1.5.1'
          uv pip check --python "$python"
          "$python" - <<'PY'
          import hierarchicalforecast
          import numpy as np
          from loto.game.geometry import geometry_for
          from loto.reconciliation.hierarchy import UPSTREAM_METHODS, build_number_hierarchy, reconcile_with_hierarchicalforecast
          assert hierarchicalforecast.__version__=='1.5.1'
          assert len(UPSTREAM_METHODS)==10
          hierarchy=build_number_hierarchy(geometry_for('loto7'))
          base=np.arange(hierarchy.n_total,dtype=float).reshape(-1,1)
          for method in ('BottomUp','MinTrace','OptimalCombination'):
              result=reconcile_with_hierarchicalforecast(base,hierarchy,method=method)
              print(f'REAL_METHOD\t{method}\t{result.get("status")}\t{result.get("coherence_error")}')
              assert result['status']=='VERIFIED',result
              assert result['actual_execution'] is True
              assert result['finite'] is True
              assert result['shape']==[hierarchy.n_total,1]
              assert float(result['coherence_error']) <= float(result['coherence_tolerance'])
          print('REAL_HIERARCHICALFORECAST_SMOKE=PASS')
          PY

          git fetch origin fix/reconciliation-upstream-wrapper-restore-v1
          remote_head="$(git rev-parse origin/fix/reconciliation-upstream-wrapper-restore-v1)"
          test "$remote_head" = "$EVENT_HEAD"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/loto/reconciliation/hierarchy.py
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = 'src/loto/reconciliation/hierarchy.py'
          git commit -m "style(reconciliation): normalize restored wrapper (#201)"
          repaired_head="$(git rev-parse HEAD)"
          echo "REPAIRED_HEAD=$repaired_head"
          git push origin HEAD:fix/reconciliation-upstream-wrapper-restore-v1

          rm -rf -- "$venv" "$cache" "$RUNNER_TEMP/collection.txt"
