name: temporary Ruff format timedelta patch

on:
  push:
    branches:
      - fix/numpy-timedelta-explicit-unit-20260805

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/numpy-timedelta-explicit-unit-20260805
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Format changed tests
        run: |
          python -m pip install --no-cache-dir "ruff==0.16.1"
          python -m ruff format \
            tests/runtime_validation/test_runtime_validation_contracts.py \
            tests/test_formal_backtest.py \
            tests/test_pipeline_smoke.py

      - name: Remove temporary workflow and commit formatting
        run: |
          rm .github/workflows/temporary-ruff-format-timedelta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/runtime_validation/test_runtime_validation_contracts.py \
            tests/test_formal_backtest.py \
            tests/test_pipeline_smoke.py \
            .github/workflows/temporary-ruff-format-timedelta.yml
          git diff --cached --check
          git commit -m "style: format explicit timedelta fixtures"
          git push origin HEAD:fix/numpy-timedelta-explicit-unit-20260805
