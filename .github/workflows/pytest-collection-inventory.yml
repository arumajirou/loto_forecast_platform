name: pytest-collection-inventory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/pytest-collection-inventory-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout inventory branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/pytest-collection-inventory-v1
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Inventory collection errors
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-pytest-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-pytest-inventory-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          uv pip check --python "$python"
          test "$("$python" -m ruff --version)" = 'ruff 0.16.0'
          "$python" -m ruff check src scripts tests
          "$python" -m compileall -q src scripts tests

          set +e
          "$python" -m pytest --collect-only -q --tb=short > "$RUNNER_TEMP/collection.txt" 2>&1
          collect_rc=$?
          set -e
          echo "COLLECT_RC=$collect_rc"
          test "$collect_rc" -eq 2

          "$python" - "$RUNNER_TEMP/collection.txt" <<'PY'
          from __future__ import annotations

          import ast
          import collections
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          summary = [int(m.group(1)) for m in re.finditer(r'(\d+) errors? during collection', text)]
          header_count = sum(1 for line in text.splitlines() if 'ERROR collecting ' in line)
          error_count = summary[-1] if summary else header_count
          print(f'COLLECTION_ERRORS={error_count}')
          assert error_count == 34, (error_count, text[-8000:])

          heading = re.compile(r'^_+ ERROR collecting (.+?) _+$', re.MULTILINE)
          matches = list(heading.finditer(text))
          print(f'ERROR_BLOCKS={len(matches)}')
          assert len(matches) == 34, len(matches)

          records = []
          signatures = collections.Counter()
          paths = collections.Counter()
          for idx, match in enumerate(matches):
              path = match.group(1).strip()
              start = match.end()
              end = matches[idx + 1].start() if idx + 1 < len(matches) else len(text)
              block = text[start:end]
              exception_lines = []
              for line in block.splitlines():
                  stripped = line.strip()
                  if re.match(r'^(ModuleNotFoundError|ImportError|AttributeError|NameError|TypeError|ValueError|SyntaxError|RuntimeError|KeyError|FileNotFoundError):', stripped):
                      exception_lines.append(stripped)
              root = exception_lines[-1] if exception_lines else next(
                  (line.strip() for line in reversed(block.splitlines()) if line.strip() and not line.startswith('=')),
                  'UNKNOWN',
              )
              root = re.sub(r'\s+', ' ', root)
              records.append((path, root))
              signatures[root] += 1
              paths[path] += 1
              print(f'COLLECTION_ERROR\t{path}\t{root}')

          print('ROOT_SIGNATURE_COUNTS_BEGIN')
          for root, count in signatures.most_common():
              print(f'{count}\t{root}')
          print('ROOT_SIGNATURE_COUNTS_END')

          # Search repository for missing modules/symbol definitions without importing them.
          pyfiles = sorted(Path('src').rglob('*.py')) + sorted(Path('tests').rglob('*.py'))
          symbol_index: dict[str, list[str]] = collections.defaultdict(list)
          module_stems: dict[str, list[str]] = collections.defaultdict(list)
          for file in pyfiles:
              module_stems[file.stem].append(file.as_posix())
              try:
                  tree = ast.parse(file.read_text(encoding='utf-8'), filename=str(file))
              except (SyntaxError, UnicodeDecodeError):
                  continue
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      symbol_index[node.name].append(f'{file}:{node.lineno}')
                  elif isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      for target in targets:
                          if isinstance(target, ast.Name):
                              symbol_index[target.id].append(f'{file}:{node.lineno}')

          print('MISSING_TARGET_SEARCH_BEGIN')
          for path, root in records:
              mod = re.search(r"No module named ['\"]([^'\"]+)['\"]", root)
              sym = re.search(r"cannot import name ['\"]([^'\"]+)['\"] from ['\"]([^'\"]+)['\"]", root)
              if mod:
                  name = mod.group(1)
                  stem = name.rsplit('.', 1)[-1]
                  candidates = module_stems.get(stem, [])
                  print(f'MODULE\t{path}\t{name}\tCANDIDATES={"|".join(candidates[:12]) or "NONE"}')
              elif sym:
                  name, module = sym.groups()
                  candidates = symbol_index.get(name, [])
                  print(f'SYMBOL\t{path}\t{module}\t{name}\tDEFINITIONS={"|".join(candidates[:12]) or "NONE"}')
          print('MISSING_TARGET_SEARCH_END')

          # Expose suspicious test-local imports for import-layout classification.
          failed_paths = sorted({path for path, _ in records if path.endswith('.py')})
          print('FAILED_TEST_IMPORTS_BEGIN')
          for raw in failed_paths:
              file = Path(raw)
              if not file.exists():
                  continue
              try:
                  tree = ast.parse(file.read_text(encoding='utf-8'), filename=str(file))
              except SyntaxError:
                  continue
              imports = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      imports.extend(alias.name for alias in node.names)
                  elif isinstance(node, ast.ImportFrom):
                      prefix = '.' * node.level + (node.module or '')
                      imports.append(prefix + ':' + ','.join(alias.name for alias in node.names))
              suspicious = [item for item in imports if any(token in item for token in ('conftest', 'p10_helpers', 'p11_helpers', 'test_approval_authorization', 'test_holdout_scoring'))]
              if suspicious:
                  print(f'IMPORTS\t{raw}\t' + '|'.join(suspicious))
          print('FAILED_TEST_IMPORTS_END')
          PY

          rm -rf -- "$venv" "$cache" "$RUNNER_TEMP/collection.txt"
