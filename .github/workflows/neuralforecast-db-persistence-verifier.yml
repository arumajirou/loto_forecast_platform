name: neuralforecast-db-persistence-verifier

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify NeuralForecast DB persistence installer
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 90
    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_MAIN: "6cd42b03bf1dd939cf38afda3b53cba146d30710"
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact main and repair scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN"...HEAD | sort)
          expected=(
            .github/workflows/neuralforecast-db-persistence-verifier.yml
            src/loto/neuralforecast/__init__.py
            src/loto/neuralforecast/db_automodel_facade.py
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.21"
          enable-cache: false

      - name: Prepare isolated verifier environment
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/nf-db-persistence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/nf-db-persistence-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p -- "$cache"
          echo "VERIFIER_VENV=$venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$cache" uv venv "$venv" --python "$UV_PYTHON"

      - name: Install project dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          uv lock --check
          uv pip install --quiet --python "$python" --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          uv pip install --quiet --python "$python" -e ".[api,dev,postgres]"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock', 'rb') as stream:
              lock = tomllib.load(stream)
          versions = [p['version'] for p in lock['package'] if p.get('name') == 'ruff']
          if len(versions) != 1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          uv pip install --quiet --python "$python" "ruff==$ruff_version"
          uv pip check --python "$python"

      - name: Run standard static gates
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          "$python" -m ruff format --check src scripts tests
          "$python" -m ruff check src scripts tests
          "$python" -m compileall -q src scripts tests

      - name: Verify focused DB search-space persistence
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          "$python" -m pytest -q tests/test_neuralforecast_db_search_space_persistence.py

      - name: Verify stable core runtime compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          set +e
          "$python" -m pytest -q \
            tests/test_neuralforecast_db_automodel.py::test_single_automodel_passes_core_fit_and_runtime_certification
          rc=$?
          set -e
          if [[ "$rc" -ne 0 ]]; then
            root="${TMPDIR:-/tmp}/pytest-of-${USER}"
            echo "=== campaign reports ==="
            find "$root" -type f -path '*test_single_automodel_passes_c*/campaign/campaign_report.json' \
              -print -exec cat {} \; 2>/dev/null || true
            echo "=== model run reports ==="
            find "$root" -type f -path '*test_single_automodel_passes_c*/campaign/models/*/run_report.json' \
              -print -exec cat {} \; 2>/dev/null || true
            exit "$rc"
          fi

      - name: Verify collection remains zero-error
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          "$python" -m pytest --collect-only -q >/dev/null

      - name: Re-measure full pytest runtime debt
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          out="$RUNNER_TEMP/nf-db-persistence-full-pytest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          echo "FULL_PYTEST_ARTIFACT=$out" >> "$GITHUB_ENV"
          set +e
          "$python" -m pytest -q >"$out" 2>&1
          rc=$?
          set -e
          failed_count="$(grep -c '^FAILED ' "$out" || true)"
          echo "FULL_PYTEST_RC=$rc"
          echo "FULL_PYTEST_FAILED_COUNT=$failed_count"
          grep '^FAILED ' "$out" || true
          test "$rc" -ne 0
          test "$failed_count" -eq 11
          ! grep -Fq 'tests/test_neuralforecast_db_search_space_persistence.py::test_package_exports_keep_stable_core_class_identity' "$out"
          ! grep -Fq 'tests/test_neuralforecast_db_automodel.py::test_single_automodel_passes_core_fit_and_runtime_certification' "$out"

      - name: Recheck main and repository cleanliness
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload full pytest comparison artifact
        if: always() && env.FULL_PYTEST_ARTIFACT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nf-db-persistence-full-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_PYTEST_ARTIFACT }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove verifier-owned environment
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${VERIFIER_VENV:-}" ]]; then
            case "$VERIFIER_VENV" in "$RUNNER_TEMP"/*) rm -rf -- "$VERIFIER_VENV" ;; *) exit 1 ;; esac
          fi
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then
            case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf -- "$UV_CACHE_DIR" ;; *) exit 1 ;; esac
          fi
