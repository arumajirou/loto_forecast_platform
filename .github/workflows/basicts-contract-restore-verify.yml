name: basicts-contract-restore-verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/basicts-contract-restore-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/basicts-contract-restore-v1
          persist-credentials: false
          fetch-depth: 2

      - name: Verify exact recovered blobs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:src/loto/basicts_campaign/dataset.py)" = "5895515581445df732b44f327cb07cef5bd9823a"
          test "$(git rev-parse HEAD:src/loto/basicts_campaign/security.py)" = "d431e1e97d7ec02d0bfc1323cfbd3332a61b6c71"
          echo 'RECOVERED_BASICTS_BLOBS=PASS'

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Verify collection and BasicTS focused tests
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-basicts-restore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-basicts-restore-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          echo "venv=$venv" >> "$GITHUB_ENV"
          echo "cache=$cache" >> "$GITHUB_ENV"
          echo "python=$python" >> "$GITHUB_ENV"

          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          uv pip check --python "$python"
          test "$("$python" -m ruff --version)" = 'ruff 0.16.0'

          "$python" - <<'PY'
          from pathlib import Path
          path=Path('src/loto/basicts_campaign/dataset.py')
          text=path.read_text(encoding='utf-8')
          old='zip(draw_numbers, draw_numbers[1:])'
          new='zip(draw_numbers, draw_numbers[1:], strict=False)'
          assert text.count(old)==1,text.count(old)
          path.write_text(text.replace(old,new),encoding='utf-8')
          print('B905_SEMANTICS=strict_false')
          PY

          "$python" -m ruff format src/loto/basicts_campaign/dataset.py src/loto/basicts_campaign/security.py
          mapfile -t formatted < <(git diff --name-only | sort)
          test "${#formatted[@]}" -ge 1
          test "${#formatted[@]}" -le 2
          for path in "${formatted[@]}"; do
            case "$path" in
              src/loto/basicts_campaign/dataset.py|src/loto/basicts_campaign/security.py) ;;
              *) echo "unexpected formatter path: $path"; exit 1 ;;
            esac
          done
          git diff --check
          "$python" -m ruff check src scripts tests
          "$python" -m ruff format --check src/loto/basicts_campaign/dataset.py src/loto/basicts_campaign/security.py
          "$python" -m compileall -q src scripts tests
          echo 'STATIC_GATES=PASS'

          set +e
          "$python" -m pytest --collect-only -q --tb=short > "$RUNNER_TEMP/collection.txt" 2>&1
          collect_rc=$?
          set -e
          test "$collect_rc" -eq 2
          "$python" - "$RUNNER_TEMP/collection.txt" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          nums=[int(m.group(1)) for m in re.finditer(r'(\d+) errors? during collection',text)]
          count=nums[-1] if nums else sum('ERROR collecting ' in line for line in text.splitlines())
          headings=set(re.findall(r'^_+ ERROR collecting (.+?) _+$',text,re.MULTILINE))
          print(f'POST_BASICTS_COLLECTION_ERRORS={count}')
          for path in sorted(headings): print(f'REMAINING_COLLECTION_ERROR\t{path}')
          assert count==3,(count,text[-8000:])
          expected={
              'tests/auto_campaign/test_search_policy_integration.py',
              'tests/auto_campaign/test_search_space_artifact_persistence.py',
              'tests/telemetry/test_otel_instrumentation_v1.py',
          }
          assert headings==expected,(headings,expected)
          for token in ('_search_materialization','_persist_search_space_profile','opentelemetry'):
              assert token in text,token
              print(f'RESIDUAL_SIGNATURE\t{token}\tPRESENT')
          PY

          "$python" -m pytest -q tests/basicts_campaign
          echo 'FOCUSED_BASICTS_TESTS=PASS'

          "$python" - <<'PY'
          import numpy as np
          from loto.basicts_campaign.dataset import GameGeometry, build_windows, compile_wide_rows
          from loto.basicts_campaign.protocol import ImportReference
          from loto.basicts_campaign.security import ConfigImportRejected, resolve_import_reference, validate_import_reference

          geometry=GameGeometry('numbers3',('N1','N2','N3'),0,9)
          rows=[
              {'draw_no':1,'N1':1,'N2':2,'N3':3},
              {'draw_no':2,'N1':2,'N2':3,'N3':4},
              {'draw_no':3,'N1':3,'N2':4,'N3':5},
              {'draw_no':4,'N1':4,'N2':5,'N3':6},
          ]
          values,identity=compile_wide_rows(rows,geometry)
          windows=build_windows(values,identity,input_len=2,output_len=1)
          assert windows.inputs.shape==(2,2,3)
          assert windows.targets.shape==(2,1,3)
          assert windows.sample_identity[0]['target_draw_nos']==[3]
          ref=ImportReference(module='torch.optim',name='Adam')
          validate_import_reference(ref)
          evidence=resolve_import_reference(ref)
          assert evidence['qualified_name']=='torch.optim.Adam'
          try:
              validate_import_reference(ImportReference(module='os',name='system'))
          except ConfigImportRejected:
              pass
          else:
              raise AssertionError('unsafe import did not fail closed')
          assert np.isfinite(values).all()
          print('BASICTS_CONTRACT_SMOKE=PASS')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          git reset --hard HEAD
          git clean -ffdx
          test -z "$(git status --porcelain)"
          rm -rf -- "${venv:-}" "${cache:-}" "$RUNNER_TEMP/collection.txt" || true
