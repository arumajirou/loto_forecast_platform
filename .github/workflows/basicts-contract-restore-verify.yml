name: basicts-contract-restore-verify

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/basicts-contract-restore-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout compatibility branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/basicts-contract-restore-v1
          persist-credentials: false
          fetch-depth: 2

      - name: Verify focused source scope
        shell: bash
        run: |
          set -Eeuo pipefail
          base=e4fa85bedb4c814f28d711967ecedb1696473a47
          git fetch origin "$base" --depth=1
          mapfile -t changed < <(git diff --name-only "$base" HEAD | sort)
          printf 'BRANCH_CHANGED\t%s\n' "${changed[@]}"
          allowed=(
            .github/workflows/basicts-contract-restore-verify.yml
            scripts/run_basicts_provider.py
            src/loto/basicts_campaign/dataset.py
            src/loto/basicts_campaign/metrics.py
            src/loto/basicts_campaign/security.py
          )
          test "${changed[*]}" = "${allowed[*]}"

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Verify collection and BasicTS compatibility
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-basicts-compat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-basicts-compat-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          echo "venv=$venv" >> "$GITHUB_ENV"
          echo "cache=$cache" >> "$GITHUB_ENV"

          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          uv pip check --python "$python"
          test "$("$python" -m ruff --version)" = 'ruff 0.16.0'

          "$python" -m ruff check src scripts tests
          "$python" -m ruff format --check \
            scripts/run_basicts_provider.py \
            src/loto/basicts_campaign/dataset.py \
            src/loto/basicts_campaign/metrics.py \
            src/loto/basicts_campaign/security.py
          "$python" -m compileall -q src scripts tests
          git diff --check
          echo 'STATIC_GATES=PASS'

          set +e
          "$python" -m pytest --collect-only -q --tb=short > "$RUNNER_TEMP/collection.txt" 2>&1
          collect_rc=$?
          set -e
          test "$collect_rc" -eq 2
          "$python" - "$RUNNER_TEMP/collection.txt" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          nums=[int(m.group(1)) for m in re.finditer(r'(\d+) errors? during collection',text)]
          count=nums[-1] if nums else sum('ERROR collecting ' in line for line in text.splitlines())
          headings=set(re.findall(r'^_+ ERROR collecting (.+?) _+$',text,re.MULTILINE))
          print(f'POST_BASICTS_COLLECTION_ERRORS={count}')
          for path in sorted(headings): print(f'REMAINING_COLLECTION_ERROR\t{path}')
          assert count==3,(count,text[-8000:])
          expected={
              'tests/auto_campaign/test_search_policy_integration.py',
              'tests/auto_campaign/test_search_space_artifact_persistence.py',
              'tests/telemetry/test_otel_instrumentation_v1.py',
          }
          assert headings==expected,(headings,expected)
          for token in ('_search_materialization','_persist_search_space_profile','opentelemetry'):
              assert token in text,token
          PY

          "$python" -m pytest -q tests/basicts_campaign
          echo 'FOCUSED_BASICTS_TESTS=PASS'

          "$python" - <<'PY'
          import tempfile
          from pathlib import Path
          import numpy as np
          import torch.optim
          from loto.basicts_campaign.contracts import DatasetPayload, ImportReference, SafeConfig
          from loto.basicts_campaign.dataset import GEOMETRIES, GameGeometry, build_windows, compile_basic_ts_dataset, compile_wide_rows, split_chronologically
          from loto.basicts_campaign.metrics import evaluate_predictions
          from loto.basicts_campaign.security import ConfigImportRejected, UnsafeImportReference, resolve_import_reference, validate_import_reference, validate_safe_config

          assert ConfigImportRejected is UnsafeImportReference
          current=GEOMETRIES['numbers3']
          assert (current.game,current.positions,current.minimum,current.maximum)==('numbers3',3,0,9)
          legacy=GameGeometry(game_id='numbers3',position_columns=('n1','n2','n3'),minimum_value=0,maximum_value=9)
          assert (legacy.game,legacy.positions,legacy.minimum,legacy.maximum)==('numbers3',3,0,9)
          rows=[
              {'draw_no':1,'n1':1,'n2':2,'n3':3},
              {'draw_no':2,'n1':2,'n2':3,'n3':4},
              {'draw_no':3,'n1':3,'n2':4,'n3':5},
              {'draw_no':4,'n1':4,'n2':5,'n3':6},
          ]
          values,identity=compile_wide_rows(rows,legacy)
          windows=build_windows(values,identity,input_len=2,output_len=1)
          assert windows.inputs.shape==(2,2,3)
          assert windows.targets.shape==(2,1,3)
          assert windows.sample_identity[0]['target_draw_nos']==[3]

          payload=DatasetPayload.model_validate({
              'game':'numbers3',
              'rows':[{'draw_no':i,'values':[i%10,(i+1)%10,(i+2)%10]} for i in range(1,9)],
              'validation_size':2,
              'holdout_size':2,
          })
          assert split_chronologically(payload).train_draw_no==(1,2,3,4)
          with tempfile.TemporaryDirectory() as tmp:
              assert compile_basic_ts_dataset(payload,Path(tmp))['formal_holdout_materialized'] is False

          ref=ImportReference(module='torch.optim',name='Adam')
          validate_import_reference(ref)
          assert resolve_import_reference(ref) is torch.optim.Adam
          assert validate_safe_config(SafeConfig(),resolve=False)['optimizer']=='torch.optim.Adam'
          try:
              validate_import_reference(ImportReference(module='os',name='system'))
          except ConfigImportRejected:
              pass
          else:
              raise AssertionError('unsafe import did not fail closed')

          actual=np.asarray([[1.0,5.0],[4.0,8.0]])
          predicted=np.asarray([[2.0,7.0],[4.0,7.0]])
          metrics=evaluate_predictions(actual,predicted)
          assert metrics['hit_at_1']==metrics['hit_at_plus_minus_1']==0.75
          assert metrics['all_position_hit_at_1']==metrics['all_position_hit_at_plus_minus_1']==0.5
          assert metrics['position_hit_at_1']==metrics['position_hit_at_plus_minus_1']==[1.0,0.5]
          print('BASICTS_CURRENT_AND_LEGACY_CONTRACT_SMOKE=PASS')
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf -- "${venv:-}" "${cache:-}" "$RUNNER_TEMP/collection.txt" || true
