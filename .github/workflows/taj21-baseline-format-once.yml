name: temporary / format TAJ21 baseline reference

on:
  push:
    branches:
      - feat/taj21-baseline-reference-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/taj21-baseline-reference-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'ruff==0.16.3'
      - name: Format PR-owned Python files
        run: |
          set -Eeuo pipefail
          python -m ruff format \
            tools/evaluation/taj21_baseline_campaign.py \
            tools/evaluation/taj21_baseline_verify.py \
            tests/test_taj21_baseline_reference.py
          git rm .github/workflows/taj21-baseline-format-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/evaluation/taj21_baseline_campaign.py \
            tools/evaluation/taj21_baseline_verify.py \
            tests/test_taj21_baseline_reference.py
          git commit -m 'style: apply Ruff to TAJ-21 baseline reference'
          git push origin HEAD:feat/taj21-baseline-reference-v1
