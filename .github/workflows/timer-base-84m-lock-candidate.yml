name: timer-base-84m-lock-candidate

on:
  push:
    branches:
      - feat/timer-base-84m-runtime-certification-v1
    paths:
      - .github/workflows/timer-base-84m-lock-candidate.yml

permissions:
  contents: write

jobs:
  lock:
    name: Timer Base 84M Python 3.10 lock candidate
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 45

    defaults:
      run:
        shell: bash

    env:
      EXPECTED_MAIN_SHA: "704845f26dc527d0c341c1bf0cf8b1b9a6355dd5"
      UV_VERSION: "0.11.21"
      PYTHON_VERSION: "3.10"
      ENV_DIR: "environments/timer-base-84m-supported-py310"
      REVIEW_PATH: "audit/tsfm-runtime/timer-base-84m/dependency-lock-review.json"

    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout writable branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: feat/timer-base-84m-runtime-certification-v1
          persist-credentials: true
          fetch-depth: 0
          clean: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Verify main and generate lock only
        run: |
          set -Eeuo pipefail
          case "$(uv --version)" in
            "uv $UV_VERSION"*) ;;
            *) echo "unexpected uv version" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          uv python install "$PYTHON_VERSION"
          rm -f -- "$ENV_DIR/uv.lock"
          uv lock --project "$ENV_DIR" --python "$PYTHON_VERSION"
          test -f "$ENV_DIR/uv.lock"
          echo "lock_generated=true"
          echo "package_install_executed=false"
          echo "remote_code_import_executed=false"
          echo "model_load_executed=false"

      - name: Inspect complete lock graph without importing packages
        run: |
          set -Eeuo pipefail
          python_bin="$(uv python find "$PYTHON_VERSION")"
          "$python_bin" - "$ENV_DIR/pyproject.toml" "$ENV_DIR/uv.lock" "$REVIEW_PATH" <<'PY'
          import hashlib
          import json
          import sys
          import tomllib
          from pathlib import Path

          pyproject_path = Path(sys.argv[1])
          lock_path = Path(sys.argv[2])
          review_path = Path(sys.argv[3])

          pyproject_bytes = pyproject_path.read_bytes()
          lock_bytes = lock_path.read_bytes()
          project = tomllib.loads(pyproject_bytes.decode("utf-8"))
          lock = tomllib.loads(lock_bytes.decode("utf-8"))

          assert project["project"]["requires-python"] == ">=3.10,<3.11"
          assert "torch==2.9.1" in project["project"]["dependencies"]
          assert "transformers==4.40.1" in project["project"]["dependencies"]
          assert project["tool"]["uv"]["sources"]["torch"]["index"] == "pytorch-cu128"
          indexes = project["tool"]["uv"]["index"]
          pytorch_indexes = [item for item in indexes if item.get("name") == "pytorch-cu128"]
          assert len(pytorch_indexes) == 1, pytorch_indexes
          assert pytorch_indexes[0]["url"] == "https://download.pytorch.org/whl/cu128"
          assert pytorch_indexes[0]["explicit"] is True

          packages = lock.get("package", [])
          by_name = {}
          for package in packages:
              by_name.setdefault(package["name"], []).append(package)

          torch_packages = by_name.get("torch", [])
          assert len(torch_packages) == 1, torch_packages
          torch_package = torch_packages[0]
          assert str(torch_package["version"]).startswith("2.9.1"), torch_package["version"]
          torch_source = torch_package.get("source", {})
          assert torch_source.get("registry") == "https://download.pytorch.org/whl/cu128", torch_source

          transformers_packages = by_name.get("transformers", [])
          assert len(transformers_packages) == 1, transformers_packages
          assert transformers_packages[0]["version"] == "4.40.1"

          root_packages = by_name.get("loto-timer-base-84m-provider", [])
          assert len(root_packages) == 1, root_packages
          root_package = root_packages[0]

          disallowed_sources = []
          registries = set()
          package_rows = []
          for package in packages:
              source = package.get("source", {})
              registry = source.get("registry")
              if registry:
                  registries.add(registry)
              elif package["name"] != "loto-timer-base-84m-provider":
                  disallowed_sources.append({"name": package["name"], "source": source})
              package_rows.append(
                  {
                      "name": package["name"],
                      "version": package.get("version"),
                      "source": source,
                  }
              )
          assert not disallowed_sources, disallowed_sources

          metadata = root_package.get("metadata", {})
          requires_dist = metadata.get("requires-dist", [])
          direct_names = sorted(item["name"] for item in requires_dist)
          for required in (
              "huggingface-hub",
              "numpy",
              "pydantic",
              "safetensors",
              "torch",
              "transformers",
          ):
              assert required in direct_names, (required, direct_names)

          review = {
              "schema_version": "timer-base-84m.dependency-lock-review.v1",
              "status": "CANDIDATE_GENERATED_HUMAN_REVIEW_PENDING",
              "approved": False,
              "reviewer": None,
              "reviewed_at_utc": None,
              "python_lane": ">=3.10,<3.11",
              "python_resolution": "3.10",
              "torch_candidate": "2.9.1",
              "torch_index": "https://download.pytorch.org/whl/cu128",
              "transformers": "4.40.1",
              "pyproject_sha256": hashlib.sha256(pyproject_bytes).hexdigest(),
              "uv_lock_sha256": hashlib.sha256(lock_bytes).hexdigest(),
              "package_count": len(packages),
              "direct_dependencies": direct_names,
              "registry_sources": sorted(registries),
              "disallowed_dependency_sources": disallowed_sources,
              "packages": sorted(package_rows, key=lambda item: (item["name"], str(item["version"]))),
              "compatibility_basis": [
                  "Pinned Timer config declares transformers_version=4.40.1 and torch_dtype=float32.",
                  "Pinned Timer remote code statically imports standard torch/transformers APIs; no remote code was imported during this lock phase.",
                  "PyTorch official previous-version instructions publish torch 2.9.1 CUDA 12.8 wheels for Linux/Windows.",
                  "The official cu128 index contains a torch 2.9.1 CPython 3.10 Linux x86_64 wheel.",
                  "The target az-loto-gpu has already executed torch 2.9.1+cu128 with CUDA visible in an independent AutoGluon certification lane.",
              ],
              "license_review": "PENDING_HUMAN_REVIEW",
              "material_warning_review": "PENDING_HUMAN_REVIEW",
              "execution_boundary": {
                  "dependency_install_executed": False,
                  "package_import_executed": False,
                  "trust_remote_code_executed": False,
                  "remote_code_import_executed": False,
                  "checkpoint_load_executed": False,
                  "inference_executed": False,
              },
              "approval_requirements": [
                  "Review the complete locked package graph and artifact sources.",
                  "Review licenses and material warnings.",
                  "Bind a named reviewer and UTC review time to the exact pyproject and uv.lock SHA-256 values.",
                  "Do not install/import/load until the candidate lock is explicitly approved and Phase B2 remote-code approval is also complete.",
              ],
          }
          review_path.parent.mkdir(parents=True, exist_ok=True)
          review_path.write_text(
              json.dumps(review, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"package_count={len(packages)}")
          print(f"torch_version={torch_package['version']}")
          print(f"torch_registry={torch_source['registry']}")
          print("transformers_version=4.40.1")
          print(f"pyproject_sha256={review['pyproject_sha256']}")
          print(f"uv_lock_sha256={review['uv_lock_sha256']}")
          print(f"registries={sorted(registries)}")
          print("disallowed_dependency_sources=0")
          print("dependency_install_executed=false")
          PY

      - name: Verify lock is stable and candidate-only
        run: |
          set -Eeuo pipefail
          before="$(sha256sum "$ENV_DIR/uv.lock" | cut -d' ' -f1)"
          uv lock --project "$ENV_DIR" --python "$PYTHON_VERSION" --check
          after="$(sha256sum "$ENV_DIR/uv.lock" | cut -d' ' -f1)"
          test "$before" = "$after"
          python3 -m json.tool "$REVIEW_PATH" >/dev/null
          git diff --check

      - name: Commit lock candidate and review record
        run: |
          set -Eeuo pipefail
          git add \
            "$ENV_DIR/pyproject.toml" \
            "$ENV_DIR/uv.lock" \
            "$REVIEW_PATH" \
            audit/tsfm-runtime/timer-base-84m/remote-code-review.json \
            audit/tsfm-runtime/timer-base-84m/snapshot-provenance.json
          test ! -z "$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(timer): add Python 3.10 dependency lock candidate"
          git push origin HEAD:feat/timer-base-84m-runtime-certification-v1
