name: autogluon-shared-integration-verifier

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/autogluon-shared-integration-verifier.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autogluon-shared-verifier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: AutoGluon shared protocol-v2 integration verifier
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 150

    defaults:
      run:
        shell: bash

    env:
      EXPECTED_MAIN_SHA: "1a0b7b60a11923bc442a129071280219dcf80111"
      UV_VERSION: "0.11.21"
      ROOT_PYTHON: "3.13"
      PROVIDER_PYTHON: "3.12"

    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Verify main race and exact allowed scope
        run: |
          set -Eeuo pipefail
          actual_uv="$(uv --version)"
          case "$actual_uv" in
            "uv $UV_VERSION"*) ;;
            *) echo "unexpected uv version: $actual_uv" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          echo "expected_main=$EXPECTED_MAIN_SHA"
          echo "actual_main=$actual_main"
          test "$actual_main" = "$EXPECTED_MAIN_SHA"

          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN_SHA" HEAD | sort)
          printf 'changed=%s\n' "${changed[@]:-}"
          allowed=(
            ".github/autogluon_shared_builder.py"
            ".github/workflows/autogluon-shared-integration-builder.yml"
            ".github/workflows/autogluon-shared-integration-format.yml"
            ".github/workflows/autogluon-shared-integration-push-builder.yml"
            ".github/workflows/autogluon-shared-integration-verifier.yml"
            "src/loto/models/autogluon_shared.py"
            "src/loto/models/catalog_full.py"
            "src/loto/models/workers.py"
            "tests/test_autogluon_shared_integration.py"
          )
          for path in "${changed[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -Fx -- "$path" >/dev/null || {
              echo "unexpected changed path: $path" >&2
              exit 1
            }
          done
          for required in \
            src/loto/models/autogluon_shared.py \
            src/loto/models/catalog_full.py \
            src/loto/models/workers.py \
            tests/test_autogluon_shared_integration.py; do
            printf '%s\n' "${changed[@]}" | grep -Fx -- "$required" >/dev/null
          done

      - name: Prepare isolated root verification environment
        run: |
          set -Eeuo pipefail
          uv python install "$ROOT_PYTHON"
          root_venv="$RUNNER_TEMP/autogluon-shared-root-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          provider_venv="$RUNNER_TEMP/autogluon-shared-provider-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence_dir="$RUNNER_TEMP/autogluon-shared-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for path in "$root_venv" "$provider_venv" "$evidence_dir"; do
            case "$path" in
              "$RUNNER_TEMP"/*) ;;
              *) echo "unsafe temp path: $path" >&2; exit 1 ;;
            esac
          done
          rm -rf -- "$root_venv" "$provider_venv" "$evidence_dir"
          mkdir -p -- "$evidence_dir"
          uv venv "$root_venv" --python "$ROOT_PYTHON"
          uv pip install --quiet --python "$root_venv/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          uv pip install --quiet --python "$root_venv/bin/python" -e ".[api,dev,postgres]"
          ruff_version="$(
            "$root_venv/bin/python" - <<'PY'
          import tomllib
          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)
          versions = [p["version"] for p in lock["package"] if p.get("name") == "ruff"]
          assert len(versions) == 1, versions
          print(versions[0])
          PY
          )"
          uv pip install --quiet --python "$root_venv/bin/python" "ruff==$ruff_version"
          echo "ROOT_VENV=$root_venv" >> "$GITHUB_ENV"
          echo "PROVIDER_VENV=$provider_venv" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"
          echo "LOCKED_RUFF=$ruff_version" >> "$GITHUB_ENV"
          "$root_venv/bin/python" --version
          "$root_venv/bin/python" -m ruff --version
          uv pip check --python "$root_venv/bin/python"

      - name: Static gates
        run: |
          set -Eeuo pipefail
          "$ROOT_VENV/bin/python" -m ruff format --check src scripts tests
          "$ROOT_VENV/bin/python" -m ruff check src scripts tests
          "$ROOT_VENV/bin/python" -m compileall -q src scripts tests

      - name: Focused mypy gate
        run: |
          set -Eeuo pipefail
          "$ROOT_VENV/bin/python" -m mypy \
            src/loto/models/autogluon_shared.py \
            src/loto/models/workers.py \
            src/loto/models/catalog_full.py \
            | tee "$EVIDENCE_DIR/mypy.log"

      - name: Focused tests
        run: |
          set -Eeuo pipefail
          "$ROOT_VENV/bin/python" -m pytest -q \
            tests/test_autogluon_shared_integration.py \
            tests/adapters/autogluon \
            tests/test_catalog_full.py \
            | tee "$EVIDENCE_DIR/focused-pytest.log"

      - name: Prepare locked AutoGluon provider environment
        run: |
          set -Eeuo pipefail
          uv python install "$PROVIDER_PYTHON"
          UV_PROJECT_ENVIRONMENT="$PROVIDER_VENV" \
            uv run --project environments/autogluon-timeseries --locked python - <<'PY' \
            | tee "$EVIDENCE_DIR/provider-environment.log"
          import importlib.metadata as metadata
          import torch
          version = metadata.version("autogluon.timeseries")
          print(f"autogluon_timeseries_version={version}")
          print(f"torch_version={torch.__version__}")
          print(f"cuda_available={torch.cuda.is_available()}")
          assert version == "1.5.0", version
          PY

      - name: Real production worker protocol-v2 fit and reload smoke
        run: |
          set -Eeuo pipefail
          export UV_PROJECT_ENVIRONMENT="$PROVIDER_VENV"
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          "$ROOT_VENV/bin/python" - "$EVIDENCE_DIR/real-worker-v2.json" <<'PY'
          import json
          import math
          import sys
          from pathlib import Path

          import pandas as pd

          from loto.models.catalog import ModelSpec
          from loto.models.workers import PositionSeriesWorker

          rows = []
          for index in range(24):
              rows.append(
                  {
                      "draw_no": index + 1,
                      "draw_date": f"2026-01-{index + 1:02d}",
                      "n1": (index + 1) % 10,
                      "n2": (index + 3) % 10,
                      "n3": (index + 5) % 10,
                  }
              )
          history = pd.DataFrame(rows)
          spec = ModelSpec(
              "autogluon-timeseries",
              "automl",
              "autogluon",
              "position_series",
              "TimeSeriesPredictor",
              package="autogluon",
          )
          params = {
              "game_id": "numbers3",
              "model_ids": ["Naive"],
              "time_limit_seconds": 120,
              "provider_timeout": 900,
          }
          fit_worker = PositionSeriesWorker(
              spec,
              params=params,
              seed=999,
              device="cpu",
              position_columns=["n1", "n2", "n3"],
          )
          fit = fit_worker.forecast(history)
          assert fit.position_values.shape == (3,), fit.position_values.shape
          assert all(math.isfinite(float(v)) for v in fit.position_values)
          assert fit.metadata["protocol_version"] == 2
          assert fit.metadata["provider_version"] == 2
          assert fit.metadata["selected_model_ids"] == ["Naive"]
          assert fit.metadata["model_identity_verified"] is True
          assert fit.metadata["finite"] is True
          runtime = fit.metadata["runtime_evidence"]
          assert int(runtime["pid"]) > 0
          assert runtime["resolved_device"] == "cpu"
          assert runtime["gpu_used"] is False
          assert runtime["cpu_fallback"] is False
          assert fit.metadata["gpu_certified"] is False
          for key in (
              "request_sha256",
              "saved_context_sha256",
              "source_order_sha256",
              "timeline_mapping_sha256",
              "geometry_sha256",
              "plan_sha256",
          ):
              assert len(fit.metadata[key]) == 64, (key, fit.metadata[key])
          payload = fit.model_artifact_payload
          assert isinstance(payload, dict)
          artifact_dir = Path(payload["artifact_dir"])
          assert artifact_dir.is_dir()

          load_worker = PositionSeriesWorker(
              spec,
              params={
                  **params,
                  "operation": "load_predict",
                  "artifact_dir": str(artifact_dir),
              },
              seed=12345,
              device="cpu",
              position_columns=["n1", "n2", "n3"],
          )
          loaded = load_worker.forecast(history)
          assert loaded.position_values.shape == (3,)
          assert all(math.isfinite(float(v)) for v in loaded.position_values)
          assert loaded.metadata["protocol_version"] == 2
          assert loaded.metadata["selected_model_ids"] == ["Naive"]
          assert int(loaded.metadata["runtime_evidence"]["pid"]) > 0
          assert loaded.metadata["saved_context_sha256"] == fit.metadata["saved_context_sha256"]
          assert loaded.metadata["geometry_sha256"] == fit.metadata["geometry_sha256"]
          assert loaded.metadata["plan_sha256"] == fit.metadata["plan_sha256"]

          evidence = {
              "fit": {
                  "position_values": fit.position_values.tolist(),
                  "metadata": fit.metadata,
                  "artifact_dir": str(artifact_dir),
              },
              "load": {
                  "position_values": loaded.position_values.tolist(),
                  "metadata": loaded.metadata,
              },
          }
          Path(sys.argv[1]).write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("REAL_AUTOGLUON_SHARED_V2=PASS")
          print(f"FIT_PID={runtime['pid']}")
          print(f"LOAD_PID={loaded.metadata['runtime_evidence']['pid']}")
          print(f"SAVED_CONTEXT_SHA256={fit.metadata['saved_context_sha256']}")
          PY

      - name: Verify zero collection errors
        run: |
          set -Eeuo pipefail
          "$ROOT_VENV/bin/python" -m pytest --collect-only -q \
            > "$EVIDENCE_DIR/collection.log" 2>&1
          tail -40 "$EVIDENCE_DIR/collection.log"

      - name: Full pytest
        run: |
          set -Eeuo pipefail
          "$ROOT_VENV/bin/python" -m pytest -q \
            2>&1 | tee "$EVIDENCE_DIR/full-pytest.log"

      - name: Verify repository cleanliness and main race
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

      - name: Write evidence manifest
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          {
            echo "main_sha=$EXPECTED_MAIN_SHA"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "uv=$UV_VERSION"
            echo "root_python=$ROOT_PYTHON"
            echo "provider_python=$PROVIDER_PYTHON"
            echo "ruff=$LOCKED_RUFF"
            echo "p5_run=31298381137"
            echo "p5_report_sha256=a5a009226aff87a831fe6133beb5201f75dcbd5efddb47d06d10fc817ec34cbc"
          } > "$EVIDENCE_DIR/manifest.txt"
          (
            cd "$EVIDENCE_DIR"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Upload verifier evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autogluon-shared-verifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove verifier-owned environments
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          for path in "${ROOT_VENV:-}" "${PROVIDER_VENV:-}" "${EVIDENCE_DIR:-}"; do
            [[ -z "$path" ]] && continue
            case "$path" in
              "$RUNNER_TEMP"/*) rm -rf -- "$path" ;;
              *) echo "refusing unsafe cleanup path: $path" >&2; exit 1 ;;
            esac
          done
