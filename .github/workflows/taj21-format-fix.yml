name: TAJ-21 format final diff

on:
  push:
    branches:
      - feat/taj21-unified-probabilistic-oof-v1
    paths:
      - .github/workflows/taj21-format-fix.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/taj21-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/taj21-unified-probabilistic-oof-v1' || github.ref_name == 'feat/taj21-unified-probabilistic-oof-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/taj21-unified-probabilistic-oof-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Format only PR-owned Python files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet ruff==0.16.3
          python3 -m ruff format src/loto/evaluation/unified_campaign.py tests/evaluation/test_taj21_unified_probabilistic_campaign.py
          python3 -m ruff format --check src/loto/evaluation/unified_campaign.py tests/evaluation/test_taj21_unified_probabilistic_campaign.py
      - name: Commit formatted final diff and remove workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/taj21-format-fix.yml
          git add src/loto/evaluation/unified_campaign.py tests/evaluation/test_taj21_unified_probabilistic_campaign.py
          git diff --cached --check
          git commit -m "style: format TAJ-21 unified scientific wiring"
          git push origin HEAD:feat/taj21-unified-probabilistic-oof-v1
