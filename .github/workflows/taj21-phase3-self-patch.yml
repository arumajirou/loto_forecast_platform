name: TAJ-21 phase 3 apply unified campaign patch

on:
  push:
    branches:
      - feat/taj21-unified-probabilistic-oof-v1
    paths:
      - .github/workflows/taj21-phase3-self-patch.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'feat: wire probabilistic OOF into unified campaign'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/taj21-unified-probabilistic-oof-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic TAJ-21 phase 3 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/evaluation/taj21_phase3_apply.py
          python3 -m py_compile src/loto/evaluation/unified_campaign.py tests/evaluation/test_taj21_unified_probabilistic_campaign.py

      - name: Commit only final implementation and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/taj21-phase3-self-patch.yml tools/evaluation/taj21_phase3_apply.py
          git add src/loto/evaluation/unified_campaign.py tests/evaluation/test_taj21_unified_probabilistic_campaign.py
          git diff --cached --check
          git commit -m "feat: wire probabilistic OOF into unified campaign"
          git push origin HEAD:feat/taj21-unified-probabilistic-oof-v1
