name: timer-base-84m-lock-diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/timer-base-84m-lock-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      ENV_DIR: "environments/timer-base-84m-supported-py310"
    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Resolve lock without install
        run: |
          set -Eeuo pipefail
          uv python install 3.10
          rm -f "$ENV_DIR/uv.lock"
          uv lock --project "$ENV_DIR" --python 3.10 -v 2>&1 | tee "$RUNNER_TEMP/timer-lock-resolution.log"
          test -f "$ENV_DIR/uv.lock"
          echo "dependency_install_executed=false"
          echo "package_import_executed=false"
      - name: Inspect resolved versions and sources
        run: |
          set -Eeuo pipefail
          python_bin="$(uv python find 3.10)"
          "$python_bin" - "$ENV_DIR/uv.lock" <<'PY'
          import hashlib
          import sys
          import tomllib
          from pathlib import Path

          path = Path(sys.argv[1])
          lock = tomllib.loads(path.read_text(encoding="utf-8"))
          packages = lock.get("package", [])
          print(f"package_count={len(packages)}")
          for wanted in ("loto-timer-base-84m-provider", "torch", "transformers"):
              rows = [row for row in packages if row.get("name") == wanted]
              print(f"{wanted}={rows}")
          non_registry = [
              {"name": row.get("name"), "source": row.get("source")}
              for row in packages
              if "registry" not in (row.get("source") or {})
          ]
          print(f"non_registry_sources={non_registry}")
          print(f"uv_lock_sha256={hashlib.sha256(path.read_bytes()).hexdigest()}")
          PY
      - name: Upload diagnostic lock
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: timer-base-lock-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            environments/timer-base-84m-supported-py310/uv.lock
            ${{ runner.temp }}/timer-lock-resolution.log
          if-no-files-found: warn
          retention-days: 7
      - name: Verify no remote execution occurred
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          echo "trust_remote_code_executed=false"
          echo "remote_code_import_executed=false"
          echo "model_load_executed=false"
          echo "inference_executed=false"
