name: up042-enum-inventory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ruff-up042-inventory-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout inventory branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/ruff-up042-inventory-v1
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Inventory UP042 contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-up042-inventory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-up042-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          test "$("$python" -m ruff --version)" = 'ruff 0.16.0'

          set +e
          "$python" -m ruff check --select UP042 --output-format=json src scripts tests > "$RUNNER_TEMP/up042.json"
          ruff_rc=$?
          set -e
          test "$ruff_rc" -eq 1

          "$python" - "$RUNNER_TEMP/up042.json" <<'PY'
          from __future__ import annotations

          import ast
          import collections
          import json
          import re
          import sys
          from pathlib import Path

          root = Path.cwd().resolve()
          rows = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          assert len(rows) == 66, len(rows)
          assert {row.get('code') for row in rows} == {'UP042'}

          text_files = []
          for base in ('src', 'scripts', 'tests'):
              for path in Path(base).rglob('*'):
                  if path.is_file() and path.suffix in {'.py', '.toml', '.yaml', '.yml', '.json', '.md'}:
                      try:
                          text_files.append((path, path.read_text(encoding='utf-8')))
                      except UnicodeDecodeError:
                          pass

          def enclosing_class(path: Path, row: int):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              candidates = [
                  node for node in ast.walk(tree)
                  if isinstance(node, ast.ClassDef)
                  and node.lineno <= row <= getattr(node, 'end_lineno', node.lineno)
              ]
              candidates.sort(key=lambda n: (n.lineno, -(getattr(n, 'end_lineno', n.lineno) - n.lineno)), reverse=True)
              return candidates[0] if candidates else None

          def member_summary(node: ast.ClassDef):
              values = []
              count = 0
              for stmt in node.body:
                  target = None
                  value = None
                  if isinstance(stmt, ast.Assign) and len(stmt.targets) == 1 and isinstance(stmt.targets[0], ast.Name):
                      target, value = stmt.targets[0].id, stmt.value
                  elif isinstance(stmt, ast.AnnAssign) and isinstance(stmt.target, ast.Name):
                      target, value = stmt.target.id, stmt.value
                  if target and not target.startswith('_') and value is not None:
                      count += 1
                      try:
                          values.append(type(ast.literal_eval(value)).__name__)
                      except Exception:
                          values.append('dynamic')
              return count, ','.join(sorted(collections.Counter(values).elements()))

          out = []
          files = collections.Counter()
          risk_counts = collections.Counter()
          for diag in rows:
              path = Path(diag['filename']).resolve().relative_to(root)
              row = int(diag['location']['row'])
              node = enclosing_class(path, row)
              assert node is not None, (path, row)
              name = node.name
              bases = [ast.unparse(base) for base in node.bases]
              decorators = [ast.unparse(d) for d in node.decorator_list]
              members, value_types = member_summary(node)
              source = path.read_text(encoding='utf-8')
              has_dunder_str = any(isinstance(n, ast.FunctionDef) and n.name == '__str__' for n in node.body)
              has_dunder_format = any(isinstance(n, ast.FunctionDef) and n.name == '__format__' for n in node.body)

              ref_hits = []
              import_hits = []
              all_hits = []
              value_hits = []
              str_compare_hits = []
              serialization_hits = []
              cli_hits = []
              token = re.compile(rf'\b{re.escape(name)}\b')
              import_pat = re.compile(rf'(^|\n)\s*(from\s+[^\n]+\s+import\s+[^\n]*\b{re.escape(name)}\b|import\s+[^\n]*\b{re.escape(name)}\b)')
              for other, text in text_files:
                  if not token.search(text):
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if not token.search(line):
                          continue
                      if other == path and lineno == node.lineno:
                          continue
                      ref_hits.append(f'{other}:{lineno}')
                      if import_pat.search('\n' + line):
                          import_hits.append(f'{other}:{lineno}')
                      if '__all__' in line:
                          all_hits.append(f'{other}:{lineno}')
                      if '.value' in line:
                          value_hits.append(f'{other}:{lineno}')
                      if re.search(r'==|!=|\bin\b', line) and re.search(r"['\"]", line):
                          str_compare_hits.append(f'{other}:{lineno}')
                      lower = line.lower()
                      if any(key in lower for key in ('json', 'yaml', 'model_dump', 'model_validate', 'pydantic', 'fastapi', 'serialize', 'schema')):
                          serialization_hits.append(f'{other}:{lineno}')
                      if any(key in lower for key in ('argparse', 'click.', 'typer.', 'choices=', 'env', 'os.environ')):
                          cli_hits.append(f'{other}:{lineno}')

              external_refs = [hit for hit in ref_hits if not hit.startswith(f'{path}:')]
              public = bool(import_hits or all_hits or external_refs)
              serialization = bool(value_hits or serialization_hits)
              comparison = bool(str_compare_hits)
              cli = bool(cli_hits)
              if public or serialization or comparison or cli or has_dunder_str or has_dunder_format:
                  risk = 'REVIEW_REQUIRED'
              else:
                  risk = 'LOCAL_CANDIDATE'
              risk_counts[risk] += 1
              files[path.as_posix()] += 1
              out.append({
                  'path': path.as_posix(),
                  'line': node.lineno,
                  'class': name,
                  'bases': bases,
                  'decorators': decorators,
                  'members': members,
                  'value_types': value_types,
                  'refs': len(ref_hits),
                  'external_refs': len(external_refs),
                  'import_refs': len(import_hits),
                  'all_refs': len(all_hits),
                  'value_refs': len(value_hits),
                  'string_compare_refs': len(str_compare_hits),
                  'serialization_refs': len(serialization_hits),
                  'cli_env_refs': len(cli_hits),
                  'dunder_str': has_dunder_str,
                  'dunder_format': has_dunder_format,
                  'risk': risk,
                  'sample_external_refs': external_refs[:6],
              })

          print('UP042_COUNT=66')
          print(f'UP042_FILES={len(files)}')
          print('RISK_COUNTS=' + ','.join(f'{k}:{v}' for k, v in sorted(risk_counts.items())))
          print('FILE_COUNTS_BEGIN')
          for path, count in sorted(files.items()):
              print(f'{count}\t{path}')
          print('FILE_COUNTS_END')
          print('ENUM_INVENTORY_BEGIN')
          for item in sorted(out, key=lambda x: (x['path'], x['line'])):
              print(json.dumps(item, sort_keys=True, ensure_ascii=False))
          print('ENUM_INVENTORY_END')
          PY

          rm -rf -- "$venv" "$cache" "$RUNNER_TEMP/up042.json"
