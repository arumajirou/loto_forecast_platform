name: autogluon-shared-integration-format

on:
  push:
    branches:
      - feat/autogluon-shared-integration-v1
    paths:
      - .github/workflows/autogluon-shared-integration-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/autogluon-shared-integration-v1
          persist-credentials: true
          fetch-depth: 0
          clean: true
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.21"
          enable-cache: false
      - name: Format and push exact test
        run: |
          set -Eeuo pipefail
          before="$(sha256sum tests/test_autogluon_shared_integration.py | cut -d' ' -f1)"
          uvx --from ruff==0.16.0 ruff format tests/test_autogluon_shared_integration.py
          uvx --from ruff==0.16.0 ruff format --check tests/test_autogluon_shared_integration.py
          after="$(sha256sum tests/test_autogluon_shared_integration.py | cut -d' ' -f1)"
          echo "before=$before"
          echo "after=$after"
          test "$before" != "$after"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "tests/test_autogluon_shared_integration.py"
          git add tests/test_autogluon_shared_integration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(autogluon): format shared integration tests"
          git push origin HEAD:feat/autogluon-shared-integration-v1
