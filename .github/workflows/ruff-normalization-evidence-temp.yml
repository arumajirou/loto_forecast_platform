name: ruff-normalization-evidence-temp

on:
  push:
    branches:
      - fix/ruff-format-normalization-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruff-normalization-evidence-temp
  cancel-in-progress: false

jobs:
  verify-and-capture:
    if: ${{ github.repository == 'arumajirou/loto_forecast_platform' && github.ref == 'refs/heads/fix/ruff-format-normalization-v1' && !contains(github.event.head_commit.message, 'capture independent Ruff gate evidence') }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    env:
      TARGET_BRANCH: fix/ruff-format-normalization-v1
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_RUFF_VERSION: "0.16.0"
      SUMMARY_PATH: .github/ruff-independent-gates.txt
      LINT_PATH: .github/ruff-lint-result.txt
      PYTEST_PATH: .github/ruff-pytest-result.txt

    steps:
      - name: Verify runner and checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-format-normalization-v1
          persist-credentials: true
          fetch-depth: 1
          clean: true

      - name: Verify exact runner and head
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/$TARGET_BRANCH)"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install exact uv and prepare isolated Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare tools
        run: |
          set -Eeuo pipefail
          actual="$(uv --version)"
          case "$actual" in "uv $UV_VERSION"*) ;; *) echo "unexpected uv: $actual" >&2; exit 1 ;; esac
          uv python install "$UV_PYTHON"
          ci_venv="$RUNNER_TEMP/loto-ruff-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv_cache="$RUNNER_TEMP/loto-ruff-evidence-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$ci_venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$uv_cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$ci_venv" "$uv_cache"
          mkdir -p -- "$uv_cache"
          echo "CI_VENV=$ci_venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv venv "$ci_venv" --python "$UV_PYTHON"
          python="$ci_venv/bin/python"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          echo "RUFF_VERSION=$ruff_version" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv pip install --quiet --python "$python" "ruff==$ruff_version"

      - name: Run independent source gates and capture logs
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"

          set +e
          "$python" -m ruff format --check src scripts tests > "$RUNNER_TEMP/format.log" 2>&1
          FORMAT_RC=$?
          "$python" -m ruff check src scripts tests > "$RUNNER_TEMP/lint.log" 2>&1
          LINT_RC=$?
          "$python" -m compileall -q src scripts tests > "$RUNNER_TEMP/compile.log" 2>&1
          COMPILE_RC=$?
          set -e

          printf 'FORMAT_RC=%s\nLINT_RC=%s\nCOMPILE_RC=%s\n' "$FORMAT_RC" "$LINT_RC" "$COMPILE_RC" >> "$GITHUB_ENV"

          LINT_RC="$LINT_RC" "$python" - "$RUNNER_TEMP/lint.log" "$LINT_PATH" <<'PY'
          from __future__ import annotations
          import collections, os, re, sys
          from pathlib import Path
          src=Path(sys.argv[1]); dst=Path(sys.argv[2])
          text=src.read_text(encoding='utf-8', errors='backslashreplace')
          lines=text.splitlines()
          codes=collections.Counter()
          files=collections.Counter()
          pattern=re.compile(r'^(.+?):(\d+):(\d+):\s+([A-Z]+\d+)\s')
          for line in lines:
              m=pattern.match(line)
              if m:
                  files[m.group(1)] += 1
                  codes[m.group(4)] += 1
          out=[
              'RUFF_LINT_EVIDENCE_VERSION=1',
              f"RUN_ID={os.environ.get('GITHUB_RUN_ID','UNKNOWN')}",
              f"SOURCE_HEAD={os.environ.get('SOURCE_HEAD','UNKNOWN')}",
              f"RUFF_VERSION={os.environ.get('RUFF_VERSION','UNKNOWN')}",
              f"LINT_RC={os.environ.get('LINT_RC','UNKNOWN')}",
              f"PARSED_FINDINGS={sum(codes.values())}",
              'RULE_COUNTS=' + ','.join(f'{k}:{v}' for k,v in sorted(codes.items())),
              'TOP_FILES=' + ','.join(f'{k}:{v}' for k,v in files.most_common(30)),
              '--- FIRST_250_LINES ---',
              *lines[:250],
              '--- LAST_120_LINES ---',
              *lines[-120:],
          ]
          dst.write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY

      - name: Install project dependencies and run full pytest independently
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          set +e
          UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1" > "$RUNNER_TEMP/deps.log" 2>&1
          TORCH_RC=$?
          if [[ "$TORCH_RC" -eq 0 ]]; then
            UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" -e ".[api,dev,postgres]" >> "$RUNNER_TEMP/deps.log" 2>&1
            PROJECT_DEPS_RC=$?
          else
            PROJECT_DEPS_RC=99
          fi
          if [[ "$TORCH_RC" -eq 0 && "$PROJECT_DEPS_RC" -eq 0 ]]; then
            UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" "ruff==$RUFF_VERSION" >> "$RUNNER_TEMP/deps.log" 2>&1
            RUFF_RESTORE_RC=$?
            uv pip check --python "$python" >> "$RUNNER_TEMP/deps.log" 2>&1
            PIP_CHECK_RC=$?
          else
            RUFF_RESTORE_RC=99
            PIP_CHECK_RC=99
          fi
          if [[ "$TORCH_RC" -eq 0 && "$PROJECT_DEPS_RC" -eq 0 && "$RUFF_RESTORE_RC" -eq 0 && "$PIP_CHECK_RC" -eq 0 ]]; then
            "$python" - <<'PY' >> "$RUNNER_TEMP/deps.log" 2>&1
          import torch
          assert torch.__version__.startswith('2.9.1'), torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          PY
            CPU_TORCH_RC=$?
          else
            CPU_TORCH_RC=99
          fi
          if [[ "$CPU_TORCH_RC" -eq 0 ]]; then
            "$python" -m pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1
            PYTEST_RC=$?
          else
            printf 'pytest not executed because dependency gate failed\n' > "$RUNNER_TEMP/pytest.log"
            PYTEST_RC=99
          fi
          set -e

          DEPS_RC=0
          for rc in "$TORCH_RC" "$PROJECT_DEPS_RC" "$RUFF_RESTORE_RC" "$PIP_CHECK_RC" "$CPU_TORCH_RC"; do
            if [[ "$rc" -ne 0 ]]; then DEPS_RC=1; fi
          done
          printf 'DEPS_RC=%s\nPYTEST_RC=%s\n' "$DEPS_RC" "$PYTEST_RC" >> "$GITHUB_ENV"

          PYTEST_RC="$PYTEST_RC" "$python" - "$RUNNER_TEMP/pytest.log" "$PYTEST_PATH" <<'PY'
          from __future__ import annotations
          import os, sys
          from pathlib import Path
          src=Path(sys.argv[1]); dst=Path(sys.argv[2])
          text=src.read_text(encoding='utf-8', errors='backslashreplace')
          lines=text.splitlines()
          out=[
              'PYTEST_EVIDENCE_VERSION=1',
              f"RUN_ID={os.environ.get('GITHUB_RUN_ID','UNKNOWN')}",
              f"SOURCE_HEAD={os.environ.get('SOURCE_HEAD','UNKNOWN')}",
              f"PYTEST_RC={os.environ.get('PYTEST_RC','UNKNOWN')}",
              '--- FIRST_180_LINES ---', *lines[:180],
              '--- LAST_180_LINES ---', *lines[-180:],
          ]
          dst.write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY

      - name: Persist independent gate evidence
        run: |
          set -Eeuo pipefail
          cat > "$SUMMARY_PATH" <<EOF
          RUFF_INDEPENDENT_GATES_VERSION=1
          RUN_ID=$GITHUB_RUN_ID
          RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT
          SOURCE_HEAD=${SOURCE_HEAD:-UNKNOWN}
          RUFF_VERSION=${RUFF_VERSION:-UNKNOWN}
          FORMAT_RC=${FORMAT_RC:-UNKNOWN}
          LINT_RC=${LINT_RC:-UNKNOWN}
          COMPILE_RC=${COMPILE_RC:-UNKNOWN}
          DEPS_RC=${DEPS_RC:-UNKNOWN}
          PYTEST_RC=${PYTEST_RC:-UNKNOWN}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SUMMARY_PATH" "$LINT_PATH" "$PYTEST_PATH"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'evidence unchanged'
          else
            git commit -m "chore: capture independent Ruff gate evidence (#196)"
            remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
            test "$remote_before" = "$(git rev-parse HEAD^)"
            git push origin "HEAD:$TARGET_BRANCH"
          fi

      - name: Enforce independent gates after evidence capture
        run: |
          set -Eeuo pipefail
          test "${FORMAT_RC:-99}" -eq 0
          test "${COMPILE_RC:-99}" -eq 0
          test "${DEPS_RC:-99}" -eq 0
          test "${LINT_RC:-99}" -eq 0
          test "${PYTEST_RC:-99}" -eq 0

      - name: Cleanup temporary environment
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${CI_VENV:-}" ]]; then case "$CI_VENV" in "$RUNNER_TEMP"/*) rm -rf -- "$CI_VENV" ;; *) exit 1 ;; esac; fi
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf -- "$UV_CACHE_DIR" ;; *) exit 1 ;; esac; fi
