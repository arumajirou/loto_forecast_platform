name: ruff-format-normalization-temp

on:
  push:
    branches:
      - fix/ruff-format-normalization-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruff-format-normalization-temp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-source-encoding:
    if: ${{ github.repository == 'arumajirou/loto_forecast_platform' && ((github.event_name == 'push' && github.ref == 'refs/heads/fix/ruff-format-normalization-v1') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/ruff-format-normalization-v1') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ruff-format-normalization-v1')) }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      TARGET_PATH: "src/loto/auto_campaign/prospective_registry_reconciliation_expected.py"
      ENCODING_DIAGNOSTIC_PATH: ".github/ruff-source-encoding-diagnostic.txt"

    steps:
      - name: Verify expected self-hosted runner
        run: |
          set -Eeuo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted normalization branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-format-normalization-v1
          persist-credentials: true
          fetch-depth: 1
          clean: true

      - name: Stop when encoding diagnostic already exists
        id: existing
        run: |
          set -Eeuo pipefail
          if [[ -f "$ENCODING_DIAGNOSTIC_PATH" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "encoding diagnostic already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv without GitHub cache
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare isolated Python
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          set -Eeuo pipefail
          actual="$(uv --version)"
          echo "uv_version=$actual"
          case "$actual" in
            "uv $UV_VERSION"*) ;;
            *) echo "unexpected uv version: $actual" >&2; exit 1 ;;
          esac
          uv python install "$UV_PYTHON"
          ci_venv="$RUNNER_TEMP/loto-source-encoding-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$ci_venv" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "unsafe CI venv path: $ci_venv" >&2; exit 1 ;;
          esac
          rm -rf -- "$ci_venv"
          echo "CI_VENV=$ci_venv" >> "$GITHUB_ENV"
          uv venv "$ci_venv" --python "$UV_PYTHON"
          "$ci_venv/bin/python" --version

      - name: Capture byte-level encoding evidence
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          set -Eeuo pipefail
          "$CI_VENV/bin/python" - <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import subprocess
          from pathlib import Path

          target = Path(os.environ["TARGET_PATH"])
          output = Path(os.environ["ENCODING_DIAGNOSTIC_PATH"])
          data = target.read_bytes()

          records: list[str] = [
              "SOURCE_ENCODING_DIAGNOSTIC_VERSION=1",
              f"RUN_ID={os.environ['GITHUB_RUN_ID']}",
              f"RUN_ATTEMPT={os.environ['GITHUB_RUN_ATTEMPT']}",
              f"HEAD_SHA={subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()}",
              f"TARGET_PATH={target.as_posix()}",
              f"SIZE_BYTES={len(data)}",
              f"SHA256={hashlib.sha256(data).hexdigest()}",
              f"UTF8_BOM={data.startswith(bytes.fromhex('efbbbf'))}",
              f"UTF16_LE_BOM={data.startswith(bytes.fromhex('fffe'))}",
              f"UTF16_BE_BOM={data.startswith(bytes.fromhex('feff'))}",
              f"NUL_BYTE_COUNT={data.count(bytes([0]))}",
          ]

          errors: list[tuple[int, int, str]] = []
          cursor = 0
          while cursor < len(data):
              try:
                  data[cursor:].decode("utf-8")
                  break
              except UnicodeDecodeError as exc:
                  start = cursor + exc.start
                  end = cursor + exc.end
                  errors.append((start, end, exc.reason))
                  cursor = end if end > start else start + 1
                  if len(errors) >= 50:
                      break

          records.append(f"UTF8_DECODE_ERROR_COUNT_CAPPED={len(errors)}")
          for index, (start, end, reason) in enumerate(errors, start=1):
              line = data.count(b"\n", 0, start) + 1
              previous_newline = data.rfind(b"\n", 0, start)
              column = start + 1 if previous_newline < 0 else start - previous_newline
              lo = max(0, start - 48)
              hi = min(len(data), end + 48)
              window = data[lo:hi]
              records.extend(
                  [
                      f"ERROR_{index}_START={start}",
                      f"ERROR_{index}_END={end}",
                      f"ERROR_{index}_LINE={line}",
                      f"ERROR_{index}_BYTE_COLUMN={column}",
                      f"ERROR_{index}_REASON={reason}",
                      f"ERROR_{index}_BYTES_HEX={data[start:end].hex()}",
                      f"ERROR_{index}_WINDOW_HEX={window.hex()}",
                      f"ERROR_{index}_WINDOW_BACKSLASH={window.decode('utf-8', errors='backslashreplace')!r}",
                  ]
              )

          if not errors:
              records.append("UTF8_DECODE=PASS")
          else:
              records.append("UTF8_DECODE=FAIL")

          compile_result = subprocess.run(
              [os.environ["CI_VENV"] + "/bin/python", "-m", "py_compile", str(target)],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              errors="backslashreplace",
              check=False,
          )
          records.append(f"PY_COMPILE_STATUS={compile_result.returncode}")
          records.append("--- PY_COMPILE_STDERR_FIRST_80_LINES ---")
          records.extend(compile_result.stderr.splitlines()[:80])

          output.write_text("\n".join(records) + "\n", encoding="utf-8")
          PY

          git diff --check -- "$ENCODING_DIAGNOSTIC_PATH"
          test -z "$(git diff --name-only -- src scripts tests)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$ENCODING_DIAGNOSTIC_PATH"
          test "$(git diff --cached --name-only)" = "$ENCODING_DIAGNOSTIC_PATH"
          git diff --cached --check
          git commit -m "chore: capture invalid source encoding diagnostic (#196)"
          git push origin HEAD:fix/ruff-format-normalization-v1

      - name: Verify repository state
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Remove CI-owned temporary environment
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${CI_VENV:-}" ]]; then
            case "$CI_VENV" in
              "$RUNNER_TEMP"/*) rm -rf -- "$CI_VENV" ;;
              *) echo "refusing to remove unsafe CI_VENV=$CI_VENV" >&2; exit 1 ;;
            esac
          fi
