name: ruff-format-normalization-temp

on:
  push:
    branches:
      - fix/ruff-format-normalization-v1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruff-format-normalization-temp
  cancel-in-progress: false

jobs:
  normalize-and-verify:
    if: ${{ github.repository == 'arumajirou/loto_forecast_platform' && github.ref == 'refs/heads/fix/ruff-format-normalization-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    env:
      TARGET_BRANCH: fix/ruff-format-normalization-v1
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_RUFF_VERSION: "0.16.0"
      REPAIRED_SOURCE: src/loto/auto_campaign/prospective_registry_reconciliation_expected.py
      REPAIRED_SOURCE_BLOB: e13b5d78c22e529a2b516e8da1ab1b205245dcf8
      REPAIRED_TEST: tests/auto_campaign/test_prospective_registry_reconciliation.py
      REPAIRED_TEST_BLOB: 640c8e491ca1a75db23ae3f5a75dd764fd890070

    steps:
      - name: Verify expected self-hosted runner
        run: |
          set -Eeuo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted normalization branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-format-normalization-v1
          persist-credentials: true
          fetch-depth: 0
          clean: true

      - name: Synchronize exact current main without force
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"

          local_head="$(git rev-parse HEAD)"
          remote_head="$(git rev-parse "origin/$TARGET_BRANCH")"
          main_head="$(git rev-parse origin/main)"
          echo "local_head=$local_head"
          echo "remote_head=$remote_head"
          echo "main_head=$main_head"
          test "$local_head" = "$remote_head"

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "current main already contained"
          else
            git merge --no-edit origin/main
          fi

          test "$(git hash-object "$REPAIRED_SOURCE")" = "$REPAIRED_SOURCE_BLOB"
          test "$(git hash-object "$REPAIRED_TEST")" = "$REPAIRED_TEST_BLOB"
          git diff --exit-code
          git diff --cached --exit-code

          echo "SYNCED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_HEAD=$main_head" >> "$GITHUB_ENV"

      - name: Install exact uv without GitHub cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare isolated Python and locked Ruff
        run: |
          set -Eeuo pipefail
          actual="$(uv --version)"
          echo "uv_version=$actual"
          case "$actual" in
            "uv $UV_VERSION"*) ;;
            *) echo "unexpected uv version: $actual" >&2; exit 1 ;;
          esac

          uv python install "$UV_PYTHON"
          ci_venv="$RUNNER_TEMP/loto-ruff-normalization-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv_cache="$RUNNER_TEMP/loto-ruff-normalization-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$ci_venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$uv_cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$ci_venv" "$uv_cache"
          mkdir -p -- "$uv_cache"
          echo "CI_VENV=$ci_venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv venv "$ci_venv" --python "$UV_PYTHON"

          python="$ci_venv/bin/python"
          ruff_version="$(
            "$python" - <<'PY'
          import tomllib
          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)
          versions = [p["version"] for p in lock["package"] if p.get("name") == "ruff"]
          if len(versions) != 1:
              raise SystemExit(f"expected one Ruff version, got {versions!r}")
          print(versions[0])
          PY
          )"
          echo "ruff_version=$ruff_version"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          echo "RUFF_VERSION=$ruff_version" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv pip install --quiet --python "$python" "ruff==$ruff_version"
          "$python" -m ruff --version

      - name: Apply only the locked Ruff formatter
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"

          "$python" -m ruff format src scripts tests

          git diff --name-only | sort > "$RUNNER_TEMP/ruff-format-changed.txt"
          changed_count="$(wc -l < "$RUNNER_TEMP/ruff-format-changed.txt" | tr -d ' ')"
          echo "formatter_changed_files=$changed_count"

          unexpected="$(awk '!($0 ~ /^src\// || $0 ~ /^scripts\// || $0 ~ /^tests\//) {print}' "$RUNNER_TEMP/ruff-format-changed.txt")"
          if [[ -n "$unexpected" ]]; then
            echo "formatter escaped intended scope:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git diff --check

          if [[ "$changed_count" -gt 0 ]]; then
            git add src scripts tests
            test "$(git diff --cached --name-only | sort)" = "$(cat "$RUNNER_TEMP/ruff-format-changed.txt")"
            git diff --cached --check
            git commit -m "style: normalize repository with locked Ruff formatter (#196)"
          else
            echo "formatter produced no new changes"
          fi

          local_before_push="$(git rev-parse "origin/$TARGET_BRANCH")"
          remote_before_push="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$local_before_push" = "$remote_before_push"

          git push origin "HEAD:$TARGET_BRANCH"
          pushed_head="$(git rev-parse HEAD)"
          remote_after_push="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$pushed_head" = "$remote_after_push"
          echo "PUSHED_HEAD=$pushed_head" >> "$GITHUB_ENV"

      - name: Verify locked Ruff format gate
        run: |
          set -Eeuo pipefail
          "$CI_VENV/bin/python" -m ruff format --check src scripts tests

      - name: Verify locked Ruff lint gate
        run: |
          set -Eeuo pipefail
          "$CI_VENV/bin/python" -m ruff check src scripts tests

      - name: Compile repository Python paths
        run: |
          set -Eeuo pipefail
          "$CI_VENV/bin/python" -m compileall -q src scripts tests

      - name: Install project test dependencies with CPU-only Torch
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.9.1"
          UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" -e ".[api,dev,postgres]"
          UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" "ruff==$RUFF_VERSION"
          uv pip check --python "$python"
          "$python" - <<'PY'
          import torch
          assert torch.__version__.startswith("2.9.1"), torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          print(f"torch_version={torch.__version__}")
          print("torch_cuda_runtime=NONE")
          PY

      - name: Run full repository pytest
        run: |
          set -Eeuo pipefail
          "$CI_VENV/bin/python" -m pytest -q

      - name: Verify repository state
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          test "$(git hash-object "$REPAIRED_SOURCE")" = "$REPAIRED_SOURCE_BLOB"
          test "$(git hash-object "$REPAIRED_TEST")" = "$REPAIRED_TEST_BLOB"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Remove CI-owned temporary environment
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${CI_VENV:-}" ]]; then
            case "$CI_VENV" in "$RUNNER_TEMP"/*) rm -rf -- "$CI_VENV" ;; *) exit 1 ;; esac
          fi
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then
            case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf -- "$UV_CACHE_DIR" ;; *) exit 1 ;; esac
          fi
