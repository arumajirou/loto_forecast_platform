name: ruff-format-normalization-temp

on:
  push:
    branches:
      - fix/ruff-format-normalization-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ruff-format-normalization-temp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-formatter:
    if: ${{ github.repository == 'arumajirou/loto_forecast_platform' && ((github.event_name == 'push' && github.ref == 'refs/heads/fix/ruff-format-normalization-v1') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/ruff-format-normalization-v1') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ruff-format-normalization-v1')) }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      DIAGNOSTIC_PATH: ".github/ruff-format-diagnostic.txt"

    steps:
      - name: Verify expected self-hosted runner
        run: |
          set -Eeuo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted normalization branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-format-normalization-v1
          persist-credentials: true
          fetch-depth: 1
          clean: true

      - name: Stop when diagnostic evidence already exists
        id: existing
        run: |
          set -Eeuo pipefail
          if [[ -f "$DIAGNOSTIC_PATH" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "diagnostic evidence already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv without GitHub cache
        if: ${{ steps.existing.outputs.exists != 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare isolated Python environment
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          set -Eeuo pipefail
          actual="$(uv --version)"
          echo "uv_version=$actual"
          case "$actual" in
            "uv $UV_VERSION"*) ;;
            *) echo "unexpected uv version: $actual" >&2; exit 1 ;;
          esac
          uv python install "$UV_PYTHON"
          ci_venv="$RUNNER_TEMP/loto-ruff-diagnose-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv_cache="$RUNNER_TEMP/loto-ruff-diagnose-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$ci_venv" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "unsafe CI venv path: $ci_venv" >&2; exit 1 ;;
          esac
          case "$uv_cache" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "unsafe uv cache path: $uv_cache" >&2; exit 1 ;;
          esac
          rm -rf -- "$ci_venv" "$uv_cache"
          mkdir -p -- "$uv_cache"
          echo "CI_VENV=$ci_venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv venv "$ci_venv" --python "$UV_PYTHON"
          "$ci_venv/bin/python" --version

      - name: Install repository-locked Ruff only
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          ruff_version="$(
            "$python" - <<'PY'
          import tomllib

          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)

          versions = [
              package["version"]
              for package in lock["package"]
              if package.get("name") == "ruff"
          ]
          if len(versions) != 1:
              raise SystemExit(f"expected exactly one Ruff version in uv.lock, got {versions!r}")
          print(versions[0])
          PY
          )"
          echo "RUFF_VERSION=$ruff_version" >> "$GITHUB_ENV"
          uv pip install --quiet --python "$python" "ruff==$ruff_version"
          "$python" -m ruff --version

      - name: Capture formatter exit codes and bounded output
        if: ${{ steps.existing.outputs.exists != 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          out="$RUNNER_TEMP/ruff-format.stdout"
          err="$RUNNER_TEMP/ruff-format.stderr"
          check_out="$RUNNER_TEMP/ruff-check.stdout"
          check_err="$RUNNER_TEMP/ruff-check.stderr"

          set +e
          "$python" -m ruff format src scripts tests >"$out" 2>"$err"
          apply_status=$?
          "$python" -m ruff format --check src scripts tests >"$check_out" 2>"$check_err"
          check_status=$?
          set -e

          changed_count="$(git diff --name-only -- src scripts tests | sed '/^$/d' | wc -l)"
          unexpected_count="$(git diff --name-only | grep -Ev '^(src|scripts|tests)/' | sed '/^$/d' | wc -l || true)"

          {
            echo "FORMAT_DIAGNOSTIC_VERSION=1"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "HEAD_SHA=$(git rev-parse HEAD)"
            echo "RUFF_VERSION=$RUFF_VERSION"
            echo "APPLY_STATUS=$apply_status"
            echo "CHECK_STATUS=$check_status"
            echo "FORMATTER_CHANGED_FILES=$changed_count"
            echo "UNEXPECTED_CHANGED_FILES=$unexpected_count"
            echo "--- APPLY_STDOUT_FIRST_120_LINES ---"
            sed -n '1,120p' "$out"
            echo "--- APPLY_STDERR_FIRST_120_LINES ---"
            sed -n '1,120p' "$err"
            echo "--- CHECK_STDOUT_FIRST_120_LINES ---"
            sed -n '1,120p' "$check_out"
            echo "--- CHECK_STDERR_FIRST_120_LINES ---"
            sed -n '1,120p' "$check_err"
          } > "$DIAGNOSTIC_PATH"

          git restore --worktree -- src scripts tests
          test -z "$(git diff --name-only -- src scripts tests)"
          test "$unexpected_count" -eq 0

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DIAGNOSTIC_PATH"
          test "$(git diff --cached --name-only)" = "$DIAGNOSTIC_PATH"
          git diff --cached --check
          git commit -m "chore: capture Ruff formatter diagnostic (#196)"
          git push origin HEAD:fix/ruff-format-normalization-v1

      - name: Verify repository state
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Remove CI-owned temporary environment
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${CI_VENV:-}" ]]; then
            case "$CI_VENV" in
              "$RUNNER_TEMP"/*) rm -rf -- "$CI_VENV" ;;
              *) echo "refusing to remove unsafe CI_VENV=$CI_VENV" >&2; exit 1 ;;
            esac
          fi
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then
            case "$UV_CACHE_DIR" in
              "$RUNNER_TEMP"/*) rm -rf -- "$UV_CACHE_DIR" ;;
              *) echo "refusing to remove unsafe UV_CACHE_DIR=$UV_CACHE_DIR" >&2; exit 1 ;;
            esac
          fi
