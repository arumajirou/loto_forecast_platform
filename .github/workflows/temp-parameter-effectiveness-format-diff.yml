name: temporary parameter effectiveness format diff

on:
  pull_request:
    paths:
      - "src/loto/parameter_effectiveness/adapters.py"
      - "src/loto/parameter_effectiveness/core.py"
      - ".github/workflows/temp-parameter-effectiveness-format-diff.yml"

permissions:
  contents: write

jobs:
  format-diff:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 1

      - name: Install exact uv without cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.21"
          enable-cache: false

      - name: Apply exact Ruff formatting and push
        shell: bash
        run: |
          set -Eeuo pipefail
          uvx --from ruff==0.16.4 ruff --version
          uvx --from ruff==0.16.4 ruff format \
            src/loto/parameter_effectiveness/adapters.py \
            src/loto/parameter_effectiveness/core.py

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              src/loto/parameter_effectiveness/adapters.py|src/loto/parameter_effectiveness/core.py) ;;
              *) echo "unexpected formatted path: $path" >&2; exit 1 ;;
            esac
          done

          if (( ${#changed[@]} == 0 )); then
            echo "FORMAT_ALREADY_CLEAN=YES"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/loto/parameter_effectiveness/adapters.py \
            src/loto/parameter_effectiveness/core.py
          git commit -m "style: format parameter effectiveness sources"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
