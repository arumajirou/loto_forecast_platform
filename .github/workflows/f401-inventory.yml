name: f401-explicit-reexports

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ruff-lint-f401-export-contracts-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    env:
      TARGET_BRANCH: fix/ruff-lint-f401-export-contracts-v1
      UV_VERSION: '0.11.21'
      UV_PYTHON: '3.13'
      EXPECTED_RUFF_VERSION: '0.16.0'
      BASELINE_COLLECTION_ERRORS: '34'
      EXPECTED_F401: '40'
      EXPECTED_REMAINING_LINT: '66'
      RESULT_PATH: .github/ruff-f401-repair.txt

    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/ruff-lint-f401-export-contracts-v1
          persist-credentials: true
          fetch-depth: 1

      - name: Gate repair trigger
        id: gate
        shell: bash
        run: |
          set -Eeuo pipefail
          message="$(git log -1 --pretty=%s)"
          echo "head_message=$message"
          if [[ "$message" == "ci: retry explicit F401 reexports (#200)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Prepare isolated CPU environment
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          case "$(uv --version)" in "uv $UV_VERSION"*) ;; *) exit 1 ;; esac
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/loto-f401-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-f401-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python "$UV_PYTHON"
          echo "CI_VENV=$venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          python="$venv/bin/python"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          echo "RUFF_VERSION=$ruff_version" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e ".[api,dev,postgres]"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" "ruff==$ruff_version"
          uv pip check --python "$python"
          "$python" - <<'PY'
          import torch
          assert torch.__version__.startswith('2.9.1'), torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          PY
          echo "DEPS_RC=0" >> "$GITHUB_ENV"

      - name: Capture baseline facade contracts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          baseline="$RUNNER_TEMP/f401-facade-baseline-${GITHUB_RUN_ID}.json"
          echo "FACADE_BASELINE=$baseline" >> "$GITHUB_ENV"
          "$python" - "$baseline" <<'PY'
          import json
          import sys
          from pathlib import Path

          import loto.autogluon_campaign.holdout_prospective as ag
          import loto.autogluon_campaign.holdout_prospective_lock as ag_lock
          import loto.autogluon_campaign.holdout_prospective_score as ag_score
          import loto.moirai2_campaign.target_execution as mt
          import loto.moirai2_campaign.target_execution_common as common
          import loto.moirai2_campaign.target_execution_state as state
          import loto.moirai2_campaign.target_execution_validators as validators

          ag_names = (
              'create_prediction_lock',
              'verify_prediction_lock',
              'score_prediction_lock',
              'verify_scoring_output',
          )
          assert ag.create_prediction_lock is ag_lock.create_prediction_lock
          assert ag.verify_prediction_lock is ag_lock.verify_prediction_lock
          assert ag.score_prediction_lock is ag_score.score_prediction_lock
          assert ag.verify_scoring_output is ag_score.verify_scoring_output

          moirai_names = tuple(mt.__all__)
          assert len(moirai_names) == 37, moirai_names
          assert 'annotations' in moirai_names, moirai_names
          sources=(common,state,validators)
          for name in moirai_names:
              if name == 'annotations':
                  assert hasattr(mt, name)
                  continue
              owners=[module for module in sources if hasattr(module,name)]
              assert len(owners) == 1, (name, owners)
              assert getattr(mt,name) is getattr(owners[0],name), name

          payload={'autogluon': list(ag_names), 'moirai': list(moirai_names)}
          Path(sys.argv[1]).write_text(json.dumps(payload,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print('AUTOGLUON_FACADE_EXPORTS=4')
          print(f'MOIRAI_PUBLIC_SURFACE={len(moirai_names)}')
          PY

      - name: Apply explicit re-export aliases
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          "$python" - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          import sys
          from collections import Counter
          from pathlib import Path

          proc=subprocess.run(
              [sys.executable, '-m', 'ruff', 'check', '--select', 'F401', '--output-format=json', 'src', 'scripts', 'tests'],
              text=True,
              capture_output=True,
              check=False,
          )
          assert proc.returncode == 1, (proc.returncode, proc.stdout, proc.stderr)
          rows=json.loads(proc.stdout or '[]')
          assert len(rows) == 40, len(rows)
          expected={
              'src/loto/autogluon_campaign/holdout_prospective.py': 4,
              'src/loto/moirai2_campaign/target_execution.py': 36,
          }
          counts=Counter()
          changes: dict[Path, dict[int,str]] = {}
          for row in rows:
              path=Path(row['filename']).resolve().relative_to(Path.cwd().resolve())
              key=path.as_posix()
              assert key in expected, key
              counts[key]+=1
              line_no=int(row['location']['row'])
              lines=path.read_text(encoding='utf-8').splitlines()
              original=lines[line_no-1]
              match=re.fullmatch(r'(\s*)([A-Za-z_][A-Za-z0-9_]*),(\s*)', original)
              assert match, (key,line_no,original)
              name=match.group(2)
              message=row.get('message','')
              assert f'.{name}` imported but unused' in message, (name,message)
              changes.setdefault(path,{})[line_no]=f'{match.group(1)}{name} as {name},{match.group(3)}'
          assert dict(counts) == expected, counts
          for path,replacements in changes.items():
              lines=path.read_text(encoding='utf-8').splitlines()
              for line_no,replacement in replacements.items():
                  lines[line_no-1]=replacement
              path.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('EXPLICIT_REEXPORTS=40')
          PY
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "src/loto/autogluon_campaign/holdout_prospective.py"
          test "${changed[1]}" = "src/loto/moirai2_campaign/target_execution.py"
          git diff --check

      - name: Verify facade parity and static gates
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          "$python" - "$FACADE_BASELINE" <<'PY'
          import json
          import sys
          from pathlib import Path

          import loto.autogluon_campaign.holdout_prospective as ag
          import loto.autogluon_campaign.holdout_prospective_lock as ag_lock
          import loto.autogluon_campaign.holdout_prospective_score as ag_score
          import loto.moirai2_campaign.target_execution as mt
          import loto.moirai2_campaign.target_execution_common as common
          import loto.moirai2_campaign.target_execution_state as state
          import loto.moirai2_campaign.target_execution_validators as validators

          baseline=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert baseline['autogluon'] == [
              'create_prediction_lock','verify_prediction_lock','score_prediction_lock','verify_scoring_output'
          ]
          assert ag.create_prediction_lock is ag_lock.create_prediction_lock
          assert ag.verify_prediction_lock is ag_lock.verify_prediction_lock
          assert ag.score_prediction_lock is ag_score.score_prediction_lock
          assert ag.verify_scoring_output is ag_score.verify_scoring_output
          assert list(mt.__all__) == baseline['moirai']
          for name in mt.__all__:
              if name == 'annotations':
                  assert hasattr(mt, name)
                  continue
              owners=[module for module in (common,state,validators) if hasattr(module,name)]
              assert len(owners) == 1, (name,owners)
              assert getattr(mt,name) is getattr(owners[0],name), name
          print('FACADE_PARITY=PASS')
          PY
          "$python" -m ruff check --select F401 src scripts tests
          "$python" -m ruff format --check \
            src/loto/autogluon_campaign/holdout_prospective.py \
            src/loto/moirai2_campaign/target_execution.py
          "$python" -m compileall -q src scripts tests
          echo "STATIC_RC=0" >> "$GITHUB_ENV"
          echo "FACADE_RC=0" >> "$GITHUB_ENV"

      - name: Run original facade regression tests
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          "$python" -m pytest -q \
            tests/autogluon_campaign/test_holdout_prospective.py \
            tests/moirai2_campaign/test_p8d_scripts.py \
            tests/moirai2_campaign/test_target_execution_artifacts.py \
            tests/moirai2_campaign/test_target_execution_integrity.py \
            tests/moirai2_campaign/test_target_execution_state.py
          echo "FOCUSED_RC=0" >> "$GITHUB_ENV"

      - name: Verify collection parity and exact residual lint
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          set +e
          "$python" -m pytest -q > "$RUNNER_TEMP/pytest-full.txt" 2>&1
          pytest_rc=$?
          "$python" -m ruff check --output-format=json src scripts tests > "$RUNNER_TEMP/ruff-residual.json"
          ruff_rc=$?
          set -e
          test "$pytest_rc" -eq 2
          collection_errors="$(grep -c '^ERROR collecting ' "$RUNNER_TEMP/pytest-full.txt" || true)"
          test "$collection_errors" -eq "$BASELINE_COLLECTION_ERRORS"
          test "$ruff_rc" -eq 1
          "$python" - "$RUNNER_TEMP/ruff-residual.json" <<'PY'
          import collections,json,os,sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          counts=collections.Counter(row.get('code','UNKNOWN') for row in rows)
          print(f"REMAINING_LINT_COUNT={len(rows)}")
          print("REMAINING_RULE_COUNTS=" + ",".join(f"{k}:{v}" for k,v in sorted(counts.items())))
          assert len(rows) == int(os.environ['EXPECTED_REMAINING_LINT']), len(rows)
          assert counts == {'UP042': 66}, counts
          PY
          echo "PYTEST_RC=$pytest_rc" >> "$GITHUB_ENV"
          echo "COLLECTION_ERRORS=$collection_errors" >> "$GITHUB_ENV"
          echo "COLLECTION_PARITY=1" >> "$GITHUB_ENV"
          echo "REMAINING_LINT_COUNT=$EXPECTED_REMAINING_LINT" >> "$GITHUB_ENV"

      - name: Commit verified explicit re-exports
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/loto/autogluon_campaign/holdout_prospective.py \
            src/loto/moirai2_campaign/target_execution.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "style: make F401 facade re-exports explicit (#200)"
          repaired_head="$(git rev-parse HEAD)"
          echo "REPAIRED_HEAD=$repaired_head" >> "$GITHUB_ENV"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Persist verification evidence
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RESULT_PATH" <<EOF
          RUFF_F401_REPAIR_VERSION=1
          RUN_ID=$GITHUB_RUN_ID
          RUFF_VERSION=$RUFF_VERSION
          REPAIRED_HEAD=$REPAIRED_HEAD
          EXPLICIT_REEXPORTS=40
          AUTOGLUON_REEXPORTS=4
          MOIRAI_F401_REEXPORTS=36
          MOIRAI_PUBLIC_SURFACE=37
          DEPS_RC=$DEPS_RC
          STATIC_RC=$STATIC_RC
          FACADE_RC=$FACADE_RC
          FOCUSED_RC=$FOCUSED_RC
          PYTEST_RC=$PYTEST_RC
          COLLECTION_ERRORS=$COLLECTION_ERRORS
          COLLECTION_PARITY=$COLLECTION_PARITY
          REMAINING_LINT_COUNT=$REMAINING_LINT_COUNT
          REMAINING_RULE_COUNTS=UP042:66
          EOF
          git add "$RESULT_PATH"
          git commit -m "chore: capture Ruff F401 verification evidence (#200)"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Enforce repair gates
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$DEPS_RC" = 0
          test "$STATIC_RC" = 0
          test "$FACADE_RC" = 0
          test "$FOCUSED_RC" = 0
          test "$PYTEST_RC" = 2
          test "$COLLECTION_ERRORS" = "$BASELINE_COLLECTION_ERRORS"
          test "$COLLECTION_PARITY" = 1
          test "$REMAINING_LINT_COUNT" = "$EXPECTED_REMAINING_LINT"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -z "${CI_VENV:-}" ]] || { case "$CI_VENV" in "$RUNNER_TEMP"/*) rm -rf "$CI_VENV" ;; *) exit 1 ;; esac; }
          [[ -z "${UV_CACHE_DIR:-}" ]] || { case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf "$UV_CACHE_DIR" ;; *) exit 1 ;; esac; }
          [[ -z "${FACADE_BASELINE:-}" ]] || { case "$FACADE_BASELINE" in "$RUNNER_TEMP"/*) rm -f "$FACADE_BASELINE" ;; *) exit 1 ;; esac; }
