name: f401-inventory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ruff-lint-f401-export-contracts-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/ruff-lint-f401-export-contracts-v1
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Inventory F401 findings and export contracts
        shell: bash
        env:
          EXPECTED_TOTAL_LINT: '106'
          EXPECTED_F401: '40'
          EXPECTED_RUFF_VERSION: '0.16.0'
        run: |
          set -Eeuo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-f401-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-f401-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" "ruff==$ruff_version"
          set +e
          "$python" -m ruff check --output-format=json src scripts tests > "$RUNNER_TEMP/all.json"
          all_rc=$?
          "$python" -m ruff check --select F401 --output-format=json src scripts tests > "$RUNNER_TEMP/f401.json"
          f401_rc=$?
          set -e
          test "$all_rc" -eq 1
          test "$f401_rc" -eq 1
          "$python" - "$RUNNER_TEMP/all.json" "$RUNNER_TEMP/f401.json" <<'PY'
          from __future__ import annotations

          import ast
          import collections
          import json
          import os
          import re
          import sys
          from pathlib import Path

          all_rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          rows=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8') or '[]')
          counts=collections.Counter(row.get('code','UNKNOWN') for row in all_rows)
          by_file=collections.Counter(Path(row['filename']).resolve().relative_to(Path.cwd().resolve()).as_posix() for row in rows)
          print(f"TOTAL_LINT_COUNT={len(all_rows)}")
          print("TOTAL_RULE_COUNTS=" + ",".join(f"{k}:{v}" for k,v in sorted(counts.items())))
          print(f"F401_COUNT={len(rows)}")
          print("F401_FILES=" + ",".join(f"{k}:{v}" for k,v in sorted(by_file.items())))

          def literal_all(tree: ast.Module) -> set[str]:
              result: set[str] = set()
              for node in tree.body:
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      if not any(isinstance(t, ast.Name) and t.id == '__all__' for t in targets):
                          continue
                      value=node.value
                      if isinstance(value, (ast.List, ast.Tuple, ast.Set)):
                          for elt in value.elts:
                              if isinstance(elt, ast.Constant) and isinstance(elt.value, str):
                                  result.add(elt.value)
              return result

          def import_bindings_at(tree: ast.Module, line: int) -> list[str]:
              found=[]
              for node in ast.walk(tree):
                  if getattr(node,'lineno',None) != line:
                      continue
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          found.append(alias.asname or alias.name.split('.')[0])
                  elif isinstance(node, ast.ImportFrom):
                      for alias in node.names:
                          if alias.name == '*':
                              found.append('*')
                          else:
                              found.append(alias.asname or alias.name)
              return found

          for index,row in enumerate(rows,start=1):
              path=Path(row['filename']).resolve().relative_to(Path.cwd().resolve())
              source=path.read_text(encoding='utf-8')
              lines=source.splitlines()
              tree=ast.parse(source, filename=str(path))
              loc=row.get('location') or {}
              line=int(loc.get('row') or 1)
              bindings=import_bindings_at(tree,line)
              exports=literal_all(tree)
              names=collections.Counter(
                  node.id for node in ast.walk(tree)
                  if isinstance(node, ast.Name) and isinstance(node.ctx, ast.Load)
              )
              binding_usage={name:names.get(name,0) for name in bindings if name != '*'}
              exported=[name for name in bindings if name in exports]
              is_init=path.name == '__init__.py'
              has_getattr=any(isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name=='__getattr__' for node in tree.body)
              has_dir=any(isinstance(node,(ast.FunctionDef,ast.AsyncFunctionDef)) and node.name=='__dir__' for node in tree.body)
              has_all=bool(exports)
              message=row.get('message','')
              # Ruff message usually carries the imported symbol; retain it as evidence too.
              msg_symbol=None
              match=re.search(r'`([^`]+)` imported but unused', message)
              if match:
                  msg_symbol=match.group(1)
              lo=max(1,line-5); hi=min(len(lines),line+4)
              context=' || '.join(f"{n}:{lines[n-1].strip()}" for n in range(lo,hi+1))
              print(
                  "F401|{idx}|{path}:{line}:{col}|bindings={bindings}|msg_symbol={msg_symbol}|"
                  "usage={usage}|exported={exported}|is_init={is_init}|has_all={has_all}|"
                  "has_getattr={has_getattr}|has_dir={has_dir}|fix={fix}|CTX={ctx}".format(
                      idx=index,
                      path=path.as_posix(),
                      line=line,
                      col=loc.get('column'),
                      bindings=','.join(bindings),
                      msg_symbol=msg_symbol or '',
                      usage=','.join(f"{k}:{v}" for k,v in binding_usage.items()),
                      exported=','.join(exported),
                      is_init=int(is_init),
                      has_all=int(has_all),
                      has_getattr=int(has_getattr),
                      has_dir=int(has_dir),
                      fix='none' if row.get('fix') is None else (row['fix'].get('applicability') or 'available'),
                      ctx=context,
                  )
              )

          if len(all_rows) != int(os.environ['EXPECTED_TOTAL_LINT']):
              raise SystemExit(f"unexpected total lint: {len(all_rows)}")
          if len(rows) != int(os.environ['EXPECTED_F401']):
              raise SystemExit(f"unexpected F401 count: {len(rows)}")
          PY
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
          rm -rf -- "$venv" "$cache"
