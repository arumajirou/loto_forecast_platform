name: prospective-registry-source-recovery-temp

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: prospective-registry-source-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  recover-and-focused-verify:
    if: ${{ github.repository == 'arumajirou/loto_forecast_platform' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/prospective-registry-reconciliation-source-corruption-main-v2' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      TARGET_PATH: "src/loto/auto_campaign/prospective_registry_reconciliation_expected.py"
      CORRUPT_BLOB: "21750ca3c282de160da8825cb503013bf5da0974"
      REPAIR_BLOB: "e13b5d78c22e529a2b516e8da1ab1b205245dcf8"
      TEST_PATH: "tests/auto_campaign/test_prospective_registry_reconciliation.py"
      STALE_TEST_BLOB: "f11167a4b27ff59b9e414c8898227b635e9a4c71"
      REPAIR_TEST_BLOB: "640c8e491ca1a75db23ae3f5a75dd764fd890070"
      REPAIR_BRANCH: "fix/prospective-registry-reconciliation-source-corruption-v1"
      REPAIR_COMMIT: "45ce9fa84b6b7a4a7aae347c45c784187a0b0984"

    steps:
      - name: Verify expected self-hosted runner
        run: |
          set -Eeuo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted clean-main recovery branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/prospective-registry-reconciliation-source-corruption-main-v2
          persist-credentials: true
          fetch-depth: 1
          clean: true

      - name: Fetch and verify exact PR 179 recovery commit
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin \
            "refs/heads/$REPAIR_BRANCH:refs/remotes/origin/pr179-source-recovery"
          fetched_commit="$(git rev-parse refs/remotes/origin/pr179-source-recovery)"
          echo "fetched_repair_commit=$fetched_commit"
          test "$fetched_commit" = "$REPAIR_COMMIT"

      - name: Recover exact PR 179 source blob when needed
        run: |
          set -Eeuo pipefail
          current_blob="$(git hash-object "$TARGET_PATH")"
          echo "current_source_blob=$current_blob"

          if [[ "$current_blob" == "$REPAIR_BLOB" ]]; then
            echo "source_recovery=ALREADY_APPLIED"
            exit 0
          fi
          if [[ "$current_blob" != "$CORRUPT_BLOB" ]]; then
            echo "unexpected current source blob: $current_blob" >&2
            exit 1
          fi

          recovered="$RUNNER_TEMP/prospective_registry_reconciliation_expected.py"
          git show "$REPAIR_COMMIT:$TARGET_PATH" > "$recovered"
          recovered_blob="$(git hash-object "$recovered")"
          echo "recovered_source_blob=$recovered_blob"
          test "$recovered_blob" = "$REPAIR_BLOB"
          cp -- "$recovered" "$TARGET_PATH"
          test "$(git hash-object "$TARGET_PATH")" = "$REPAIR_BLOB"
          test "$(git diff --name-only)" = "$TARGET_PATH"
          git diff --check -- "$TARGET_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_PATH"
          test "$(git diff --cached --name-only)" = "$TARGET_PATH"
          git diff --cached --check
          git commit -m "fix(auto-campaign): recover corrupted reconciliation expected-state builder"
          git push origin HEAD:fix/prospective-registry-reconciliation-source-corruption-main-v2

      - name: Recover exact PR 179 regression fixture when needed
        run: |
          set -Eeuo pipefail
          current_blob="$(git hash-object "$TEST_PATH")"
          echo "current_test_blob=$current_blob"

          if [[ "$current_blob" == "$REPAIR_TEST_BLOB" ]]; then
            echo "test_recovery=ALREADY_APPLIED"
            exit 0
          fi
          if [[ "$current_blob" != "$STALE_TEST_BLOB" ]]; then
            echo "unexpected current test blob: $current_blob" >&2
            exit 1
          fi

          recovered="$RUNNER_TEMP/test_prospective_registry_reconciliation.py"
          git show "$REPAIR_COMMIT:$TEST_PATH" > "$recovered"
          recovered_blob="$(git hash-object "$recovered")"
          echo "recovered_test_blob=$recovered_blob"
          test "$recovered_blob" = "$REPAIR_TEST_BLOB"
          cp -- "$recovered" "$TEST_PATH"
          test "$(git hash-object "$TEST_PATH")" = "$REPAIR_TEST_BLOB"
          test "$(git diff --name-only)" = "$TEST_PATH"
          git diff --check -- "$TEST_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TEST_PATH"
          test "$(git diff --cached --name-only)" = "$TEST_PATH"
          git diff --cached --check
          git commit -m "test(auto-campaign): restore valid reconciliation receipt regression"
          git push origin HEAD:fix/prospective-registry-reconciliation-source-corruption-main-v2

      - name: Install exact uv without GitHub cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare isolated Python environment
        run: |
          set -Eeuo pipefail
          actual="$(uv --version)"
          echo "uv_version=$actual"
          case "$actual" in
            "uv $UV_VERSION"*) ;;
            *) echo "unexpected uv version: $actual" >&2; exit 1 ;;
          esac
          uv python install "$UV_PYTHON"
          ci_venv="$RUNNER_TEMP/loto-source-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          uv_cache="$RUNNER_TEMP/loto-source-recovery-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$ci_venv" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "unsafe CI venv path: $ci_venv" >&2; exit 1 ;;
          esac
          case "$uv_cache" in
            "$RUNNER_TEMP"/*) ;;
            *) echo "unsafe uv cache path: $uv_cache" >&2; exit 1 ;;
          esac
          rm -rf -- "$ci_venv" "$uv_cache"
          mkdir -p -- "$uv_cache"
          echo "CI_VENV=$ci_venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$uv_cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$uv_cache" uv venv "$ci_venv" --python "$UV_PYTHON"
          "$ci_venv/bin/python" --version

      - name: Install repository-locked Ruff
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          ruff_version="$(
            "$python" - <<'PY'
          import tomllib
          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)
          versions = [p["version"] for p in lock["package"] if p.get("name") == "ruff"]
          if len(versions) != 1:
              raise SystemExit(f"expected one Ruff version, got {versions!r}")
          print(versions[0])
          PY
          )"
          echo "RUFF_VERSION=$ruff_version" >> "$GITHUB_ENV"
          uv pip install --quiet --python "$python" "ruff==$ruff_version"
          "$python" -m ruff --version

      - name: Verify exact recovery blobs syntax and locked Ruff gates
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          test "$(git hash-object "$TARGET_PATH")" = "$REPAIR_BLOB"
          test "$(git hash-object "$TEST_PATH")" = "$REPAIR_TEST_BLOB"
          "$python" -m py_compile "$TARGET_PATH" "$TEST_PATH"
          "$python" -m ruff format --check "$TARGET_PATH" "$TEST_PATH"
          "$python" -m ruff check "$TARGET_PATH" "$TEST_PATH"

      - name: Install matching CPU-only PyTorch and project test dependencies
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.9.1"
          uv pip install --quiet --python "$python" -e ".[api,dev,postgres]"
          uv pip install --quiet --python "$python" "ruff==$RUFF_VERSION"
          uv pip check --python "$python"

      - name: Run repaired reconciliation focused tests
        run: |
          set -Eeuo pipefail
          "$CI_VENV/bin/python" -m pytest -q "$TEST_PATH"

      - name: Compile auto-campaign package
        run: |
          set -Eeuo pipefail
          "$CI_VENV/bin/python" -m compileall -q src/loto/auto_campaign

      - name: Verify exact recovery scope and clean workspace
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          test "$(git hash-object "$TARGET_PATH")" = "$REPAIR_BLOB"
          test "$(git hash-object "$TEST_PATH")" = "$REPAIR_TEST_BLOB"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Remove CI-owned temporary environment
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${CI_VENV:-}" ]]; then
            case "$CI_VENV" in
              "$RUNNER_TEMP"/*) rm -rf -- "$CI_VENV" ;;
              *) echo "refusing to remove unsafe CI_VENV=$CI_VENV" >&2; exit 1 ;;
            esac
          fi
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then
            case "$UV_CACHE_DIR" in
              "$RUNNER_TEMP"/*) rm -rf -- "$UV_CACHE_DIR" ;;
              *) echo "refusing to remove unsafe UV_CACHE_DIR=$UV_CACHE_DIR" >&2; exit 1 ;;
            esac
          fi
