name: up042-publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/ruff-up042-inventory-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: fix/ruff-up042-inventory-v1
          persist-credentials: true
          fetch-depth: 1

      - name: Gate publish trigger
        id: gate
        shell: bash
        run: |
          set -Eeuo pipefail
          message="$(git log -1 --pretty=%s)"
          echo "head_message=$message"
          if [[ "$message" == "ci: publish verified UP042 migration (#200)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Verify transform and publish source
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          uv python install 3.13
          venv="$RUNNER_TEMP/loto-up042-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-up042-publish-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          uv pip check --python "$python"
          test "$("$python" -m ruff --version)" = 'ruff 0.16.0'

          set +e
          "$python" -m ruff check --select UP042 --output-format=json src scripts tests > "$RUNNER_TEMP/up042.json"
          rc=$?
          set -e
          test "$rc" -eq 1

          "$python" - "$RUNNER_TEMP/up042.json" "$RUNNER_TEMP/selected-tests.json" <<'PY'
          import ast,json,re,sys
          from pathlib import Path
          root=Path.cwd().resolve()
          rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          assert len(rows)==66,len(rows)
          assert {row.get('code') for row in rows}=={'UP042'}
          symbols=[]
          files=set()
          for row in rows:
              path=Path(row['filename']).resolve().relative_to(root)
              files.add(path.as_posix())
              line=int(row['location']['row'])
              tree=ast.parse(path.read_text(encoding='utf-8'),filename=str(path))
              nodes=[n for n in ast.walk(tree) if isinstance(n,ast.ClassDef) and n.lineno<=line<=getattr(n,'end_lineno',n.lineno)]
              nodes.sort(key=lambda n:n.lineno,reverse=True)
              assert nodes,(path,line)
              module='.'.join(path.with_suffix('').parts[1:])
              package='.'.join(module.split('.')[:2]) if module.count('.')>=1 else module
              symbols.append((module,package,nodes[0].name))
          assert len(files)==20,len(files)
          selected=[]
          for test in Path('tests').rglob('test_*.py'):
              text=test.read_text(encoding='utf-8',errors='replace')
              if any(module in text or (package in text and re.search(rf'\b{re.escape(name)}\b',text)) for module,package,name in symbols):
                  selected.append(test.as_posix())
          selected=sorted(set(selected))
          assert len(selected)==40,len(selected)
          Path(sys.argv[2]).write_text(json.dumps(selected,indent=2)+'\n',encoding='utf-8')
          print('UP042_BASELINE=66')
          print('AFFECTED_SOURCE_FILES=20')
          print('SELECTED_TEST_FILES=40')
          PY

          cat > "$RUNNER_TEMP/test-outcomes.py" <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          tests=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          out={}
          for test in tests:
              proc=subprocess.run([sys.executable,'-m','pytest','-q','--tb=no',test],text=True,capture_output=True,check=False)
              text=(proc.stdout or '')+'\n'+(proc.stderr or '')
              ids=[]
              for line in text.splitlines():
                  stripped=line.strip()
                  if stripped.startswith('FAILED ') or stripped.startswith('ERROR '):
                      ids.append(stripped.split(' - ',1)[0])
              out[test]={'returncode':proc.returncode,'problem_ids':sorted(set(ids))}
          Path(sys.argv[2]).write_text(json.dumps(out,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          PY

          "$python" "$RUNNER_TEMP/test-outcomes.py" "$RUNNER_TEMP/selected-tests.json" "$RUNNER_TEMP/before.json"

          "$python" -m ruff check --select UP042 --fix --unsafe-fixes src scripts tests
          "$python" -m ruff check --select F401 --fix src scripts tests
          "$python" -m ruff check src scripts tests
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 20
          for path in "${changed[@]}"; do case "$path" in src/loto/*.py|src/loto/**/*.py) ;; *) echo "unexpected changed path: $path"; exit 1 ;; esac; done
          "$python" -m ruff format --check "${changed[@]}"
          "$python" -m compileall -q src scripts tests

          "$python" "$RUNNER_TEMP/test-outcomes.py" "$RUNNER_TEMP/selected-tests.json" "$RUNNER_TEMP/after.json"
          "$python" - "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" <<'PY'
          import json,sys
          from pathlib import Path
          before=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          after=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          assert before==after, {'before':before,'after':after}
          print('PER_FILE_TEST_PARITY=PASS')
          print('BASELINE_PASS_FILES='+str(sum(1 for x in before.values() if x['returncode']==0)))
          print('BASELINE_NONPASS_FILES='+str(sum(1 for x in before.values() if x['returncode']!=0)))
          PY

          set +e
          "$python" -m pytest -q > "$RUNNER_TEMP/full-pytest.txt" 2>&1
          full_rc=$?
          set -e
          test "$full_rc" -eq 2
          "$python" - "$RUNNER_TEMP/full-pytest.txt" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          summaries=[int(m.group(1)) for m in re.finditer(r'(\d+) errors? during collection',text)]
          headers=sum(1 for line in text.splitlines() if 'ERROR collecting ' in line)
          actual=summaries[-1] if summaries else headers
          print(f'COLLECTION_ERRORS={actual}')
          assert actual==34,(actual,text[-5000:])
          PY

          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/loto
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 20
          test "${staged[*]}" = "${changed[*]}"
          git commit -m "style: migrate string enums to StrEnum (#200)"
          repaired_head="$(git rev-parse HEAD)"
          echo "REPAIRED_HEAD=$repaired_head"
          git push origin "HEAD:fix/ruff-up042-inventory-v1"

          rm -rf -- "$venv" "$cache" "$RUNNER_TEMP/up042.json" \
            "$RUNNER_TEMP/selected-tests.json" "$RUNNER_TEMP/test-outcomes.py" \
            "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/after.json" "$RUNNER_TEMP/full-pytest.txt"
