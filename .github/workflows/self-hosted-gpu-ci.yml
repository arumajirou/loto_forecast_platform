name: self-hosted-gpu-ci

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Validation scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      require_cuda:
        description: Fail unless PyTorch executes on CUDA
        required: true
        default: true
        type: boolean
      actions_only:
        description: Run the lightweight Actions compatibility smoke only
        required: true
        default: false
        type: boolean
      dependency_profile:
        description: Run a focused dependency validation profile
        required: true
        default: none
        type: choice
        options:
          - none
          - postgres
          - ray-core
          - ray-optimization
          - routine

permissions:
  contents: read

concurrency:
  group: self-hosted-gpu-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  actions-smoke:
    name: Local Actions compatibility smoke
    if: ${{ github.actor == github.repository_owner && inputs.actions_only }}
    runs-on: [self-hosted, linux, x64, loto-ci]
    timeout-minutes: 10

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13 with setup-python v7
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify Actions compatibility
        run: |
          set -Eeuo pipefail
          python --version
          python - <<'PY'
          import platform
          import sys

          assert sys.version_info[:2] == (3, 13), sys.version
          print(f"python={sys.version}")
          print(f"platform={platform.platform()}")
          PY
          test -f pyproject.toml
          test -f uv.lock
          git diff --exit-code
          git diff --cached --exit-code

  dependency-smoke:
    name: Local dependency smoke (${{ inputs.dependency_profile }})
    if: ${{ github.actor == github.repository_owner && !inputs.actions_only && inputs.dependency_profile != 'none' }}
    runs-on: [self-hosted, linux, x64, loto-ci]
    timeout-minutes: 30

    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Configure uv cache
        run: |
          set -Eeuo pipefail
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-dependency-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/uv-dependency-cache"

      - name: Verify locked dependency graph
        run: |
          set -Eeuo pipefail
          command -v uv
          uv --version
          uv lock --check

      - name: Postgres dependency smoke
        if: ${{ inputs.dependency_profile == 'postgres' }}
        run: |
          set -Eeuo pipefail

          uv sync --frozen --python "3.13" --extra postgres

          uv pip check --python .venv/bin/python

          uv run --frozen python - <<'PY'
          import psycopg
          from importlib.metadata import version

          installed = version("psycopg")
          print(f"psycopg={installed}")
          print(f"psycopg_module={psycopg.__name__}")

          assert installed, "psycopg version metadata missing"
          PY

      - name: Ray dependency environment
        if: ${{ startsWith(inputs.dependency_profile, 'ray-') }}
        run: |
          set -Eeuo pipefail
          uv sync --frozen --python "3.13" --extra full
          uv pip check --python .venv/bin/python
          uv run --frozen python - <<'PY'
          import re
          from importlib.metadata import version

          ray_version = version("ray")
          print(f"ray={ray_version}")

          match = re.match(r"^(\d+)\.(\d+)\.(\d+)", ray_version)
          assert match is not None, ray_version
          assert tuple(map(int, match.groups())) >= (2, 56, 1), ray_version
          PY

      - name: Ray core Tune smoke
        if: ${{ inputs.dependency_profile == 'ray-core' }}
        run: |
          set -Eeuo pipefail
          uv run --frozen python - <<'PY'
          import tempfile
          import warnings

          import ray
          from ray import tune

          def trainable(config):
              del config
              tune.report({"score": 1.0})

          ray.shutdown()

          try:
              with tempfile.TemporaryDirectory() as storage:
                  with warnings.catch_warnings(record=True) as caught:
                      warnings.simplefilter("always")

                      tuner = tune.Tuner(
                          tune.with_resources(
                              trainable,
                              {"cpu": 1.0, "gpu": 0.0},
                          ),
                          tune_config=tune.TuneConfig(
                              num_samples=1,
                              metric="score",
                              mode="max",
                          ),
                          run_config=tune.RunConfig(
                              storage_path=storage,
                          ),
                      )

                      results = tuner.fit()

                  bad = [
                      str(item.message)
                      for item in caught
                      if (
                          "RunConfig" in str(item.message)
                          and "ray.tune" in str(item.message)
                      )
                  ]

                  assert not bad, bad

                  best = results.get_best_result(
                      metric="score",
                      mode="max",
                  )

                  assert float(best.metrics["score"]) == 1.0
                  print("RAY_CORE_TUNE_SMOKE=PASS")
          finally:
              ray.shutdown()
          PY

      - name: Repository Ray optimization smoke
        if: ${{ inputs.dependency_profile == 'ray-optimization' }}
        run: |
          set -Eeuo pipefail
          uv run --frozen python - <<'PY'
          import tempfile
          import warnings

          import ray

          from loto.optimization.search import optimize_ray

          ray.shutdown()

          try:
              with tempfile.TemporaryDirectory() as storage:
                  with warnings.catch_warnings(record=True) as caught:
                      warnings.simplefilter("always")

                      result = optimize_ray(
                          "__ray_compat_smoke__",
                          lambda config: 1.0,
                          trials=1,
                          timeout_seconds=120,
                          cpus_per_trial=1.0,
                          gpus_per_trial=0.0,
                          output_dir=storage,
                      )

                  bad = [
                      str(item.message)
                      for item in caught
                      if (
                          "RunConfig" in str(item.message)
                          and "ray.tune" in str(item.message)
                      )
                  ]

                  assert not bad, bad
                  assert result.backend == "ray"
                  assert float(result.best_value) == 1.0

                  print("RAY_OPTIMIZATION_SMOKE=PASS")
          finally:
              ray.shutdown()
          PY

      - name: Routine dependency environment
        if: ${{ inputs.dependency_profile == 'routine' }}
        run: |
          set -Eeuo pipefail

          uv sync \
            --frozen \
            --python "3.13" \
            --extra api \
            --extra dev \
            --extra frameworks \
            --extra mlflow

          uv pip check --python .venv/bin/python

          uv run \
            --frozen \
            --extra api \
            --extra dev \
            --extra frameworks \
            --extra mlflow \
            python - <<'PY'
          from importlib.metadata import version

          for package in (
              "uvicorn",
              "hypothesis",
              "ruff",
              "gluonts",
              "mlflow",
              "mlflow-skinny",
              "mlflow-tracing",
          ):
              print(
                  "ROUTINE_PACKAGE_VERSION="
                  f"{package}={version(package)}"
              )

          print("ROUTINE_DEPENDENCY_ENVIRONMENT=PASS")
          PY

      - name: GluonTS real inference smoke
        if: ${{ inputs.dependency_profile == 'routine' }}
        run: |
          set -Eeuo pipefail

          uv run \
            --frozen \
            --extra api \
            --extra dev \
            --extra frameworks \
            --extra mlflow \
            python - <<'PY'
          import numpy as np
          import pandas as pd

          from gluonts.model.seasonal_naive import (
              SeasonalNaivePredictor,
          )

          item = {
              "start": pd.Period("2025-01-01", freq="D"),
              "target": np.asarray(
                  [1, 2, 3, 4, 5, 6],
                  dtype=np.float32,
              ),
          }

          predictor = SeasonalNaivePredictor(
              prediction_length=2,
              season_length=2,
          )

          forecast = predictor.predict_item(item)
          mean = np.asarray(forecast.mean, dtype=float)

          print(f"GLUONTS_OUTPUT_SHAPE={mean.shape}")
          print(f"GLUONTS_OUTPUT={mean.tolist()}")

          assert mean.shape == (2,)
          assert np.isfinite(mean).all()
          assert np.allclose(mean, [5.0, 6.0])

          print("GLUONTS_RUNTIME_SMOKE=PASS")
          PY

      - name: MLflow local tracking smoke
        if: ${{ inputs.dependency_profile == 'routine' }}
        run: |
          set -Eeuo pipefail

          uv run \
            --frozen \
            --extra api \
            --extra dev \
            --extra frameworks \
            --extra mlflow \
            python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import mlflow

          with TemporaryDirectory() as tmp:
              mlflow.set_tracking_uri(
                  Path(tmp).resolve().as_uri()
              )

              experiment = mlflow.set_experiment(
                  "routine-dependency-smoke"
              )

              with mlflow.start_run():
                  mlflow.log_metric(
                      "dependency_smoke",
                      1.0,
                  )

              runs = mlflow.search_runs(
                  experiment_ids=[
                      experiment.experiment_id
                  ]
              )

              assert not runs.empty

          print("MLFLOW_RUNTIME_SMOKE=PASS")
          PY

      - name: Uvicorn and Hypothesis runtime smoke
        if: ${{ inputs.dependency_profile == 'routine' }}
        run: |
          set -Eeuo pipefail

          uv run \
            --frozen \
            --extra api \
            --extra dev \
            --extra frameworks \
            --extra mlflow \
            python - <<'PY'
          from fastapi import FastAPI
          from hypothesis import (
              given,
              settings,
              strategies as st,
          )
          import uvicorn

          app = FastAPI()

          config = uvicorn.Config(
              app,
              host="127.0.0.1",
              port=0,
              log_level="warning",
          )

          assert config.app is app

          @settings(
              max_examples=8,
              derandomize=True,
          )
          @given(st.integers())
          def identity(value: int) -> None:
              assert value == value

          identity()

          print("UVICORN_CONFIG_SMOKE=PASS")
          print("HYPOTHESIS_RUNTIME_SMOKE=PASS")
          PY

      - name: Routine dependency smoke result
        if: ${{ inputs.dependency_profile == 'routine' }}
        run: |
          set -Eeuo pipefail
          echo "ROUTINE_DEPENDENCY_SMOKE=PASS"

      - name: Verify tracked files stayed clean
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code

  gpu-ci:
    name: Local GPU CI (${{ inputs.suite }})
    if: ${{ github.actor == github.repository_owner && !inputs.actions_only && inputs.dependency_profile == 'none' }}
    runs-on: [self-hosted, linux, x64, loto-ci, gpu, cuda]
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: "0"
      UV_PYTHON: "3.13"
      EVIDENCE_DIR: artifacts/self-hosted

    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Configure runner-scoped paths
        run: |
          set -Eeuo pipefail
          printf 'HF_HOME=%s\n' "$RUNNER_TEMP/huggingface" >> "$GITHUB_ENV"
          printf 'TORCH_HOME=%s\n' "$RUNNER_TEMP/torch" >> "$GITHUB_ENV"
          printf 'UV_CACHE_DIR=%s\n' "$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/huggingface" \
            "$RUNNER_TEMP/torch" \
            "$RUNNER_TEMP/uv-cache"

      - name: Prepare evidence directory
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "ref=${GITHUB_REF}" \
            "sha=${GITHUB_SHA}" \
            "actor=${GITHUB_ACTOR}" \
            "runner_name=${RUNNER_NAME}" \
            "runner_os=${RUNNER_OS}" \
            "runner_arch=${RUNNER_ARCH}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            > "$EVIDENCE_DIR/run-context.txt"

      - name: Host preflight
        run: |
          set -Eeuo pipefail
          command -v uv
          PREFLIGHT_PYTHON="$(uv python find "$UV_PYTHON")"
          printf 'preflight_python=%s\n' "$PREFLIGHT_PYTHON" \
            | tee "$EVIDENCE_DIR/preflight-python.txt"
          "$PREFLIGHT_PYTHON" --version \
            | tee -a "$EVIDENCE_DIR/preflight-python.txt"
          args=(
            --require-runner-env
            --min-free-disk-gib 20
            --output "$EVIDENCE_DIR/preflight.json"
          )
          if [[ "${{ inputs.require_cuda }}" == "true" ]]; then
            args+=(--require-cuda)
          fi
          "$PREFLIGHT_PYTHON" \
            scripts/ci/self_hosted_runner_probe.py "${args[@]}" \
            2>&1 | tee "$EVIDENCE_DIR/preflight.log"

      - name: Resolve locked environment
        run: |
          set -Eeuo pipefail
          command -v uv
          uv --version | tee "$EVIDENCE_DIR/uv-version.txt"
          uv sync --frozen --python "$UV_PYTHON" \
            --extra api --extra dev --extra postgres \
            2>&1 | tee "$EVIDENCE_DIR/uv-sync.log"
          uv run --frozen python --version \
            2>&1 | tee "$EVIDENCE_DIR/venv-python-version.txt"
          uv pip check --python .venv/bin/python \
            2>&1 | tee "$EVIDENCE_DIR/uv-pip-check.log"

      - name: CUDA and PyTorch postflight
        run: |
          set -Eeuo pipefail
          args=(
            --require-runner-env
            --verify-torch
            --min-free-disk-gib 10
            --output "$EVIDENCE_DIR/postflight.json"
          )
          if [[ "${{ inputs.require_cuda }}" == "true" ]]; then
            args+=(--require-cuda)
          fi
          uv run --frozen python scripts/ci/self_hosted_runner_probe.py "${args[@]}" \
            2>&1 | tee "$EVIDENCE_DIR/postflight.log"

      - name: Fast quality gates
        run: |
          set -Eeuo pipefail
          uv run --frozen ruff format --check src scripts tests \
            2>&1 | tee "$EVIDENCE_DIR/ruff-format.log"
          uv run --frozen ruff check src scripts tests \
            2>&1 | tee "$EVIDENCE_DIR/ruff-check.log"
          uv run --frozen python -m compileall -q src scripts tests \
            2>&1 | tee "$EVIDENCE_DIR/compileall.log"

      - name: Smoke import and device check
        if: ${{ inputs.suite == 'smoke' }}
        run: |
          set -Eeuo pipefail
          uv run --frozen python - <<'PY' \
            2>&1 | tee "$EVIDENCE_DIR/smoke-import.log"
          import torch
          import loto

          print(f"loto_package={loto.__name__}")
          print(f"torch_version={torch.__version__}")
          print(f"cuda_available={torch.cuda.is_available()}")
          if "${{ inputs.require_cuda }}" == "true":
              assert torch.cuda.is_available(), "CUDA is required"
          PY

      - name: Full test suite
        if: ${{ inputs.suite == 'full' }}
        run: |
          set -Eeuo pipefail
          uv run --frozen pytest -q \
            2>&1 | tee "$EVIDENCE_DIR/pytest-full.log"

      - name: Verify tracked files stayed clean
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: self-hosted-gpu-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/self-hosted/
          if-no-files-found: error
          retention-days: 14

      - name: Remove transient caches
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          rm -rf -- \
            "$RUNNER_TEMP/huggingface" \
            "$RUNNER_TEMP/torch" \
            "$RUNNER_TEMP/uv-cache"
