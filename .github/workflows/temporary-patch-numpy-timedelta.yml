name: temporary numpy timedelta patch

on:
  push:
    branches:
      - fix/numpy-timedelta-explicit-unit-20260805

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/numpy-timedelta-explicit-unit-20260805
          fetch-depth: 0

      - name: Replace deprecated generic timedelta construction
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("tests/runtime_validation/test_runtime_validation_contracts.py"): [
                  (
                      'pd.Timestamp("2020-01-01", tz="UTC") + pd.Timedelta(days=i * 7)',
                      'pd.Timestamp("2020-01-01", tz="UTC") + pd.to_timedelta(i * 7, unit="D")',
                  ),
              ],
              Path("tests/test_formal_backtest.py"): [
                  (
                      'pd.Timestamp("2026-01-01") + pd.Timedelta(days=7 * idx)',
                      'pd.Timestamp("2026-01-01") + pd.to_timedelta(7 * idx, unit="D")',
                  ),
                  (
                      'pd.Timestamp("2026-01-01") + pd.Timedelta(days=7 * 21)',
                      'pd.Timestamp("2026-01-01") + pd.to_timedelta(7 * 21, unit="D")',
                  ),
              ],
              Path("tests/test_pipeline_smoke.py"): [
                  (
                      'pd.Timestamp("2026-01-01") + pd.Timedelta(days=7 * (draw_no - 1))',
                      'pd.Timestamp("2026-01-01")\n                    + pd.to_timedelta(7 * (draw_no - 1), unit="D")',
                  ),
              ],
          }

          expected_counts = {
              "tests/runtime_validation/test_runtime_validation_contracts.py": 1,
              "tests/test_formal_backtest.py": 4,
              "tests/test_pipeline_smoke.py": 1,
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding="utf-8")
              replaced = 0
              for old, new in pairs:
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f"missing expected pattern in {path}: {old}")
                  text = text.replace(old, new)
                  replaced += count
              expected = expected_counts[path.as_posix()]
              if replaced != expected:
                  raise SystemExit(
                      f"unexpected replacement count for {path}: expected={expected} actual={replaced}"
                  )
              path.write_text(text, encoding="utf-8")
              print(f"patched={path} replacements={replaced}")
          PY

      - name: Remove temporary workflow and commit patch
        run: |
          rm .github/workflows/temporary-patch-numpy-timedelta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/runtime_validation/test_runtime_validation_contracts.py \
            tests/test_formal_backtest.py \
            tests/test_pipeline_smoke.py \
            .github/workflows/temporary-patch-numpy-timedelta.yml
          git diff --cached --check
          git commit -m "test: use explicit timedelta units"
          git push origin HEAD:fix/numpy-timedelta-explicit-unit-20260805
