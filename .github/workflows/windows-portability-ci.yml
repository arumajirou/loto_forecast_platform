name: windows-portability-ci

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/windows-portability-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-app-format-publisher:
    name: Temporary version app formatter
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/runtime-version-single-source-v2' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      EXPECTED_MAIN: "c5e822c15080becd4156639bcdb94735b1a8e7a5"
      EXPECTED_APP_BLOB: "8191635ee99f3fee5732a5ab0610db06c68257f0"

    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pin exact branch and provenance
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main "$GITHUB_HEAD_REF"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          test "$(git rev-parse HEAD:src/loto/api/app.py)" = "$EXPECTED_APP_BLOB"

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Apply only locked Ruff formatting to app
        run: |
          set -Eeuo pipefail
          ruff_version="$(python3 - <<'PY'
          import tomllib
          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)
          versions = [p["version"] for p in lock["package"] if p.get("name") == "ruff"]
          if len(versions) != 1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "0.16.0"
          uvx --from "ruff==$ruff_version" ruff format src/loto/api/app.py
          uvx --from "ruff==$ruff_version" ruff check src/loto/api/app.py
          test "$(git diff HEAD --name-only)" = "src/loto/api/app.py"
          git diff HEAD --check
          uvx --from "ruff==$ruff_version" ruff format --check src/loto/api/app.py

      - name: Commit formatter-only normalization
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main "$GITHUB_HEAD_REF"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$GITHUB_HEAD_REF)" = "$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/loto/api/app.py
          git commit -m "style(version): normalize restored API version rendering"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
