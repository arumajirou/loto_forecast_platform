name: windows-portability-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - docs/WINDOWS_INSTALL.md
      - .github/workflows/windows-portability-ci.yml
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/windows-portability-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portability:
    name: Native Windows dependency and package smoke
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.12.13"

    steps:
      - name: Verify expected native Windows self-hosted runner
        run: |
          Write-Host "runner_name=${{ runner.name }}"
          Write-Host "runner_os=${{ runner.os }}"
          Write-Host "runner_arch=${{ runner.arch }}"
          if ("${{ runner.name }}" -ne "az-loto-windows") {
            throw "unexpected self-hosted runner: ${{ runner.name }}"
          }
          if ("${{ runner.os }}" -ne "Windows") {
            throw "unexpected runner OS: ${{ runner.os }}"
          }
          if ("${{ runner.arch }}" -ne "X64") {
            throw "unexpected runner architecture: ${{ runner.arch }}"
          }
          Write-Host "native_windows_self_hosted_runner=PASS"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Verify uv and install managed Python
        run: |
          $actual = (uv --version).Trim()
          Write-Host "uv_version=$actual"
          $parts = @($actual -split '\s+')
          if ($parts.Count -lt 2 -or $parts[0] -ne "uv" -or $parts[1] -ne $env:UV_VERSION) {
            throw "unexpected uv version: $actual"
          }

          uv python install $env:UV_PYTHON
          $python = (uv python find $env:UV_PYTHON).Trim()
          Write-Host "python_path=$python"
          & $python --version

      - name: Validate committed universal lock
        run: |
          uv lock --check

          $python = (uv python find $env:UV_PYTHON).Trim()
          @'
          import tomllib

          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)

          packages = lock.get("package", [])
          root = next(p for p in packages if p.get("name") == "loto-forecast-platform")
          root_dependencies = root.get("dependencies", [])
          assert not any(d.get("name") == "triton" for d in root_dependencies), root_dependencies

          root_metadata = root.get("metadata", {})
          requires_dist = root_metadata.get("requires-dist", [])
          assert not any(d.get("name") == "triton" for d in requires_dist), requires_dist

          torch = next(
              p for p in packages
              if p.get("name") == "torch" and p.get("version") == "2.9.1"
          )
          triton_edges = [
              d for d in torch.get("dependencies", [])
              if d.get("name") == "triton"
          ]
          expected_marker = "platform_machine == 'x86_64' and sys_platform == 'linux'"
          assert len(triton_edges) == 1, triton_edges
          assert triton_edges[0].get("marker") == expected_marker, triton_edges

          print("root_direct_triton=false")
          print("torch_triton_linux_x86_64_marker=PASS")
          '@ | & $python -

      - name: Resolve native Windows dependencies without installation
        run: |
          uv sync --dry-run --locked --python $env:UV_PYTHON
          uv tree --locked `
            --python-version 3.12 `
            --python-platform x86_64-pc-windows-msvc `
            | Tee-Object -FilePath windows-tree.txt

          $triton = Select-String -Path windows-tree.txt -Pattern '(?i)\btriton\b'
          if ($triton) {
            $triton | ForEach-Object { Write-Host $_.Line }
            throw "native Windows dependency tree unexpectedly selects Triton"
          }
          Write-Host "windows_triton_selected=false"

      - name: Build wheel on native Windows
        run: |
          uv build --wheel
          $wheels = @(Get-ChildItem -Path dist -Filter *.whl)
          if ($wheels.Count -ne 1) {
            throw "expected exactly one wheel, found $($wheels.Count)"
          }
          Write-Host "wheel=$($wheels[0].FullName)"

      - name: Install wheel without dependencies and import package
        run: |
          uv venv .venv-portability --python $env:UV_PYTHON
          $python = ".venv-portability\Scripts\python.exe"
          $wheel = (Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1).FullName

          uv pip install --python $python --no-deps $wheel
          & $python -c "import loto; print(f'loto_version={loto.__version__}')"

      - name: Verify tracked files stayed clean
        if: ${{ always() }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  otel-devdeps-publish:
    name: Temporary TAJ-8 OpenTelemetry lock publisher
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/pytest-opentelemetry-dev-deps-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - name: Verify trusted Linux runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout exact event head with publish credential
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Gate exact one-shot head
        id: gate
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          message="$(git log -1 --pretty=%s)"
          echo "event_head=$EVENT_HEAD"
          echo "head_message=$message"
          if [[ "$message" == "ci: arm OpenTelemetry lock repair via existing workflow (#201)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Generate lock verify collection and publish
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: aab3d68f6b1557dce3d5b52dcac425f273efb82d
        run: |
          set -Eeuo pipefail

          git fetch origin main fix/pytest-opentelemetry-dev-deps-v1
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          test "$(git rev-parse origin/fix/pytest-opentelemetry-dev-deps-v1)" = "$EVENT_HEAD"

          cp uv.lock "$RUNNER_TEMP/otel-uv.lock.before"
          uv lock
          uv lock --check

          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "uv.lock"
          git diff --check

          python3 - "$RUNNER_TEMP/otel-uv.lock.before" uv.lock <<'PY'
          import sys, tomllib
          from pathlib import Path

          def inventory(path: str):
              data = tomllib.loads(Path(path).read_text(encoding='utf-8'))
              return sorted(
                  (pkg['name'], pkg.get('version'), repr(pkg.get('source')))
                  for pkg in data['package']
              )

          before = inventory(sys.argv[1])
          after = inventory(sys.argv[2])
          assert before == after, 'uv lock package/version/source inventory drifted'
          print(f'LOCK_PACKAGE_INVENTORY_COUNT={len(after)}')
          print('LOCK_PACKAGE_INVENTORY_PARITY=PASS')
          PY

          uv python install 3.13
          venv="$RUNNER_TEMP/loto-otel-devdeps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-otel-devdeps-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"

          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          uv pip check --python "$python"

          "$python" - <<'PY'
          import opentelemetry.sdk
          from opentelemetry.exporter.otlp.proto.grpc.trace_exporter import OTLPSpanExporter as GrpcExporter
          from opentelemetry.exporter.otlp.proto.http.trace_exporter import OTLPSpanExporter as HttpExporter
          print('OTEL_SDK_IMPORT=PASS')
          print('OTEL_GRPC_EXPORTER_IMPORT=PASS', GrpcExporter.__name__)
          print('OTEL_HTTP_EXPORTER_IMPORT=PASS', HttpExporter.__name__)
          PY

          "$python" -m ruff check src scripts tests
          "$python" -m ruff format --check src scripts tests
          "$python" -m compileall -q src scripts tests
          echo 'STATIC_GATES=PASS'

          "$python" -m pytest --collect-only -q --tb=short > "$RUNNER_TEMP/otel-collection.txt" 2>&1
          cat "$RUNNER_TEMP/otel-collection.txt"
          ! grep -q 'ERROR collecting' "$RUNNER_TEMP/otel-collection.txt"
          ! grep -Eq '[0-9]+ errors? during collection' "$RUNNER_TEMP/otel-collection.txt"
          echo 'PYTEST_COLLECTION_ERRORS=0'

          "$python" -m pytest -q tests/telemetry
          echo 'TELEMETRY_SUITE=PASS'

          set +e
          "$python" -m pytest -q --tb=short > "$RUNNER_TEMP/otel-full-pytest.txt" 2>&1
          full_rc=$?
          set -e
          cat "$RUNNER_TEMP/otel-full-pytest.txt"
          test "$full_rc" -ne 2
          test "$full_rc" -ne 3
          test "$full_rc" -ne 4
          test "$full_rc" -ne 5
          ! grep -q 'ERROR collecting' "$RUNNER_TEMP/otel-full-pytest.txt"
          ! grep -Eq '[0-9]+ errors? during collection' "$RUNNER_TEMP/otel-full-pytest.txt"
          echo "FULL_PYTEST_RC=$full_rc"
          echo 'FULL_PYTEST_REACHED_EXECUTION=PASS'

          git fetch origin main fix/pytest-opentelemetry-dev-deps-v1
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          test "$(git rev-parse origin/fix/pytest-opentelemetry-dev-deps-v1)" = "$EVENT_HEAD"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${#staged[@]}" -eq 1
          test "${staged[0]}" = "uv.lock"
          git commit -m "test(deps): sync OpenTelemetry dev metadata in uv lock (#201)"
          repaired_head="$(git rev-parse HEAD)"
          echo "REPAIRED_HEAD=$repaired_head"
          git push origin HEAD:fix/pytest-opentelemetry-dev-deps-v1

          rm -rf -- "$venv" "$cache" \
            "$RUNNER_TEMP/otel-uv.lock.before" \
            "$RUNNER_TEMP/otel-collection.txt" \
            "$RUNNER_TEMP/otel-full-pytest.txt"
