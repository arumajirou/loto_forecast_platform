name: windows-portability-ci

on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - README.md
      - src/**
      - .github/workflows/windows-portability-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-lock-diagnostic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-lock-diagnostic:
    name: Temporary version lock diagnostic
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/runtime-version-single-source-v2' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      EXPECTED_MAIN: "c5e822c15080becd4156639bcdb94735b1a8e7a5"
      PR178_HEAD: "b441d48f0108c3630b760f9bee88f0a348970435"

    steps:
      - name: Verify runner and checkout
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Construct repair and inspect regenerated lock
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git fetch --no-tags origin "pull/178/head:refs/remotes/origin/pr178-version-contract"
          test "$(git rev-parse refs/remotes/origin/pr178-version-contract)" = "$PR178_HEAD"
          git checkout refs/remotes/origin/pr178-version-contract -- \
            src/loto/__init__.py src/loto/api/app.py src/loto/verify/integrity.py README.md

          python3 - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"guard failed for {old!r}: {text.count(old)}")
              return text.replace(old, new, 1)

          p = Path("pyproject.toml")
          text = p.read_text(encoding="utf-8")
          text = once(text, 'version = "3.2.0"', 'dynamic = ["version"]')
          for old, new in (
              ('loto-auto-campaign = "loto.auto_campaign.cli:main"', 'loto-auto-campaign = "loto.entrypoints:auto_campaign_main"'),
              ('loto-lab = "loto.kpi_lab.cli:main"', 'loto-lab = "loto.entrypoints:kpi_lab_main"'),
              ('loto = "loto.cli:main"', 'loto = "loto.entrypoints:loto_main"'),
              ('loto3 = "loto.cli_v3:main"', 'loto3 = "loto.entrypoints:loto3_main"'),
              ('loto-integrity = "loto.verify.integrity:main"', 'loto-integrity = "loto.entrypoints:integrity_main"'),
          ):
              text = once(text, old, new)
          if 'loto-build-info = "loto.version:main"' not in text:
              a = 'loto-github-audit = "loto.github_audit.cli:main"\n'
              text = once(text, a, a + 'loto-build-info = "loto.version:main"\n')
          if "[tool.setuptools.dynamic]" not in text:
              a = "[tool.setuptools.packages.find]\n"
              text = once(text, a, '[tool.setuptools.dynamic]\nversion = {attr = "loto.version.__version__"}\n\n' + a)
          p.write_text(text, encoding="utf-8")

          p = Path("src/loto/version.py")
          text = p.read_text(encoding="utf-8")
          text = once(text,
              'def _environment_commit() -> str | None:\n    for name in ("LOTO_BUILD_GIT_COMMIT", "GITHUB_SHA"):\n        value = os.environ.get(name, "").strip()\n        if value and _GIT_SHA_PATTERN.fullmatch(value):\n            return value.lower()\n    return None\n',
              'def _environment_commit(repo_root: str | Path | None = None) -> str | None:\n    explicit = os.environ.get("LOTO_BUILD_GIT_COMMIT", "").strip()\n    if explicit and _GIT_SHA_PATTERN.fullmatch(explicit):\n        return explicit.lower()\n\n    github_sha = os.environ.get("GITHUB_SHA", "").strip()\n    if not github_sha or not _GIT_SHA_PATTERN.fullmatch(github_sha):\n        return None\n    if repo_root is None:\n        return github_sha.lower()\n\n    workspace = os.environ.get("GITHUB_WORKSPACE", "").strip()\n    if not workspace:\n        return None\n    if Path(repo_root).resolve() != Path(workspace).resolve():\n        return None\n    return github_sha.lower()\n')
          text = once(text, "    environment_value = _environment_commit()\n", "    environment_value = _environment_commit(repo_root)\n")
          p.write_text(text, encoding="utf-8")

          p = Path("src/loto/auto_campaign/cli.py")
          text = p.read_text(encoding="utf-8")
          text = once(text, "def main() -> None:\n    args = build_parser().parse_args()\n", "def main(argv: list[str] | None = None) -> None:\n    args = build_parser().parse_args(argv)\n")
          p.write_text(text, encoding="utf-8")
          PY

          cp uv.lock "$RUNNER_TEMP/uv.lock.before"
          uv lock
          git diff HEAD --check
          echo '=== uv.lock diff ==='
          git diff -- uv.lock

          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          before = tomllib.loads(Path("${RUNNER_TEMP}/uv.lock.before").read_text(encoding="utf-8"))
          after = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))
          root_name = "loto-forecast-platform"
          before_packages = before["package"]
          after_packages = after["package"]
          before_nonroot = [p for p in before_packages if p.get("name") != root_name]
          after_nonroot = [p for p in after_packages if p.get("name") != root_name]
          if before_nonroot != after_nonroot:
              raise SystemExit("non-root package graph changed")
          before_root = [p for p in before_packages if p.get("name") == root_name]
          after_root = [p for p in after_packages if p.get("name") == root_name]
          if len(before_root) != 1 or len(after_root) != 1:
              raise SystemExit("unexpected root package cardinality")
          b, a = before_root[0], after_root[0]
          print(f"root_version_before={b.get('version')}")
          print(f"root_version_after={a.get('version')}")
          for key in ("dependencies", "optional-dependencies", "dev-dependencies"):
              if b.get(key) != a.get(key):
                  raise SystemExit(f"root {key} changed")
          before_meta = b.get("metadata", {})
          after_meta = a.get("metadata", {})
          if before_meta.get("requires-dist") != after_meta.get("requires-dist"):
              raise SystemExit("root requires-dist changed")
          print("nonroot_package_graph=IDENTICAL")
          print("root_dependency_graph=IDENTICAL")
          print("lock_regeneration_scope=ROOT_VERSION_METADATA_ONLY_OR_EQUIVALENT")
          PY
