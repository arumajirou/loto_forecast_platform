name: windows-portability-ci

on:
  pull_request:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/windows-portability-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kdpp-target-execution-export-verifier:
    name: Temporary k-DPP target-execution export verifier
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/runtime-kdpp-target-execution-exports-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_MAIN: "78acbdf673e4104613d9234d174a6023fc9e1d31"
      EXPECTED_SOURCE_BLOB: "d30b23ebc7775898ddd2d8e0ce50ef7ad3d4cd89"

    steps:
      - name: Verify trusted Linux runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact main and source blob
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:src/loto/probabilistic/kdpp_target_execution.py)" = "$EXPECTED_SOURCE_BLOB"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare isolated verifier environment
        run: |
          set -Eeuo pipefail
          case "$(uv --version)" in "uv $UV_VERSION"*) ;; *) exit 1 ;; esac
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/kdpp-export-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/kdpp-export-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$venv" "$cache"
          mkdir -p -- "$cache"
          echo "VERIFIER_VENV=$venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$cache" uv venv "$venv" --python "$UV_PYTHON"

      - name: Install CPU Torch and project dependencies
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          uv pip install --quiet --python "$python" --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          uv pip install --quiet --python "$python" -e ".[api,dev,postgres]"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)
          versions = [p["version"] for p in lock["package"] if p.get("name") == "ruff"]
          if len(versions) != 1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          uv pip install --quiet --python "$python" "ruff==$ruff_version"
          uv pip check --python "$python"

      - name: Run repository static gates
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          "$python" -m ruff format --check src scripts tests
          "$python" -m ruff check src scripts tests
          "$python" -m compileall -q src scripts tests

      - name: Run focused k-DPP target-execution tests
        run: |
          set -Eeuo pipefail
          "$VERIFIER_VENV/bin/python" -m pytest -q tests/probabilistic/test_ppl02_k_dpp_target_execution.py

      - name: Verify collection remains zero-error
        run: |
          set -Eeuo pipefail
          "$VERIFIER_VENV/bin/python" -m pytest --collect-only -q >/dev/null

      - name: Re-measure full pytest runtime debt
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/kdpp-full-pytest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          echo "FULL_PYTEST_OUTPUT=$out" >> "$GITHUB_ENV"
          set +e
          "$VERIFIER_VENV/bin/python" -m pytest -q --tb=short 2>&1 | tee "$out"
          rc="${PIPESTATUS[0]}"
          set -e
          if [[ "$rc" -ne 0 && "$rc" -ne 1 ]]; then exit "$rc"; fi

      - name: Recheck source and main identity
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD:src/loto/probabilistic/kdpp_target_execution.py)" = "$EXPECTED_SOURCE_BLOB"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload temporary full-pytest comparison artifact
        if: ${{ always() && env.FULL_PYTEST_OUTPUT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kdpp-full-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_PYTEST_OUTPUT }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove verifier-owned environment
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${VERIFIER_VENV:-}" ]]; then case "$VERIFIER_VENV" in "$RUNNER_TEMP"/*) rm -rf -- "$VERIFIER_VENV" ;; *) exit 1 ;; esac; fi
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf -- "$UV_CACHE_DIR" ;; *) exit 1 ;; esac; fi
