name: windows-portability-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - docs/WINDOWS_INSTALL.md
      - .github/workflows/windows-portability-ci.yml
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/windows-portability-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portability:
    name: Native Windows dependency and package smoke
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.12.13"

    steps:
      - name: Verify expected native Windows self-hosted runner
        run: |
          Write-Host "runner_name=${{ runner.name }}"
          Write-Host "runner_os=${{ runner.os }}"
          Write-Host "runner_arch=${{ runner.arch }}"
          if ("${{ runner.name }}" -ne "az-loto-windows") {
            throw "unexpected self-hosted runner: ${{ runner.name }}"
          }
          if ("${{ runner.os }}" -ne "Windows") {
            throw "unexpected runner OS: ${{ runner.os }}"
          }
          if ("${{ runner.arch }}" -ne "X64") {
            throw "unexpected runner architecture: ${{ runner.arch }}"
          }
          Write-Host "native_windows_self_hosted_runner=PASS"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Verify uv and install managed Python
        run: |
          $actual = (uv --version).Trim()
          Write-Host "uv_version=$actual"
          $parts = @($actual -split '\s+')
          if ($parts.Count -lt 2 -or $parts[0] -ne "uv" -or $parts[1] -ne $env:UV_VERSION) {
            throw "unexpected uv version: $actual"
          }

          uv python install $env:UV_PYTHON
          $python = (uv python find $env:UV_PYTHON).Trim()
          Write-Host "python_path=$python"
          & $python --version

      - name: Validate committed universal lock
        run: |
          uv lock --check

          $python = (uv python find $env:UV_PYTHON).Trim()
          @'
          import tomllib

          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)

          packages = lock.get("package", [])
          root = next(p for p in packages if p.get("name") == "loto-forecast-platform")
          root_dependencies = root.get("dependencies", [])
          assert not any(d.get("name") == "triton" for d in root_dependencies), root_dependencies

          root_metadata = root.get("metadata", {})
          requires_dist = root_metadata.get("requires-dist", [])
          assert not any(d.get("name") == "triton" for d in requires_dist), requires_dist

          torch = next(
              p for p in packages
              if p.get("name") == "torch" and p.get("version") == "2.9.1"
          )
          triton_edges = [
              d for d in torch.get("dependencies", [])
              if d.get("name") == "triton"
          ]
          expected_marker = "platform_machine == 'x86_64' and sys_platform == 'linux'"
          assert len(triton_edges) == 1, triton_edges
          assert triton_edges[0].get("marker") == expected_marker, triton_edges

          print("root_direct_triton=false")
          print("torch_triton_linux_x86_64_marker=PASS")
          '@ | & $python -

      - name: Resolve native Windows dependencies without installation
        run: |
          uv sync --dry-run --locked --python $env:UV_PYTHON
          uv tree --locked `
            --python-version 3.12 `
            --python-platform x86_64-pc-windows-msvc `
            | Tee-Object -FilePath windows-tree.txt

          $triton = Select-String -Path windows-tree.txt -Pattern '(?i)\btriton\b'
          if ($triton) {
            $triton | ForEach-Object { Write-Host $_.Line }
            throw "native Windows dependency tree unexpectedly selects Triton"
          }
          Write-Host "windows_triton_selected=false"

      - name: Build wheel on native Windows
        run: |
          uv build --wheel
          $wheels = @(Get-ChildItem -Path dist -Filter *.whl)
          if ($wheels.Count -ne 1) {
            throw "expected exactly one wheel, found $($wheels.Count)"
          }
          Write-Host "wheel=$($wheels[0].FullName)"

      - name: Install wheel without dependencies and import package
        run: |
          uv venv .venv-portability --python $env:UV_PYTHON
          $python = ".venv-portability\Scripts\python.exe"
          $wheel = (Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1).FullName

          uv pip install --python $python --no-deps $wheel
          & $python -c "import loto; print(f'loto_version={loto.__version__}')"

      - name: Verify tracked files stayed clean
        if: ${{ always() }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  auto-campaign-cli-recovery-verifier:
    name: Temporary AutoCampaign CLI recovery verifier
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/runtime-auto-campaign-cli-recovery-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 120

    defaults:
      run:
        shell: bash

    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_MAIN: "fdab93a7b090e958086fde1d3f0461f9596b3d29"
      EXPECTED_CLI_BLOB: "17d52cde028a997fc04ceca66ad1c468750ac2ca"

    steps:
      - name: Verify expected trusted Linux runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact base and recovered CLI blob
        run: |
          set -Eeuo pipefail
          actual_blob="$(git rev-parse HEAD:src/loto/auto_campaign/cli.py)"
          echo "cli_blob=$actual_blob"
          test "$actual_blob" = "$EXPECTED_CLI_BLOB"
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          echo "main_sha=$actual_main"
          test "$actual_main" = "$EXPECTED_MAIN"

      - name: Install exact uv without GitHub cache
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare isolated verifier environment
        run: |
          set -Eeuo pipefail
          actual="$(uv --version)"
          case "$actual" in
            "uv $UV_VERSION"*) ;;
            *) echo "unexpected uv version: $actual" >&2; exit 1 ;;
          esac
          uv python install "$UV_PYTHON"
          verifier_venv="$RUNNER_TEMP/auto-cli-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          verifier_cache="$RUNNER_TEMP/auto-cli-uv-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$verifier_venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$verifier_cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$verifier_venv" "$verifier_cache"
          mkdir -p -- "$verifier_cache"
          echo "VERIFIER_VENV=$verifier_venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$verifier_cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$verifier_cache" uv venv "$verifier_venv" --python "$UV_PYTHON"
          "$verifier_venv/bin/python" --version

      - name: Install matching CPU-only PyTorch
        run: |
          set -Eeuo pipefail
          uv pip install --quiet --python "$VERIFIER_VENV/bin/python" \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.9.1"

      - name: Install project and test dependencies
        run: |
          set -Eeuo pipefail
          uv pip install --quiet --python "$VERIFIER_VENV/bin/python" -e ".[api,dev,postgres]"
          ruff_version="$(
            "$VERIFIER_VENV/bin/python" - <<'PY'
          import tomllib
          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)
          versions = [p["version"] for p in lock["package"] if p.get("name") == "ruff"]
          if len(versions) != 1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          uv pip install --quiet --python "$VERIFIER_VENV/bin/python" "ruff==$ruff_version"
          uv pip check --python "$VERIFIER_VENV/bin/python"

      - name: Run repository static gates
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          "$python" -m ruff format --check src scripts tests
          "$python" -m ruff check src scripts tests
          "$python" -m compileall -q src scripts tests

      - name: Run focused AutoCampaign CLI regression cluster
        run: |
          set -Eeuo pipefail
          "$VERIFIER_VENV/bin/python" -m pytest -q \
            tests/auto_campaign/test_lineage_cli.py \
            tests/auto_campaign/test_promotion_gate_cli.py \
            tests/auto_campaign/test_portable_artifact_cli.py \
            tests/auto_campaign/test_prospective_registry_cli.py \
            tests/auto_campaign/test_prospective_registry_reconciliation_cli.py \
            tests/auto_campaign/test_prospective_scoring_cli.py

      - name: Verify full-suite collection remains zero-error
        run: |
          set -Eeuo pipefail
          "$VERIFIER_VENV/bin/python" -m pytest --collect-only -q >/dev/null

      - name: Re-measure full pytest runtime debt
        run: |
          set -uo pipefail
          pytest_output="$RUNNER_TEMP/auto-cli-full-pytest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          echo "FULL_PYTEST_OUTPUT=$pytest_output" >> "$GITHUB_ENV"
          set +e
          "$VERIFIER_VENV/bin/python" -m pytest -q --tb=short 2>&1 | tee "$pytest_output"
          pytest_rc="${PIPESTATUS[0]}"
          set -e
          echo "FULL_PYTEST_RC=$pytest_rc" >> "$GITHUB_ENV"
          if [[ "$pytest_rc" -ne 0 && "$pytest_rc" -ne 1 ]]; then
            exit "$pytest_rc"
          fi

      - name: Recheck main and recovered source identity
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD:src/loto/auto_campaign/cli.py)" = "$EXPECTED_CLI_BLOB"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload temporary full-pytest comparison artifact
        if: ${{ always() && env.FULL_PYTEST_OUTPUT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auto-cli-full-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_PYTEST_OUTPUT }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove verifier-owned temporary environment
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${VERIFIER_VENV:-}" ]]; then
            case "$VERIFIER_VENV" in "$RUNNER_TEMP"/*) rm -rf -- "$VERIFIER_VENV" ;; *) exit 1 ;; esac
          fi
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then
            case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf -- "$UV_CACHE_DIR" ;; *) exit 1 ;; esac
          fi
