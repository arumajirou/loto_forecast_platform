name: windows-portability-ci

on:
  pull_request:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - docs/WINDOWS_INSTALL.md
      - .github/workflows/windows-portability-ci.yml
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - uv.lock
      - src/**
      - .github/workflows/windows-portability-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-portability:
    name: Native Windows dependency and package smoke
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45

    defaults:
      run:
        shell: pwsh

    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.12.13"

    steps:
      - name: Verify expected native Windows self-hosted runner
        run: |
          Write-Host "runner_name=${{ runner.name }}"
          Write-Host "runner_os=${{ runner.os }}"
          Write-Host "runner_arch=${{ runner.arch }}"
          if ("${{ runner.name }}" -ne "az-loto-windows") { throw "unexpected self-hosted runner: ${{ runner.name }}" }
          if ("${{ runner.os }}" -ne "Windows") { throw "unexpected runner OS: ${{ runner.os }}" }
          if ("${{ runner.arch }}" -ne "X64") { throw "unexpected runner architecture: ${{ runner.arch }}" }
          Write-Host "native_windows_self_hosted_runner=PASS"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Verify uv and install managed Python
        run: |
          $actual = (uv --version).Trim()
          Write-Host "uv_version=$actual"
          $parts = @($actual -split '\s+')
          if ($parts.Count -lt 2 -or $parts[0] -ne "uv" -or $parts[1] -ne $env:UV_VERSION) { throw "unexpected uv version: $actual" }
          uv python install $env:UV_PYTHON
          $python = (uv python find $env:UV_PYTHON).Trim()
          Write-Host "python_path=$python"
          & $python --version

      - name: Validate committed universal lock
        run: |
          uv lock --check
          $python = (uv python find $env:UV_PYTHON).Trim()
          @'
          import tomllib
          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)
          packages = lock.get("package", [])
          root = next(p for p in packages if p.get("name") == "loto-forecast-platform")
          root_dependencies = root.get("dependencies", [])
          assert not any(d.get("name") == "triton" for d in root_dependencies), root_dependencies
          root_metadata = root.get("metadata", {})
          requires_dist = root_metadata.get("requires-dist", [])
          assert not any(d.get("name") == "triton" for d in requires_dist), requires_dist
          torch = next(p for p in packages if p.get("name") == "torch" and p.get("version") == "2.9.1")
          triton_edges = [d for d in torch.get("dependencies", []) if d.get("name") == "triton"]
          expected_marker = "platform_machine == 'x86_64' and sys_platform == 'linux'"
          assert len(triton_edges) == 1, triton_edges
          assert triton_edges[0].get("marker") == expected_marker, triton_edges
          print("root_direct_triton=false")
          print("torch_triton_linux_x86_64_marker=PASS")
          '@ | & $python -

      - name: Resolve native Windows dependencies without installation
        run: |
          uv sync --dry-run --locked --python $env:UV_PYTHON
          uv tree --locked --python-version 3.12 --python-platform x86_64-pc-windows-msvc | Tee-Object -FilePath windows-tree.txt
          $triton = Select-String -Path windows-tree.txt -Pattern '(?i)\btriton\b'
          if ($triton) { $triton | ForEach-Object { Write-Host $_.Line }; throw "native Windows dependency tree unexpectedly selects Triton" }
          Write-Host "windows_triton_selected=false"

      - name: Build wheel on native Windows
        run: |
          uv build --wheel
          $wheels = @(Get-ChildItem -Path dist -Filter *.whl)
          if ($wheels.Count -ne 1) { throw "expected exactly one wheel, found $($wheels.Count)" }
          Write-Host "wheel=$($wheels[0].FullName)"

      - name: Install wheel without dependencies and import package
        run: |
          uv venv .venv-portability --python $env:UV_PYTHON
          $python = ".venv-portability\Scripts\python.exe"
          $wheel = (Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1).FullName
          uv pip install --python $python --no-deps $wheel
          & $python -c "import loto; print(f'loto_version={loto.__version__}')"

      - name: Verify tracked files stayed clean
        if: ${{ always() }}
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  kdpp-target-execution-export-verifier:
    name: Temporary k-DPP target-execution export verifier
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/runtime-kdpp-target-execution-exports-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_MAIN: "78acbdf673e4104613d9234d174a6023fc9e1d31"
      EXPECTED_SOURCE_BLOB: "a01bddb614df616b374e3f86fffa4f78b40926de"

    steps:
      - name: Verify trusted Linux runner and exact source
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout without persistent credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact main and source blob
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:src/loto/probabilistic/kdpp_target_execution.py)" = "$EXPECTED_SOURCE_BLOB"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Prepare isolated verifier environment
        run: |
          set -Eeuo pipefail
          case "$(uv --version)" in "uv $UV_VERSION"*) ;; *) exit 1 ;; esac
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/kdpp-export-venv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/kdpp-export-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$venv" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          case "$cache" in "$RUNNER_TEMP"/*) ;; *) exit 1 ;; esac
          rm -rf -- "$venv" "$cache"
          mkdir -p -- "$cache"
          echo "VERIFIER_VENV=$venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$cache" uv venv "$venv" --python "$UV_PYTHON"

      - name: Install CPU Torch and project dependencies
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          uv pip install --quiet --python "$python" --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          uv pip install --quiet --python "$python" -e ".[api,dev,postgres]"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open("uv.lock", "rb") as stream:
              lock = tomllib.load(stream)
          versions = [p["version"] for p in lock["package"] if p.get("name") == "ruff"]
          if len(versions) != 1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          uv pip install --quiet --python "$python" "ruff==$ruff_version"
          uv pip check --python "$python"

      - name: Run repository static gates
        run: |
          set -Eeuo pipefail
          python="$VERIFIER_VENV/bin/python"
          "$python" -m ruff format --check src scripts tests
          "$python" -m ruff check src scripts tests
          "$python" -m compileall -q src scripts tests

      - name: Run focused k-DPP target-execution tests
        run: |
          set -Eeuo pipefail
          "$VERIFIER_VENV/bin/python" -m pytest -q tests/probabilistic/test_ppl02_k_dpp_target_execution.py

      - name: Verify collection remains zero-error
        run: |
          set -Eeuo pipefail
          "$VERIFIER_VENV/bin/python" -m pytest --collect-only -q >/dev/null

      - name: Re-measure full pytest runtime debt
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/kdpp-full-pytest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          echo "FULL_PYTEST_OUTPUT=$out" >> "$GITHUB_ENV"
          set +e
          "$VERIFIER_VENV/bin/python" -m pytest -q --tb=short 2>&1 | tee "$out"
          rc="${PIPESTATUS[0]}"
          set -e
          echo "FULL_PYTEST_RC=$rc" >> "$GITHUB_ENV"
          if [[ "$rc" -ne 0 && "$rc" -ne 1 ]]; then exit "$rc"; fi

      - name: Recheck source and main identity
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD:src/loto/probabilistic/kdpp_target_execution.py)" = "$EXPECTED_SOURCE_BLOB"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload temporary full-pytest comparison artifact
        if: ${{ always() && env.FULL_PYTEST_OUTPUT != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kdpp-full-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FULL_PYTEST_OUTPUT }}
          if-no-files-found: error
          retention-days: 1

      - name: Remove verifier-owned environment
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${VERIFIER_VENV:-}" ]]; then case "$VERIFIER_VENV" in "$RUNNER_TEMP"/*) rm -rf -- "$VERIFIER_VENV" ;; *) exit 1 ;; esac; fi
          if [[ -n "${UV_CACHE_DIR:-}" ]]; then case "$UV_CACHE_DIR" in "$RUNNER_TEMP"/*) rm -rf -- "$UV_CACHE_DIR" ;; *) exit 1 ;; esac; fi
