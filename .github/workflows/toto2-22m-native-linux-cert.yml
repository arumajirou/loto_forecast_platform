name: Toto 2.0 22M native Linux certification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toto2-22m-native-linux-cert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    name: Pinned 22M native Linux CUDA certification
    if: ${{ github.actor == github.repository_owner }}
    runs-on: [self-hosted, Linux, X64, loto-ci, gpu, cuda, native-linux]
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.12"
      PYTHONUNBUFFERED: "1"
      CUDA_VISIBLE_DEVICES: "0"
      EVIDENCE_DIR: artifacts/toto2-22m-native-linux-cert

    steps:
      - name: Verify native Linux runner
        run: |
          set -Eeuo pipefail
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"
          echo "runner_arch=$RUNNER_ARCH"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"
          if grep -Eiq 'microsoft|wsl' /proc/sys/kernel/osrelease /proc/version; then
            echo "BLOCKED: WSL is not eligible for formal native-Linux certification" >&2
            exit 1
          fi
          nvidia-smi --query-gpu=index,uuid,name --format=csv,noheader,nounits
          nvidia-smi --query-compute-apps=pid,gpu_uuid,used_gpu_memory --format=csv,noheader,nounits \
            > /tmp/toto2-native-linux-preflight-compute-apps.csv

      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true

      - name: Prepare evidence paths
        run: |
          set -Eeuo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cp /tmp/toto2-native-linux-preflight-compute-apps.csv \
            "$EVIDENCE_DIR/preflight-compute-apps.csv"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "ref=${GITHUB_REF}" \
            "sha=${GITHUB_SHA}" \
            "runner_name=${RUNNER_NAME}" \
            "runner_os=${RUNNER_OS}" \
            "runner_arch=${RUNNER_ARCH}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            > "$EVIDENCE_DIR/run-context.txt"
          uname -a > "$EVIDENCE_DIR/uname.txt"
          cat /proc/sys/kernel/osrelease > "$EVIDENCE_DIR/kernel-osrelease.txt"
          nvidia-smi > "$EVIDENCE_DIR/nvidia-smi.txt"
          nvidia-smi --query-gpu=index,uuid,name,driver_version \
            --format=csv,noheader,nounits > "$EVIDENCE_DIR/gpu-identity.csv"
          printf 'RUNTIME_VENV=%s\n' "$RUNNER_TEMP/toto2-22m-native-linux-venv" >> "$GITHUB_ENV"
          printf 'HF_CACHE=%s\n' "$RUNNER_TEMP/toto2-22m-native-linux-hf" >> "$GITHUB_ENV"
          printf 'UV_CACHE_DIR=%s\n' "$RUNNER_TEMP/toto2-22m-native-linux-uv-cache" >> "$GITHUB_ENV"

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Build isolated Python 3.12 runtime
        run: |
          set -Eeuo pipefail
          rm -rf -- "$RUNTIME_VENV" "$HF_CACHE" "$UV_CACHE_DIR"
          mkdir -p "$HF_CACHE" "$UV_CACHE_DIR"
          uv python install "$UV_PYTHON"
          uv venv "$RUNTIME_VENV" --python "$UV_PYTHON"
          python="$RUNTIME_VENV/bin/python"
          "$python" --version | tee "$EVIDENCE_DIR/python-version.txt"
          uv --version | tee "$EVIDENCE_DIR/uv-version.txt"

          uv pip install \
            --python "$python" \
            --index-url https://download.pytorch.org/whl/cu130 \
            "torch==2.13.0" \
            2>&1 | tee "$EVIDENCE_DIR/install-torch.log"

          uv pip install \
            --python "$python" \
            --index-url https://pypi.org/simple \
            "numpy>=2,<3" \
            "huggingface-hub>=0.34,<2" \
            "toto-models==1.0.0" \
            "toto-2==2.0.0" \
            "pytest==9.1.1" \
            "ruff==0.16.1" \
            2>&1 | tee "$EVIDENCE_DIR/install-runtime.log"

          uv pip check --python "$python" | tee "$EVIDENCE_DIR/pip-check.txt"
          uv pip freeze --python "$python" > "$EVIDENCE_DIR/pip-freeze.txt"

      - name: Focused quality gates
        run: |
          set -Eeuo pipefail
          python="$RUNTIME_VENV/bin/python"
          paths=(
            src/loto/toto2_campaign/variant_probe.py
            scripts/probe_toto2_22m_runtime.py
            scripts/certify_toto2_22m_native_linux.py
            tests/toto2_campaign/test_variant_probe.py
            tests/toto2_campaign/test_native_linux_certification.py
          )
          "$python" -m ruff format --check "${paths[@]}"
          "$python" -m ruff check "${paths[@]}"
          "$python" -m compileall -q "${paths[@]}"
          PYTHONPATH=src "$python" -m pytest -q \
            tests/toto2_campaign/test_variant_probe.py \
            tests/toto2_campaign/test_native_linux_certification.py

      - name: CUDA preflight
        run: |
          set -Eeuo pipefail
          python="$RUNTIME_VENV/bin/python"
          PYTHONPATH=src "$python" - <<'PY' | tee "$EVIDENCE_DIR/cuda-preflight.txt"
          import importlib.metadata
          from pathlib import Path

          import torch

          osrelease = Path("/proc/sys/kernel/osrelease").read_text(encoding="utf-8").strip()
          print(f"kernel_osrelease={osrelease}")
          print(f"torch={torch.__version__}")
          print(f"torch_cuda={torch.version.cuda}")
          print(f"cuda_available={torch.cuda.is_available()}")
          print(f"toto_2={importlib.metadata.version('toto-2')}")
          print(f"toto_models={importlib.metadata.version('toto-models')}")
          assert "microsoft" not in osrelease.lower()
          assert "wsl" not in osrelease.lower()
          assert torch.__version__.startswith("2.13.0")
          assert torch.version.cuda == "13.0"
          assert torch.cuda.is_available()
          PY

      - name: Run native Linux certification
        run: |
          set -Eeuo pipefail
          python="$RUNTIME_VENV/bin/python"
          rm -rf -- "$EVIDENCE_DIR/certification"
          PYTHONPATH=src "$python" scripts/certify_toto2_22m_native_linux.py \
            --output "$EVIDENCE_DIR/certification" \
            --cache-dir "$HF_CACHE" \
            --seed 1 \
            2>&1 | tee "$EVIDENCE_DIR/native-certification.log"

      - name: Assert formal evidence PASS without enabling routing
        run: |
          set -Eeuo pipefail
          python="$RUNTIME_VENV/bin/python"
          "$python" - "$EVIDENCE_DIR/certification/CERTIFICATION.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["status"] == "PASS"
          assert payload["external_gpu_pid_captured"] is True
          assert payload["post_exit_gpu_release_certified"] is True
          assert payload["formal_runtime_certified"] is True
          assert payload["manifest_runtime_certified_update_allowed"] is True
          assert payload["shared_routing_allowed"] is False
          assert payload["accuracy_certified"] is False
          assert payload["holdout_open"] is False
          assert payload["prospective_open"] is False
          assert payload["certification_blockers"] == []
          PY

      - name: Verify tracked files stayed clean
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload native certification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: toto2-22m-native-linux-cert-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/toto2-22m-native-linux-cert/
          if-no-files-found: error
          retention-days: 30

      - name: Remove transient runtime
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          rm -rf -- "$RUNTIME_VENV" "$HF_CACHE" "$UV_CACHE_DIR"
          rm -f -- /tmp/toto2-native-linux-preflight-compute-apps.csv
