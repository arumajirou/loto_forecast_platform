name: e402-bootstrap-exceptions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/ruff-lint-e402-import-order-v1' }}
    runs-on: [self-hosted, Linux, X64, loto-ci]
    timeout-minutes: 180
    env:
      TARGET_BRANCH: fix/ruff-lint-e402-import-order-v1
      UV_VERSION: "0.11.21"
      UV_PYTHON: "3.13"
      EXPECTED_RUFF_VERSION: "0.16.0"
      BASELINE_COLLECTION_ERRORS: "34"
      EXPECTED_REMAINING_LINT: "106"
      RESULT_PATH: .github/ruff-e402-repair.txt
    steps:
      - name: Verify trusted runner
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: fix/ruff-lint-e402-import-order-v1
          persist-credentials: true
          fetch-depth: 1
          clean: true

      - name: Gate repair trigger
        id: gate
        run: |
          set -Eeuo pipefail
          message="$(git log -1 --pretty=%s)"
          echo "head_message=$message"
          if [[ "$message" == "ci: apply explicit Ruff E402 bootstrap exceptions (#200)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Apply file-level E402 exceptions and verify AST identity
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          uv python install "$UV_PYTHON"
          venv="$RUNNER_TEMP/loto-e402-repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-e402-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache"
          mkdir -p "$cache"
          uv venv "$venv" --python "$UV_PYTHON"
          echo "CI_VENV=$venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          python="$venv/bin/python"
          ruff_version="$("$python" - <<'PY'
          import tomllib
          with open('uv.lock','rb') as f:
              lock=tomllib.load(f)
          versions=[p['version'] for p in lock['package'] if p.get('name')=='ruff']
          if len(versions)!=1:
              raise SystemExit(versions)
          print(versions[0])
          PY
          )"
          test "$ruff_version" = "$EXPECTED_RUFF_VERSION"
          echo "RUFF_VERSION=$ruff_version" >> "$GITHUB_ENV"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" "ruff==$ruff_version"

          files=(
            scripts/commit_trusted_vertical_slice.py
            scripts/generate_tirex2_lock_candidate.py
            scripts/install_reviewed_tirex2_lock.py
            scripts/preflight_tirex2_runtime_lane.py
            scripts/run_darts_provider.py
            scripts/run_formal_model_backtest_with_ledger.py
            scripts/run_timer_base_84m_provider.py
            scripts/run_tirex2_provider.py
            scripts/run_trusted_vertical_slice_with_ledger.py
            tests/gluonts_campaign/test_p5_serialization_runtime.py
            tests/gluonts_campaign/test_p6_runtime.py
            tests/gluonts_campaign/test_p7b_supervisor.py
            tests/hierarchicalforecast_target_fixtures.py
            tests/run_lifecycle/test_hypothesis_properties.py
            tests/test_reconciliation_quality_gate.py
            tests/test_reconciliation_target_machine_certification.py
            tests/test_reconciliation_target_operator.py
          )
          printf '%s\n' "${files[@]}" > "$RUNNER_TEMP/e402-files.txt"

          "$python" - "$RUNNER_TEMP/e402-files.txt" "$RUNNER_TEMP/ast-before.json" <<'PY'
          import ast, hashlib, json, sys
          from pathlib import Path
          files=[line.strip() for line in Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          out={}
          for name in files:
              source=Path(name).read_text(encoding='utf-8')
              tree=ast.parse(source, filename=name)
              dump=ast.dump(tree, include_attributes=False)
              out[name]=hashlib.sha256(dump.encode()).hexdigest()
          Path(sys.argv[2]).write_text(json.dumps(out, sort_keys=True), encoding='utf-8')
          PY

          "$python" - "$RUNNER_TEMP/e402-files.txt" <<'PY'
          import re, sys
          from pathlib import Path
          files=[line.strip() for line in Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          pragma="# ruff: noqa: E402"
          coding=re.compile(r"coding[:=]\s*[-\w.]+")
          for name in files:
              path=Path(name)
              text=path.read_text(encoding='utf-8')
              if pragma in text.splitlines()[:5]:
                  raise SystemExit(f"{name}: E402 pragma already present")
              lines=text.splitlines(keepends=True)
              index=0
              if lines and lines[0].startswith("#!"):
                  index=1
              if index < len(lines) and coding.search(lines[index]):
                  index += 1
              lines.insert(index, pragma + "\n")
              path.write_text("".join(lines), encoding='utf-8')
          PY

          mapfile -t observed < <(git diff --name-only | sort)
          mapfile -t expected < <(sort "$RUNNER_TEMP/e402-files.txt")
          test "${#observed[@]}" -eq 17
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${observed[@]}")
          git diff --check

          "$python" - "$RUNNER_TEMP/e402-files.txt" "$RUNNER_TEMP/ast-before.json" <<'PY'
          import ast, hashlib, json, sys
          from pathlib import Path
          files=[line.strip() for line in Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          before=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          for name in files:
              source=Path(name).read_text(encoding='utf-8')
              dump=ast.dump(ast.parse(source, filename=name), include_attributes=False)
              after=hashlib.sha256(dump.encode()).hexdigest()
              if after != before[name]:
                  raise SystemExit(f"AST changed: {name}")
          print(f"AST_EQUIVALENT_FILES={len(files)}")
          PY
          echo "AST_RC=0" >> "$GITHUB_ENV"

      - name: Verify static gates
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          "$python" -m ruff check --select E402 src scripts tests
          "$python" -m ruff format --check $(cat "$RUNNER_TEMP/e402-files.txt")
          "$python" -m compileall -q src scripts tests
          echo "STATIC_RC=0" >> "$GITHUB_ENV"

      - name: Install project dependencies
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" \
            --index-url https://download.pytorch.org/whl/cpu "torch==2.9.1"
          UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" -e ".[api,dev,postgres]"
          UV_CACHE_DIR="$UV_CACHE_DIR" uv pip install --quiet --python "$python" "ruff==$EXPECTED_RUFF_VERSION"
          uv pip check --python "$python"
          "$python" - <<'PY'
          import torch
          assert torch.__version__.startswith("2.9.1"), torch.__version__
          assert torch.version.cuda is None, torch.version.cuda
          PY
          echo "DEPS_RC=0" >> "$GITHUB_ENV"

      - name: Verify collection parity and residual lint
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          python="$CI_VENV/bin/python"
          set +e
          "$python" -m pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1
          PYTEST_RC=$?
          "$python" -m ruff check --output-format=json src scripts tests > "$RUNNER_TEMP/all-lint.json"
          ALL_LINT_RC=$?
          set -e
          if grep -Fq "Interrupted: $BASELINE_COLLECTION_ERRORS errors during collection" "$RUNNER_TEMP/pytest.log"; then
            COLLECTION_PARITY=1
          else
            COLLECTION_PARITY=0
          fi
          "$python" - "$RUNNER_TEMP/all-lint.json" <<'PY' > "$RUNNER_TEMP/lint.env"
          import collections, json, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8') or '[]')
          counts=collections.Counter(row.get('code','UNKNOWN') for row in rows)
          print(f"REMAINING_LINT_COUNT={len(rows)}")
          print("REMAINING_RULE_COUNTS=" + ",".join(f"{k}:{v}" for k,v in sorted(counts.items())))
          PY
          source "$RUNNER_TEMP/lint.env"
          cat "$RUNNER_TEMP/lint.env"
          echo "PYTEST_RC=$PYTEST_RC" >> "$GITHUB_ENV"
          echo "COLLECTION_PARITY=$COLLECTION_PARITY" >> "$GITHUB_ENV"
          echo "REMAINING_LINT_COUNT=$REMAINING_LINT_COUNT" >> "$GITHUB_ENV"
          echo "REMAINING_RULE_COUNTS=$REMAINING_RULE_COUNTS" >> "$GITHUB_ENV"
          test "$COLLECTION_PARITY" -eq 1
          test "$REMAINING_LINT_COUNT" -eq "$EXPECTED_REMAINING_LINT"

      - name: Commit verified E402 exceptions
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          before="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(cat "$RUNNER_TEMP/e402-files.txt")
          git diff --cached --check
          git commit -m "style: document intentional Ruff E402 bootstrap imports (#200)"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$before"
          git push origin "HEAD:$TARGET_BRANCH"
          echo "REPAIRED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Persist evidence
        if: ${{ steps.gate.outputs.run == 'true' && env.REPAIRED_HEAD != '' }}
        run: |
          set -Eeuo pipefail
          cat > "$RESULT_PATH" <<EOF
          RUFF_E402_REPAIR_VERSION=1
          RUN_ID=$GITHUB_RUN_ID
          RUFF_VERSION=${RUFF_VERSION:-UNKNOWN}
          REPAIRED_HEAD=${REPAIRED_HEAD:-UNKNOWN}
          INTENTIONAL_EXCEPTION_FILES=17
          INTENTIONAL_E402_FINDINGS=37
          AST_RC=${AST_RC:-UNKNOWN}
          STATIC_RC=${STATIC_RC:-UNKNOWN}
          DEPS_RC=${DEPS_RC:-UNKNOWN}
          PYTEST_RC=${PYTEST_RC:-UNKNOWN}
          COLLECTION_PARITY=${COLLECTION_PARITY:-UNKNOWN}
          REMAINING_LINT_COUNT=${REMAINING_LINT_COUNT:-UNKNOWN}
          REMAINING_RULE_COUNTS=${REMAINING_RULE_COUNTS:-UNKNOWN}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_PATH"
          git commit -m "chore: capture Ruff E402 verification evidence (#200)"
          remote_before="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_before" = "$(git rev-parse HEAD^)"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Enforce gates
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -Eeuo pipefail
          test "${AST_RC:-99}" -eq 0
          test "${STATIC_RC:-99}" -eq 0
          test "${DEPS_RC:-99}" -eq 0
          test "${COLLECTION_PARITY:-0}" -eq 1
          test "${REMAINING_LINT_COUNT:-999}" -eq "$EXPECTED_REMAINING_LINT"

      - name: Cleanup
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          [[ -z "${CI_VENV:-}" ]] || rm -rf "$CI_VENV"
          [[ -z "${UV_CACHE_DIR:-}" ]] || rm -rf "$UV_CACHE_DIR"
