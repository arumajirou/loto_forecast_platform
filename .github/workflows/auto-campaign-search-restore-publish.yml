name: auto-campaign-search-restore-publish

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/auto-campaign-search-integration-restore-v1'
    runs-on: [self-hosted, Linux, X64, loto-ci]
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RUNNER_NAME" = "az-loto-gpu"
          test "$RUNNER_OS" = "Linux"
          test "$RUNNER_ARCH" = "X64"

      - name: Checkout exact event head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Gate one-shot publish
        id: gate
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EVENT_HEAD"
          message="$(git log -1 --pretty=%s)"
          echo "event_head=$EVENT_HEAD"
          echo "head_message=$message"
          if [[ "$message" == "ci: publish verified AutoCampaign search integration (#201)" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install exact uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.21'
          enable-cache: false

      - name: Verify normalize and publish
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD:src/loto/auto_campaign/model_factory.py)" = "e597f4d710676815040e2fbe6ddd7812f803fcc8"
          test "$(git rev-parse HEAD:src/loto/auto_campaign/contracts.py)" = "18923413e32c1ec841bfe77d914e09a1d194e407"
          git cat-file -e 2122ec0dee7befa551eb331e598ee9a1b3965d23^{commit}

          uv python install 3.13
          venv="$RUNNER_TEMP/loto-auto-search-publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/loto-auto-search-publish-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base_root="$RUNNER_TEMP/loto-auto-search-publish-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$venv" "$cache" "$base_root"
          mkdir -p "$cache"
          uv venv "$venv" --python 3.13
          python="$venv/bin/python"
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" -e '.[api,dev,postgres]'
          UV_CACHE_DIR="$cache" uv pip install --quiet --python "$python" 'ruff==0.16.0'
          uv pip check --python "$python"
          test "$("$python" -m ruff --version)" = 'ruff 0.16.0'

          "$python" -m ruff check --select I001 --fix \
            src/loto/auto_campaign/model_factory.py \
            src/loto/auto_campaign/contracts.py \
            tests/auto_campaign/test_search_space_artifact_persistence.py
          "$python" -m ruff format \
            src/loto/auto_campaign/model_factory.py \
            src/loto/auto_campaign/contracts.py \
            tests/auto_campaign/test_search_space_artifact_persistence.py
          mapfile -t normalized < <(git diff --name-only | sort)
          test "${#normalized[@]}" -ge 1
          for path in "${normalized[@]}"; do
            case "$path" in
              src/loto/auto_campaign/model_factory.py|src/loto/auto_campaign/contracts.py|tests/auto_campaign/test_search_space_artifact_persistence.py) ;;
              *) echo "unexpected normalized path: $path"; exit 1 ;;
            esac
          done
          git diff --check
          "$python" -m ruff check src scripts tests
          "$python" -m ruff format --check \
            src/loto/auto_campaign/model_factory.py \
            src/loto/auto_campaign/contracts.py \
            tests/auto_campaign/test_search_space_artifact_persistence.py
          "$python" -m compileall -q src scripts tests
          echo 'PUBLISH_STATIC_GATES=PASS'

          set +e
          "$python" -m pytest --collect-only -q --tb=short > "$RUNNER_TEMP/collection.txt" 2>&1
          collect_rc=$?
          set -e
          test "$collect_rc" -eq 2
          "$python" - "$RUNNER_TEMP/collection.txt" <<'PY'
          import re,sys
          from pathlib import Path
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          nums=[int(m.group(1)) for m in re.finditer(r'(\d+) errors? during collection',text)]
          count=nums[-1] if nums else sum('ERROR collecting ' in line for line in text.splitlines())
          headings=set(re.findall(r'^_+ ERROR collecting (.+?) _+$',text,re.MULTILINE))
          print(f'POST_AUTO_CAMPAIGN_COLLECTION_ERRORS={count}')
          assert count==1,(count,text[-8000:])
          assert headings=={'tests/telemetry/test_otel_instrumentation_v1.py'},headings
          assert 'opentelemetry' in text
          PY

          "$python" -m pytest -q \
            tests/auto_campaign/test_search_policy_integration.py \
            tests/auto_campaign/test_search_space_artifact_persistence.py
          echo 'TARGET_AUTO_CAMPAIGN_SEARCH_TESTS=PASS'

          git worktree add --detach "$base_root" 2122ec0dee7befa551eb331e598ee9a1b3965d23
          "$python" - "$base_root" <<'PY'
          from __future__ import annotations
          import json, os, subprocess, sys
          from pathlib import Path
          candidate=Path.cwd().resolve()
          baseline=Path(sys.argv[1]).resolve()
          excluded={
              'tests/auto_campaign/test_search_policy_integration.py',
              'tests/auto_campaign/test_search_space_artifact_persistence.py',
          }
          tests=sorted(
              path.relative_to(candidate).as_posix()
              for path in (candidate/'tests/auto_campaign').glob('test_*.py')
              if path.relative_to(candidate).as_posix() not in excluded
          )
          assert len(tests)==56,len(tests)
          def run(root: Path):
              out={}
              for test in tests:
                  env=os.environ.copy(); env['PYTHONPATH']=str(root/'src')
                  proc=subprocess.run([sys.executable,'-m','pytest','-q','--tb=no',test],cwd=root,env=env,text=True,capture_output=True,check=False)
                  text=(proc.stdout or '')+'\n'+(proc.stderr or '')
                  ids=[]
                  for line in text.splitlines():
                      stripped=line.strip()
                      if stripped.startswith('FAILED ') or stripped.startswith('ERROR '):
                          ids.append(stripped.split(' - ',1)[0])
                  out[test]={'returncode':proc.returncode,'problem_ids':sorted(set(ids))}
              return out
          before=run(baseline); after=run(candidate)
          assert before==after,{key:{'baseline':before[key],'candidate':after[key]} for key in before if before[key]!=after[key]}
          passed=sum(1 for item in before.values() if item['returncode']==0)
          nonpass=len(before)-passed
          print('NON_TARGET_AUTO_CAMPAIGN_PARITY=PASS')
          print(f'PARITY_TEST_FILES={len(before)}')
          print(f'BASELINE_PASS_FILES={passed}')
          print(f'BASELINE_NONPASS_FILES={nonpass}')
          assert passed==49 and nonpass==7,(passed,nonpass)
          PY

          "$python" - <<'PY'
          import json,tempfile
          from pathlib import Path
          import optuna
          from loto.auto_campaign.contracts import CampaignConfig,SearchConfig
          from loto.auto_campaign.model_factory import _artifact_kwargs,_persist_search_space_profile,_search_materialization,_search_space_evidence_root,_search_space_profile
          from loto.models.neuralforecast_search_policy import resolve_search_policy
          from loto.models.neuralforecast_search_space_artifacts import verify_search_space_artifacts
          class Choice:
              def __init__(self,categories): self.categories=categories
          config=CampaignConfig(data_path=Path('input.csv'),search=SearchConfig(backend='optuna',strategy='auto',num_samples=10,search_seed=1))
          assert config.search.allow_fallback is False
          materialized=_search_materialization(config=config,backend='optuna',model_name='AutoNHITS',num_samples=10)
          assert isinstance(materialized.algorithm,optuna.samplers.TPESampler)
          policy=resolve_search_policy(backend='optuna',strategy='random',search_seed=1,num_samples=1,model_name='AutoTFT')
          artifact=_artifact_kwargs({'h':1},[{'argument':'h','status':'ACCEPTED'}],policy)
          assert artifact['search_policy']['search_seed']==1
          with tempfile.TemporaryDirectory() as tmp:
              trial_root=Path(tmp)/'run-1'/'trial_work'/'hpo'/'AutoNHITS'/'seed-1'
              profile=_search_space_profile(model_name='AutoNHITS',backend='ray',config_value={'input_size':Choice([12,24]),'max_steps':500},fixed_values=None)
              persisted=_persist_search_space_profile(trial_root=trial_root,profile=profile,model_name='AutoNHITS',backend='ray',alias='candidate',seed=1,num_samples=30,smoke=False)
              root=_search_space_evidence_root(trial_root)
              assert persisted['verification_status']=='PASS'
              assert verify_search_space_artifacts(root)['status']=='PASS'
              manifest=json.loads((root/'SEARCH_SPACE_PROFILE_MANIFEST.json').read_text())
              assert manifest['context']['seed']==1 and manifest['context']['num_samples']==30
          print('AUTO_CAMPAIGN_SEARCH_CONTRACT_SMOKE=PASS')
          PY

          git fetch origin fix/auto-campaign-search-integration-restore-v1
          remote_head="$(git rev-parse origin/fix/auto-campaign-search-integration-restore-v1)"
          test "$remote_head" = "$EVENT_HEAD"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/loto/auto_campaign/model_factory.py \
            src/loto/auto_campaign/contracts.py \
            tests/auto_campaign/test_search_space_artifact_persistence.py
          mapfile -t staged < <(git diff --cached --name-only | sort)
          test "${staged[*]}" = "${normalized[*]}"
          git commit -m "style(auto-campaign): normalize restored search integration (#201)"
          repaired_head="$(git rev-parse HEAD)"
          echo "REPAIRED_HEAD=$repaired_head"
          git push origin HEAD:fix/auto-campaign-search-integration-restore-v1

          git worktree remove --force "$base_root" || true
          rm -rf -- "$venv" "$cache" "$RUNNER_TEMP/collection.txt"
