name: TAJ-21 smoke format final diff

on:
  push:
    branches:
      - feat/taj21-representative-smoke-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/taj21-representative-smoke-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Format PR-owned test
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --quiet ruff==0.16.3
          python3 -m ruff format tests/test_taj21_smoke_launcher.py
          python3 -m ruff format --check tests/test_taj21_smoke_launcher.py
      - name: Commit formatted test and remove workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/taj21-smoke-format-fix.yml
          git add tests/test_taj21_smoke_launcher.py
          git diff --cached --check
          git commit -m "style: apply Ruff to TAJ-21 smoke test"
          git push origin HEAD:feat/taj21-representative-smoke-v1
