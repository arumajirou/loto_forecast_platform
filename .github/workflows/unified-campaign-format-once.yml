name: unified-campaign-format-once

on:
  push:
    branches:
      - agent/unified-all-model-all-game-evaluation-v1

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[ruff-formatted]') }}
    runs-on: [self-hosted, loto-ci]
    steps:
      - name: Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/unified-all-model-all-game-evaluation-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.11.21
          enable-cache: false

      - name: Format only unified campaign files and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          ruff_version="$(python3 - <<'PY'
          import tomllib
          with open('uv.lock', 'rb') as stream:
              lock = tomllib.load(stream)
          versions = [p['version'] for p in lock['package'] if p.get('name') == 'ruff']
          if len(versions) != 1:
              raise SystemExit(f'unexpected Ruff versions: {versions!r}')
          print(versions[0])
          PY
          )"
          uv tool run --from "ruff==$ruff_version" ruff format \
            scripts/run_unified_campaign.py \
            src/loto/evaluation/unified_campaign.py \
            tests/test_unified_campaign.py
          rm .github/workflows/unified-campaign-format-once.yml
          allowed='^(.github/workflows/unified-campaign-format-once.yml|scripts/run_unified_campaign.py|src/loto/evaluation/unified_campaign.py|tests/test_unified_campaign.py)$'
          unexpected="$(git diff --name-only | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "unexpected formatter scope:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/unified-campaign-format-once.yml \
            scripts/run_unified_campaign.py \
            src/loto/evaluation/unified_campaign.py \
            tests/test_unified_campaign.py
          if git diff --cached --quiet; then
            echo 'no formatter delta'
            exit 0
          fi
          git commit -m 'style(evaluation): apply locked Ruff formatting [ruff-formatted]'
          git push origin HEAD:agent/unified-all-model-all-game-evaluation-v1
