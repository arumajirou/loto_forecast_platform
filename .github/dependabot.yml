version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      routine-python-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "numpy"
          - "pandas"
          - "pydantic"
          - "scikit-learn"
          - "scipy"
          - "neuralforecast"
          - "torch"
          - "triton"
          - "transformers"
          - "huggingface-hub"
          - "pyarrow"
          - "fastapi"
          - "starlette"
          - "httpx"
          - "optuna-dashboard"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      routine-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
