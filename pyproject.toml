[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loto-forecast-platform"
dynamic = ["version"]
description = "Extensible, leakage-safe, multi-model Loto forecasting research and operations platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pydantic>=2.10",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "PyYAML>=6.0",
  "prometheus-client>=0.21",
  "neuralforecast==3.2.0",
  "torch==2.9.1",
  "transformers==4.57.6",
  "huggingface-hub==0.36.2",
  "pyarrow>=24.0.0,<25",
  "optuna-dashboard>=0.20.0,<0.21",
  "tabulate>=0.10.0,<0.11",
]

[project.optional-dependencies]
auto-campaign = ["optuna>=4,<5", "statsforecast>=2,<3", "psutil>=6,<8"]
api = ["fastapi>=0.141.1,<0.142", "starlette<0.49", "httpx>=0.27,<1", "uvicorn>=0.52.1"]
mlflow = ["mlflow>=3.15.1"]
dev = [
  "pytest>=8", "httpx>=0.27,<1", "pytest-cov>=5", "hypothesis>=6.165.2", "ruff>=0.16.1",
  "torch>=2.4",
  "neuralforecast>=3.0",
  "mypy>=1.14", "fastapi>=0.141.1,<0.142", "starlette<0.49", "uvicorn>=0.52.1",
  # Constitution principle III (test hermeticity): tests/test_integrated_full_features.py
  # asserts on the resolved Optuna sampler name. Without optuna installed,
  # _build_search_algorithm falls back to "library_default" and the suite verdict silently
  # changes with the environment. optuna is therefore a DEV dependency, not just a `full` one.
  "optuna>=4.0",
  # Telemetry tests import the SDK directly and exercise the OTLP exporters.
  # Keep the standard dev/test environment hermetic instead of relying on the `full` extra.
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp>=1.30",
]
postgres = ["psycopg[binary]>=3.2", "sqlalchemy>=2.0"]
full = ["fastapi>=0.141.1,<0.142", "starlette<0.49", "httpx>=0.27,<1", "uvicorn>=0.52.1", "mlflow>=3.15.1", "psycopg[binary]>=3.2", "sqlalchemy>=2.0", "pyarrow>=18", "psutil>=6", "lightgbm>=4.5", "xgboost>=2.1", "catboost>=1.2", "statsforecast>=2.0", "mlforecast>=1.0", "hierarchicalforecast>=1.0", "neuralforecast>=3.0", "optuna>=4.0", "ray[tune]>=2.56.1", "opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp>=1.30", "structlog>=25", "plotly>=6"]
frameworks = ["u8darts>=0.37", "gluonts>=0.17.0", "lightning>=2", "sktime>=0.37", "skforecast>=0.17", "reservoirpy>=0.4"]
tsfm = ["transformers>=4.50", "accelerate>=1.5", "chronos-forecasting>=2.0"]

[project.scripts]
loto-auto-campaign = "loto.entrypoints:auto_campaign_main"
loto-lab = "loto.entrypoints:kpi_lab_main"
loto = "loto.entrypoints:loto_main"
loto3 = "loto.entrypoints:loto3_main"
loto-integrity = "loto.entrypoints:integrity_main"
loto-github-audit = "loto.github_audit.cli:main"
loto-build-info = "loto.version:main"
loto-hierarchicalforecast-certify = "loto.reconciliation.portable_package_certification:main"
loto-hierarchicalforecast-verify-package = "loto.reconciliation.package_verifier:main"

[tool.setuptools.dynamic]
version = {attr = "loto.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Use importlib mode so test modules with the same basename in different
# directories do not collide in sys.modules during collection.
addopts = "--import-mode=importlib -q"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["mlflow"]

[tool.ruff.lint.per-file-ignores]
"src/loto/api/app.py" = ["B008", "E501"]
"src/loto/probabilistic/experiment_tracking.py" = ["E501"]
"src/loto/registry/full.py" = ["E501"]

[dependency-groups]
dev = [
    "allpairspy>=2.5.1",
    "openpyxl>=3.1.5",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
