schema_version: 1
run_id: darts-p10-ensemble-conformal
partition:
  train_start: 0
  train_end: 512
  calibration_start: 512
  calibration_end: 640
  evaluation_start: 640
  evaluation_end: 768
seeds: [1, 7, 19]
fold_ids: [0]
outer_workers: 8
max_gpu_jobs: 1
point_tolerance: 1.0e-12
interval_tolerance: 1.0e-12
ensembles:
  - public_name: NaiveEnsembleModel
    base_model_ids: [NaiveDrift, ExponentialSmoothing]
    train_forecasting_models: true
    num_samples: 1
    predict_likelihood_parameters: false
  - public_name: RegressionEnsembleModel
    base_model_ids: [NaiveDrift, ExponentialSmoothing]
    train_forecasting_models: true
    train_using_historical_forecasts: false
    regression_train_n_points: 64
    regression_train_num_samples: 1
    regression_train_samples_reduction: median
    regression_model_id: sklearn-ridge-v1
    num_samples: 1
    predict_likelihood_parameters: false
conformal_models:
  - public_name: ConformalNaiveModel
    base_model_id: LinearRegressionModel
    quantiles: [0.1, 0.5, 0.9]
    symmetric: true
    cal_length: 64
    cal_stride: 1
    cal_num_samples: 1
    random_state: 1
    num_samples: 1
    predict_likelihood_parameters: true
    require_median_base_parity: true
  - public_name: ConformalQRModel
    base_model_id: TFTModel-Quantile
    quantiles: [0.1, 0.5, 0.9]
    symmetric: true
    cal_length: 64
    cal_stride: 1
    cal_num_samples: 500
    random_state: 1
    num_samples: 1
    predict_likelihood_parameters: true
    require_median_base_parity: true
