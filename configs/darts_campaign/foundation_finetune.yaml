schema_version: 1
run_id: darts-p8-foundation-finetune
track: fine_tune
series_layout: position_global_sequence
input_chunk_length: [64, 512]
output_chunk_length: 16
output_chunk_shift: 0
horizon: 16
num_samples: 1
predict_likelihood_parameters: false
use_past_covariates: true
use_future_covariates: true
models:
  - public_name: Chronos2Model
    source:
      hub_model_name: amazon/chronos-2
      hub_model_revision: UNRESOLVED
      local_dir: artifacts/models/foundation/chronos2
      allow_remote_download: false
    finetuning:
      unfreeze:
        - encoder.block.*
    model_args:
      n_epochs: 1
      batch_size: 8
device:
  requested_accelerator: gpu
  devices: [0]
  allow_cpu_fallback: false
  require_gpu_pid: true
  require_vram_evidence: true
fit_args: {}
predict_args: {}
