schema_version: 1
library: statsforecast
target_version: 2.1.1
time_axis:
  mode: draw_sequence
  source_column: draw_no
  freq: 1
execution:
  outer_workers: 8
  n_jobs: 1
  seed: 1
  seeds: [1, 7, 19]
evaluation:
  primary_metric: hit_at_pm1
  secondary_metrics: [mae, mse, rmse, position_hit_at_pm1, all_position_hit_at_pm1]
  baselines: [random, fixed, mean, median, last, frequency, seasonal_naive]
certification:
  finite_required: true
  identity_columns: [unique_id, ds]
  prospective_sha256_seal: true
  holdout_unopened_until_final: true
