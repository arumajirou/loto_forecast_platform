metadata:
  neuralforecast_version: 3.2.0
  game: loto7
  horizon: 1
  generated_from_runtime_introspection: true
  eligible_auto_models: 24
policy:
  univariate_only: true
  forbidden_features:
  - hist_diff_1
  - hist_diff_7
  primary_metric: macro_mae
  secondary_metrics:
  - macro_mse
  - macro_within_1
  - all_positions_within_1
  - positive_fold_rate
  - training_seconds
search_methods:
- manual_coarse_grid
- auto_default_optuna
- auto_custom_optuna
- auto_default_ray
- auto_custom_ray
- manual_fine_grid
training_modes:
- separate
- global
- global_position
auto_wrapper_grid:
  backend:
  - optuna
  - ray
  num_samples:
  - 20
  - 50
  - 100
  - 200
  time_budget:
  - null
  - 1800
  - 3600
  refit_with_val:
  - false
  - true
  verbose:
  - true
  optuna_sampler:
  - RandomSampler
  - TPESampler
  - QMCSampler
  - CmaEsSampler
  ray_scheduler:
  - FIFOScheduler
  - ASHAScheduler
  - HyperBandScheduler
  - MedianStoppingRule
core_grid:
  local_scaler_type:
  - null
  - standard
  - robust
  - minmax
  local_static_scaler_type:
  - null
  - standard
  - robust
fit_grid:
  val_size:
  - 5
  - 10
  - 20
  - 30
  - 50
  use_init_models:
  - false
cross_validation_grid:
  n_windows:
  - 5
  - 10
  - 20
  - 50
  step_size:
  - 1
  refit:
  - false
  - 1
  - 5
  - 10
  use_init_models:
  - false
  - true
trainer_grid:
  precision:
  - 32-true
  - 16-mixed
  - bf16-mixed
  gradient_clip_val:
  - 0.0
  - 0.5
  - 1.0
  - 5.0
  gradient_clip_algorithm:
  - norm
  - value
  accumulate_grad_batches:
  - 1
  - 2
  - 4
  deterministic:
  - true
  - false
  benchmark:
  - false
  - true
point_loss_grid:
- name: MAE
  kwargs: {}
  enabled: true
- name: MSE
  kwargs: {}
  enabled: true
- name: RMSE
  kwargs: {}
  enabled: true
- name: HuberLoss
  kwargs:
    delta:
    - 0.5
    - 1.0
    - 2.0
  enabled: true
- name: TukeyLoss
  kwargs:
    c:
    - 2.0
    - 4.685
    - 8.0
  enabled: true
- name: MAPE
  kwargs: {}
  enabled: false
  reason: Potential instability for small target values
- name: SMAPE
  kwargs: {}
  enabled: false
  reason: Enable only after zero/small-value audit
- name: MASE
  kwargs:
    seasonality:
    - 1
    - 7
    - 14
  enabled: false
  reason: Requires justified seasonality
- name: relMSE
  kwargs: {}
  enabled: false
  reason: Requires benchmark semantics audit
probabilistic_loss_grid:
- name: MQLoss
  kwargs:
    level:
    - - 50
    - - 80
    - - 80
      - 90
    - - 50
      - 80
      - 90
  enabled: true
- name: DistributionLoss
  kwargs:
    distribution:
    - Normal
    - StudentT
    level:
    - - 80
    - - 80
      - 90
  enabled: true
- name: GMM
  kwargs:
    n_components:
    - 1
    - 2
    - 3
    - 5
    level:
    - - 80
    - - 80
      - 90
  enabled: true
- name: NBMM
  kwargs: {}
  enabled: false
  reason: Count-distribution suitability must be audited
- name: PMM
  kwargs: {}
  enabled: false
  reason: Count-distribution suitability must be audited
- name: Tweedie
  kwargs: {}
  enabled: false
  reason: Direct construction semantics require audit
