schema_version: 1.0.0
experiment:
  name: numbers3-n1-tcn-screening-input_size-bff6b6ffd6e3
  game: numbers3
  unique_id: N1
  horizon: 1
  data_path: data/exports/numbers3/numbers3_n1.parquet
  output_root: artifacts/numbers3/tcn-argument-search
  rolling_points: 20
  seeds:
  - 17
  - 42
  - 137
  deterministic: true
  freeze_predictions: true
search:
  input_size:
  - 64
  encoder_hidden_size:
  - 32
  context_size:
  - 10
  decoder_hidden_size:
  - 32
  kernel_size:
  - 3
  dilations:
  - - 1
    - 2
    - 4
  learning_rate:
  - 0.001
  scaler_type:
  - robust
  batch_size:
  - 32
fixed:
  h: 1
  loss: MAE
  valid_loss: MAE
  max_steps: 50
  num_lr_decays: 1
  early_stop_patience_steps: -1
  val_monitor: ptl/val_loss
  val_check_steps: 50
  valid_batch_size: null
  windows_batch_size: 256
  inference_windows_batch_size: -1
  start_padding_enabled: false
  training_data_availability_threshold: 0.0
  step_size: 1
  drop_last_loader: false
  alias: null
excluded:
  stat_exog_list: 単変量・外生変数なしの第1段階
  hist_exog_list: 単変量・外生変数なしの第1段階
  futr_exog_list: 単変量・外生変数なしの第1段階
  exclude_insample_y: TCN自己回帰入力を保持
  random_seed: experiment.seedsで制御
  optimizer: ライブラリ既定optimizerを使用
  optimizer_kwargs: optimizer固定のため既定値
  lr_scheduler: num_lr_decaysで制御
  lr_scheduler_kwargs: scheduler固定のため既定値
  dataloader_kwargs: ランタイム共通設定を使用
runtime:
  accelerator: gpu
  devices: 1
  enable_progress_bar: false
  enable_model_summary: false
  enable_checkpointing: false
  logger: false
  precision: 32-true
  deterministic: warn
verification:
  float_abs_tolerance: 1.0e-12
  prediction_abs_tolerance: 1.0e-06
  require_cuda: true
  require_finite_output: true
  require_model_save_load: true
  require_prediction_match_after_load: true
  fail_on_unclassified_argument: true
  fail_on_ignored_argument: true
